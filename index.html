<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>戰國沙盤 · 先秦形勢演變</title>
<meta name="description" content="前475—前221，二百五十四年列国形势与战事的青铜沙盘推演。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%224%22 fill=%22%23121a19%22/%3E%3Crect x=%224.5%22 y=%224.5%22 width=%2223%22 height=%2223%22 fill=%22none%22 stroke=%22%23c9a227%22 stroke-width=%222%22/%3E%3Cpath d=%22M10 10l12 12M22 10L10 22%22 stroke=%22%23c8352b%22 stroke-width=%223.2%22 stroke-linecap=%22round%22/%3E%3C/svg%3E" />
<link rel="stylesheet" href="src/style.css" />
</head>
<body>
<div class="frame">

  <header class="rail">
    <div class="rail-title">
      <h1>戰國沙盤</h1>
      <p class="rail-act"><span class="rail-act-no" id="actNo">一</span><span id="actTitle">晋亡而战国立</span></p>
    </div>
    <div class="rail-year">
      <span class="rail-year-num" id="yearBig">前475</span>
      <span class="rail-year-tag" id="yearTag">周元王元年</span>
    </div>
    <nav class="rail-layers" aria-label="图层">
      <button class="chip is-on" data-layer="relief" aria-pressed="true">山川起伏</button>
      <button class="chip is-on" data-layer="rivers" aria-pressed="true">水系</button>
      <button class="chip is-on" data-layer="walls" aria-pressed="true">长城</button>
      <button class="chip is-on" data-layer="passes" aria-pressed="true">关塞</button>
      <button class="chip is-on" data-layer="battles" aria-pressed="true">战事</button>
      <button class="chip is-on" data-layer="labels" aria-pressed="true">国名</button>
    </nav>
  </header>

  <main class="board">
    <aside class="panel panel-left">
      <button class="panel-head panel-toggle" id="btnChronPanel" aria-expanded="true" aria-controls="chron"><span>大事記</span><span class="panel-toggle-mark" aria-hidden="true">−</span></button>
      <ol class="chron" id="chron" tabindex="0" aria-label="大事记"></ol>
    </aside>

    <section class="stage">
      <canvas id="table" aria-label="战国形势沙盘"></canvas>
      <span class="voice-disclosure">AI合成讲解 · 非本人原录音</span>
      <div class="toast" id="toast" hidden></div>
      <div class="caption" id="caption" hidden>
        <div class="caption-head">
          <span class="caption-name" id="capName"></span>
          <span class="caption-year" id="capYear"></span>
          <button class="caption-close" id="capClose" aria-label="退出推演">收</button>
        </div>
        <p class="caption-line" aria-live="polite"><span class="caption-no" id="capNo">一</span><span id="capText"></span></p>
        <div class="caption-dots" id="capDots" role="group" aria-label="战役步骤"></div>
      </div>
      <div class="audio-error" id="audioError" role="alert" hidden>
        <p id="audioErrorText"></p>
        <button class="speed" id="btnRetry">重试</button>
        <button class="speed" id="btnSilent">无声继续</button>
      </div>
      <div class="stage-hint" id="hint">滚轮缩放 · 拖动移图 · 点朱砂十字看战事</div>
      <div class="stage-tools">
        <button class="tool" id="btnFit" title="复位">复位</button>
        <button class="tool" id="btnZoomIn" title="放大">＋</button>
        <button class="tool" id="btnZoomOut" title="缩小">－</button>
      </div>
      <div class="tip" id="tip" hidden></div>
      <div class="cine-hud" id="cineHud" aria-hidden="true">
        <p class="cine-act"><span id="cineActNo">一</span><span id="cineActTitle"></span></p>
        <div class="cine-year">
          <span class="cine-year-num" id="cineYear">前475</span>
          <span class="cine-year-reign" id="cineReign"></span>
        </div>
      </div>
      <div class="act-card" id="actCard" hidden>
        <div class="card-inner">
          <i class="card-rule card-rule-top"></i>
          <p class="card-eyebrow">
            <span class="card-no" id="cardNo">一</span>
            <span class="card-kicker" id="cardKicker">ACT I · 475–404 BC</span>
          </p>
          <h2 class="card-title" id="cardTitle"></h2>
          <p class="card-en" id="cardEn"></p>
          <i class="card-rule card-rule-bottom"></i>
          <p class="card-thesis" id="cardThesis"></p>
        </div>
      </div>
    </section>

    <aside class="panel panel-right">
      <details class="power-disclosure" open><summary class="panel-head"><span>國力</span></summary>
      <div class="power" id="power"></div></details>
      <button class="panel-head panel-head-mid panel-toggle" id="btnDetailPanel" aria-expanded="true" aria-controls="detail"><span>案上</span><span class="panel-toggle-mark" aria-hidden="true">−</span></button>
      <div class="detail" id="detail"></div>
    </aside>
  </main>

  <footer class="ruler-wrap">
    <div class="controls">
    <button class="play" id="btnPlay" aria-label="自动推演纪年">
      <span class="play-icon" id="playIcon">▶</span><span class="play-text" id="playText">推演</span>
    </button>
    <button class="speed" id="btnPrev" aria-label="上一事件">上一条</button>
    <button class="speed" id="btnNext" aria-label="下一事件">下一条</button>
    <select class="voice" id="btnSpeed" aria-label="播放速度">
      <option value="0.75">0.75×</option><option value="1" selected>1×</option>
      <option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option>
    </select>
    <button class="speed" id="btnSound" aria-pressed="true" title="本地生成的 AI 配音，可切换无声演示">配音开</button>
    <a class="speed" id="btnVoiceOptions" href="voices/index.html" target="_blank" rel="noopener" title="新标签页试听其他声线；保留当前讲解进度">配音试听</a>
    <button class="speed cine-btn" id="btnCinema" aria-pressed="false" title="放映：隐藏两侧，保留讲解进度">放映</button>
    </div>
    <div class="listening">
      <button class="speed" id="btnReplay" disabled>重听本段</button>
      <input id="clipSeek" type="range" min="0" max="1" step="0.05" value="0" aria-label="当前讲解片段进度" disabled />
      <span id="clipTime">0:00 / 0:00</span>
      <button class="speed" id="btnReturn" hidden>返回讲解</button>
      <button class="speed" id="btnFromHere" hidden>从此处推演</button>
      <span id="playStatus" role="status">点击推演开始讲解</span>
    </div>
    <div class="ruler" id="ruler" role="slider" tabindex="0"
         aria-label="纪年" aria-valuemin="-475" aria-valuemax="-221" aria-valuenow="-475" aria-valuetext="前475年">
      <div class="ruler-acts" id="acts"></div>
      <div class="ruler-ticks" id="ticks"></div>
      <div class="ruler-marks" id="marks"></div>
      <div class="ruler-cursor" id="cursor"><span class="ruler-cursor-year" id="cursorYear">前475</span></div>
    </div>
    <p class="disclaimer">疆域为概貌示意，非逐年精确 · 配音为 AI 合成 · <a id="btnVoiceReview" href="review/index.html" target="_blank" rel="noopener">8处读音待听审</a></p>
  </footer>

</div>
<script type="module" src="src/app.js"></script>
</body>
</html>
