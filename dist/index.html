:root {
  --void: #080b0c;
  --patina: #12181a;
  --patina-hi: #1a2220;
  --patina-edge: #2b342f;
  --bronze: #c9a227;
  --bronze-dim: #7d6822;
  --cinnabar: #c8352b;
  --cinnabar-dim: #7c2a24;
  --bone: #e8e2d2;
  --bone-2: rgba(232, 226, 210, 0.62);
  --bone-3: rgba(232, 226, 210, 0.34);

  --display: "Sandtable Serif", "Songti SC", "STSong", "Source Han Serif SC",
    "Noto Serif CJK SC", "Noto Serif SC", "SimSun", serif;
  --body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
    "Noto Sans CJK SC", system-ui, sans-serif;
  --num: ui-monospace, "SF Mono", "Menlo", "Consolas", monospace;

  --edge: 22px;          /* 盘内器具与提示的统一边距 */
  --pad: 14px;           /* 简册栏内边距 */
  --cine-x: clamp(30px, 4.6vw, 84px); /* 放映时一切左右元素的基线 */

  --rail: 66px;
  --ruler: 106px;
  --col: 262px;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  background:
    radial-gradient(120% 90% at 50% 0%, #1a2320 0%, var(--void) 72%);
  color: var(--bone);
  font-family: var(--body);
  font-size: 14px;
  line-height: 1.6;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

:focus-visible {
  outline: 2px solid var(--bronze);
  outline-offset: 2px;
}

.frame {
  display: grid;
  grid-template-rows: var(--rail) 1fr var(--ruler);
  height: 100dvh;
}

/* ── 上梁 ───────────────────────────────────────── */

.rail {
  display: flex;
  align-items: center;
  gap: 28px;
  padding: 0 20px;
  border-bottom: 1px solid var(--patina-edge);
  box-shadow: 0 1px 0 rgba(201, 162, 39, 0.16), inset 0 1px 0 rgba(232, 226, 210, 0.07);
  background: linear-gradient(180deg, #171e1d, #0d1313), var(--cast);
}

/* 铸面：细密的横纹与斑驳，令 UI 读作一块金属而非一层色块 */
:root {
  --cast:
    repeating-linear-gradient(0deg, rgba(232, 226, 210, 0.017) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.05) 0 1px, transparent 1px 5px);
}

.rail-title { display: flex; align-items: baseline; gap: 12px; }

.rail-title h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 700;
  font-size: 25px;
  letter-spacing: 0.4em;
  text-indent: 0.4em;
  color: var(--bone);
  text-shadow: 0 1px 0 #000, 0 0 22px rgba(201, 162, 39, 0.18);
}

/* 幕次：告诉眼睛此刻在读哪一段 */
.rail-act {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 0;
  font-family: var(--display);
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: var(--bone-2);
  white-space: nowrap;
}

.rail-act-no {
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  font-size: 11.5px;
  letter-spacing: 0;
  color: #0d1211;
  background: var(--bronze);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35);
}

.rail-year {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding-left: 24px;
  border-left: 1px solid var(--patina-edge);
  margin-left: auto;
  order: 3;
}

.rail-year-num {
  font-family: var(--display);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--bronze);
  font-variant-numeric: tabular-nums;
}

.rail-year-tag {
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--bone-3);
  white-space: nowrap;
}

.rail-layers { display: flex; flex-wrap: wrap; gap: 6px; order: 2; }

.chip {
  padding: 4px 10px;
  box-shadow: inset 0 1px 0 rgba(232, 226, 210, 0.06);
  font-size: 11.5px;
  letter-spacing: 0.1em;
  color: var(--bone-3);
  border: 1px solid var(--patina-edge);
  border-radius: 2px;
  transition: color 0.16s, border-color 0.16s, background 0.16s;
}

.chip:hover { color: var(--bone-2); border-color: #3c4a43; }

.chip.is-on {
  color: #f0e6c4;
  border-color: rgba(201, 162, 39, 0.55);
  background: rgba(201, 162, 39, 0.09);
}

/* ── 盘面与两侧简册 ─────────────────────────────── */

.board {
  display: grid;
  grid-template-columns: var(--col) minmax(0, 1fr) var(--col);
  min-height: 0;
}

.panel {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  min-height: 0;
  background: linear-gradient(180deg, #101717, #080d0e 62%), var(--cast);
}

.panel-left {
  border-right: 1px solid var(--patina-edge);
  grid-template-rows: auto minmax(0, 1fr);
  box-shadow: inset 0 1px 0 rgba(232, 226, 210, 0.05), inset -18px 0 26px -20px #000;
}

.panel-right {
  border-left: 1px solid var(--patina-edge);
  grid-template-rows: auto auto auto minmax(0, 1fr);
  box-shadow: inset 0 1px 0 rgba(232, 226, 210, 0.05), inset 18px 0 26px -20px #000;
}

.panel-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px var(--pad) 8px;
  border-bottom: 1px solid var(--patina-edge);
  box-shadow: inset 3px 0 0 rgba(201, 162, 39, 0.5);
}

.panel-head span {
  font-family: var(--display);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.5em;
  text-indent: 0.5em;
  color: var(--bronze);
}

.panel-head::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, rgba(201, 162, 39, 0.4), transparent);
}

.panel-head-mid { border-top: 1px solid var(--patina-edge); }

/* 大事记 —— 简牍式竖界栏 */

.chron {
  list-style: none;
  margin: 0;
  padding: 6px 0 24px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: #2b342f transparent;
}

.chron::-webkit-scrollbar { width: 6px; }
.chron::-webkit-scrollbar-thumb { background: #2b342f; }

.evt {
  position: relative;
  display: grid;
  grid-template-columns: 52px 1fr;
  gap: 10px;
  padding: 7px var(--pad) 7px 12px;
  cursor: pointer;
  border-left: 2px solid transparent;
  opacity: 0.34;
  transition: opacity 0.2s, background 0.2s, border-color 0.2s;
}

.evt.is-past { opacity: 1; }
.evt:hover { background: rgba(232, 226, 210, 0.05); }
.evt:focus-visible { outline-offset: -2px; }

.evt.is-now {
  background: rgba(200, 53, 43, 0.08);
  border-left-color: rgba(200, 53, 43, 0.6);
}

/* 点中的那一条：同年不止一事时，它与旁的分得开 */
.evt.is-picked {
  opacity: 1;
  background: rgba(200, 53, 43, 0.16);
  border-left-color: var(--cinnabar);
}

.evt-year {
  font-family: var(--num);
  font-size: 11.5px;
  color: var(--bone-3);
  padding-top: 2px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.evt.is-past .evt-year { color: var(--bronze-dim); }
.evt.is-now .evt-year { color: var(--bronze); }

.evt-body { min-width: 0; }

.evt-title {
  font-family: var(--display);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.06em;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* 类目做成小印：朱文阳刻，字为底色所刻去 */
.evt-kind {
  flex: none;
  width: 16px;
  height: 16px;
  display: grid;
  place-items: center;
  font-size: 10px;
  font-family: var(--display);
  font-weight: 700;
  line-height: 1;
  color: #0a1010;
  background: var(--seal, #6b7268);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(0, 0, 0, 0.5);
  opacity: 0.92;
}

.evt[data-kind="战"] { --seal: #c8352b; }
.evt[data-kind="变"] { --seal: #8fae4e; }
.evt[data-kind="纵"] { --seal: #4a9db4; }
.evt[data-kind="并"] { --seal: #c9a227; }
.evt[data-kind="都"] { --seal: #9b66ad; }
.evt[data-kind="学"] { --seal: #b98cc4; }
.evt[data-kind="工"] { --seal: #a8845c; }

.evt-text {
  margin: 3px 0 0;
  font-size: 12px;
  line-height: 1.62;
  color: var(--bone-3);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.evt:hover .evt-text { color: var(--bone-2); }

/* 当年之事全文展开，不必再去案上找后半句 */
.evt.is-now .evt-text,
.evt.is-picked .evt-text {
  display: block;
  overflow: visible;
  color: var(--bone-2);
}

.evt { padding-block: 5px; }
.evt.is-now { padding-block: 9px; }

/* 国力 */

.power { padding: 12px var(--pad) 14px; display: grid; gap: 9px; }

.pw { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 9px; }

.pw-name {
  font-family: var(--display);
  font-size: 16px;
  font-weight: 700;
  text-align: center;
}

.pw-bar {
  position: relative;
  height: 11px;
  overflow: hidden;
  background:
    repeating-linear-gradient(90deg, rgba(232, 226, 210, 0.13) 0 1px, transparent 1px 10%),
    linear-gradient(180deg, rgba(0, 0, 0, 0.55), rgba(232, 226, 210, 0.05));
  box-shadow: inset 0 0 0 1px rgba(232, 226, 210, 0.07);
}

.pw-fill {
  position: absolute;
  inset: 0 auto 0 0;
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  background-image: linear-gradient(180deg,
    rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.06) 46%, rgba(0, 0, 0, 0.3));
  box-shadow: 1px 0 0 rgba(232, 226, 210, 0.5);
}

.pw-num {
  font-family: var(--num);
  font-size: 11px;
  color: var(--bone-3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.pw.is-gone { opacity: 0.28; }

.pw-gone { margin: 4px 0 0; font-size: 12px; color: var(--bone-3); }

.pw-note {
  margin: 2px 0 0;
  font-size: 10.5px;
  line-height: 1.6;
  letter-spacing: 0.04em;
  color: rgba(232, 226, 210, 0.26);
}

/* 案上：详情 */

.detail {
  padding: 12px var(--pad) 22px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: #2b342f transparent;
}

.detail::-webkit-scrollbar { width: 6px; }
.detail::-webkit-scrollbar-thumb { background: #2b342f; }

.dt-eyebrow {
  font-size: 10.5px;
  letter-spacing: 0.28em;
  color: var(--bone-3);
  margin: 0 0 4px;
}

.dt-title {
  font-family: var(--display);
  font-size: 21px;
  font-weight: 700;
  letter-spacing: 0.1em;
  margin: 0 0 2px;
  color: var(--bone);
}

.dt-title.is-war { color: #f0a99f; }

.dt-sub {
  font-family: var(--num);
  font-size: 11px;
  color: var(--bronze-dim);
  margin: 0 0 12px;
}

.dt-row { margin: 0 0 10px; }

.dt-key {
  font-size: 10.5px;
  letter-spacing: 0.22em;
  color: var(--bone-3);
  margin: 0 0 2px;
}

.dt-val { margin: 0; font-size: 13px; line-height: 1.7; color: var(--bone-2); }
.dt-val strong { color: var(--bone); font-weight: 600; }

.dt-weight {
  margin: 12px 0 0;
  padding: 9px 11px;
  font-size: 12.5px;
  line-height: 1.7;
  color: #e6d8b4;
  border-left: 2px solid var(--bronze);
  background: rgba(201, 162, 39, 0.07);
}

.dt-march {
  margin-top: 14px;
  width: 100%;
  padding: 9px 0;
  font-size: 12.5px;
  letter-spacing: 0.28em;
  text-indent: 0.28em;
  color: #f2ded9;
  border: 1px solid var(--cinnabar-dim);
  background: rgba(200, 53, 43, 0.12);
  transition: background 0.18s, border-color 0.18s;
}

.dt-march:hover { background: rgba(200, 53, 43, 0.24); border-color: var(--cinnabar); }

.dt-empty { color: var(--bone-3); font-size: 12.5px; line-height: 1.8; margin: 0; }
.dt-empty b { color: var(--bone-2); font-weight: 500; }

/* 本幕战事：可直接点开推演 */
.dt-wars { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 1px; }

.dt-wars button {
  display: flex;
  align-items: baseline;
  gap: 9px;
  width: 100%;
  padding: 5px 8px 5px 0;
  text-align: left;
  font-size: 13px;
  color: var(--bone-2);
  border-left: 2px solid transparent;
  padding-left: 8px;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}

.dt-wars button:hover {
  color: #f2ded9;
  border-left-color: var(--cinnabar);
  background: rgba(200, 53, 43, 0.1);
}

.dt-wars i {
  flex: none;
  font-family: var(--num);
  font-style: normal;
  font-size: 11px;
  color: var(--bronze-dim);
}

/* ── 盘 ─────────────────────────────────────────── */

.stage {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: #06090a;
  box-shadow:
    inset 0 0 0 1px rgba(201, 162, 39, 0.08),
    inset 0 0 120px rgba(0, 0, 0, 0.95);
}

/* 斜上方的一点余光，令盘面像被照着，而非自发光 */
.stage::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(70% 55% at 26% 12%, rgba(255, 236, 190, 0.055), transparent 62%),
    radial-gradient(120% 90% at 50% 50%, transparent 52%, rgba(0, 0, 0, 0.5) 100%);
}

/* 绝对定位：canvas 的属性高度若参与栅格计算，会把行撑大再反过来放大画布 */
#table {
  position: absolute;
  inset: 0;
  display: block;
  touch-action: none;
  width: 100%;
  height: 100%;
  cursor: grab;
  opacity: 0;
  animation: settle 1.1s 0.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

#table.is-dragging { cursor: grabbing; }

@keyframes settle {
  from { opacity: 0; transform: scale(1.015); filter: blur(6px); }
  to { opacity: 1; transform: none; filter: none; }
}

.stage-hint {
  position: absolute;
  left: var(--edge);
  bottom: 12px;
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--bone-3);
  pointer-events: none;
  transition: opacity 0.6s;
}

.stage-hint.is-hidden { opacity: 0; }

.stage-tools { position: absolute; right: var(--edge); bottom: 12px; display: flex; gap: 5px; }

.tool {
  min-width: 30px;
  height: 28px;
  padding: 0 8px;
  font-size: 12px;
  color: var(--bone-3);
  border: 1px solid var(--patina-edge);
  background: rgba(8, 12, 12, 0.72);
  transition: color 0.16s, border-color 0.16s;
}

.tool:hover { color: var(--bone); border-color: var(--bronze-dim); }

.tip {
  position: absolute;
  z-index: 5;
  padding: 6px 9px;
  pointer-events: none;
  font-size: 12px;
  line-height: 1.5;
  color: var(--bone);
  background: rgba(9, 13, 13, 0.94);
  border: 1px solid var(--patina-edge);
  border-left: 2px solid var(--bronze);
  white-space: nowrap;
  transform: translate(12px, -50%);
}

.tip.is-left { transform: translate(calc(-100% - 12px), -50%); border-left: 0; border-right: 2px solid var(--bronze); }

.tip b { font-family: var(--display); font-weight: 700; letter-spacing: 0.08em; }
.tip span { color: var(--bone-3); }

/* 易主提示：盘上闪一下的同时，说清楚是什么易了主 */
.toast {
  position: absolute;
  top: var(--edge);
  left: 50%;
  z-index: 6;
  padding: 7px 14px;
  font-size: 12.5px;
  letter-spacing: 0.08em;
  color: #f2ead2;
  white-space: nowrap;
  background: rgba(10, 14, 14, 0.9);
  border: 1px solid rgba(201, 162, 39, 0.4);
  border-left: 2px solid var(--bronze);
  opacity: 0;
  transform: translate(-50%, -6px);
  transition: opacity 0.35s, transform 0.35s;
  pointer-events: none;
}

.toast.is-in { opacity: 1; transform: translate(-50%, 0); }

/* 推演字幕：解说贴在盘上，眼睛不必两头跑 */
.caption {
  position: absolute;
  left: 50%;
  bottom: 16px;
  z-index: 6;
  width: min(560px, calc(100% - 32px));
  transform: translateX(-50%);
  padding: 11px 14px 12px;
  background: linear-gradient(180deg, rgba(12, 16, 16, 0.94), rgba(8, 11, 11, 0.97));
  border: 1px solid var(--patina-edge);
  border-top: 2px solid var(--cinnabar);
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
  animation: rise 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}

@keyframes rise {
  from { opacity: 0; transform: translate(-50%, 12px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

.caption-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 7px;
}

.caption-name {
  font-family: var(--display);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: #f4b6ac;
}

.caption-year {
  font-family: var(--num);
  font-size: 11px;
  color: var(--bone-3);
}

.caption-close {
  margin-left: auto;
  padding: 2px 9px;
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--bone-3);
  border: 1px solid var(--patina-edge);
}

.caption-close:hover { color: var(--bone); border-color: var(--bronze-dim); }

.caption-line {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin: 0;
  font-size: 14px;
  line-height: 1.65;
  color: var(--bone);
  text-wrap: pretty;
}

.caption-no {
  flex: none;
  display: grid;
  place-items: center;
  width: 21px;
  height: 21px;
  font-family: var(--display);
  font-weight: 700;
  font-size: 12px;
  color: #120b0a;
  background: var(--cinnabar);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35);
}

.caption.is-final .caption-no { background: var(--bronze); color: #131009; }

/* 讲解：随年而来的事，用铜色，与朱砂的战事分开 */
.caption.is-lore { border-top-color: var(--bronze); }
.caption.is-lore .caption-name { color: #f0e2b8; }
.caption.is-lore .caption-no { background: var(--seal, var(--bronze)); color: #0d1211; }
.caption.is-lore .caption-dots { display: none; }
.caption.is-lore .caption-line { color: var(--bone-2); }
.caption.is-final .caption-line { color: #f0e4c6; }

.caption-dots { display: flex; gap: 4px; margin-top: 9px; }

.caption-dots i {
  height: 2px;
  flex: 1;
  background: rgba(232, 226, 210, 0.14);
  transition: background 0.3s;
}

.caption-dots i.is-done { background: var(--cinnabar); }

/* 推演进行时，两侧退居其后 */
body.is-marching .panel-left,
body.is-marching .rail-layers,
body.is-marching .disclaimer {
  opacity: 0.32;
  transition: opacity 0.4s;
}

body.is-marching .power { opacity: 0.45; transition: opacity 0.4s; }

body.is-marching .stage-hint { opacity: 0; }

/* ── 铜尺纪年 ───────────────────────────────────── */

.controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.voice {
  align-self: center;
  max-width: 150px;
  padding: 5px 7px;
  font-family: var(--body);
  font-size: 11px;
  color: var(--bone-2);
  background: #0d1414;
  border: 1px solid var(--patina-edge);
  border-radius: 0;
}

.ruler-wrap {
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: 18px;
  padding: 0 22px;
  border-top: 1px solid var(--patina-edge);
  box-shadow: 0 -1px 0 rgba(201, 162, 39, 0.16);
  background: linear-gradient(180deg, #0d1313, #171e1d), var(--cast);
}

.play {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 15px;
  color: var(--bone-2);
  border: 1px solid var(--patina-edge);
  background: linear-gradient(180deg, rgba(232, 226, 210, 0.05), transparent);
  box-shadow: inset 0 1px 0 rgba(232, 226, 210, 0.07);
  transition: color 0.16s, border-color 0.16s, background 0.16s;
}

.play:hover { color: var(--bone); border-color: var(--bronze-dim); background: rgba(201, 162, 39, 0.07); }
.play-icon { font-size: 11px; color: var(--bronze); width: 10px; }
.play-text { font-size: 12px; letter-spacing: 0.24em; text-indent: 0.24em; }

.speed {
  padding: 5px 9px;
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--bone-3);
  border: 1px solid var(--patina-edge);
  transition: color 0.16s, border-color 0.16s, background 0.16s;
}

.speed:hover { color: var(--bone-2); border-color: #3c4a43; }

.speed[disabled] { opacity: 0.35; cursor: not-allowed; }
.speed[disabled]:hover { color: var(--bone-3); border-color: var(--patina-edge); }

.speed[aria-pressed="true"] {
  color: #f0e6c4;
  border-color: rgba(201, 162, 39, 0.55);
  background: rgba(201, 162, 39, 0.1);
}

.ruler {
  position: relative;
  height: 66px;
  cursor: pointer;
  touch-action: none;
}

.ruler-ticks, .ruler-marks, .ruler-acts { position: absolute; inset: 0; }

/* 幕次分段：铜尺上的六个刻度区 */
.act {
  position: absolute;
  top: 0;
  height: 17px;
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 0 6px;
  overflow: hidden;
  font-size: 10.5px;
  letter-spacing: 0.12em;
  white-space: nowrap;
  color: rgba(232, 226, 210, 0.3);
  border-left: 1px solid rgba(201, 162, 39, 0.28);
  background: rgba(232, 226, 210, 0.03);
  transition: color 0.2s, background 0.2s;
}

.act b {
  font-family: var(--display);
  font-size: 10px;
  color: var(--bronze-dim);
  font-weight: 700;
}

.act:hover { color: var(--bone-2); background: rgba(201, 162, 39, 0.08); }

.act.is-now {
  color: #f0e6c4;
  background: rgba(201, 162, 39, 0.13);
  border-left-color: var(--bronze);
}

.act.is-now b { color: var(--bronze); }

.tick {
  position: absolute;
  bottom: 14px;
  width: 1px;
  background: rgba(201, 162, 39, 0.28);
}

.tick.is-major { background: rgba(201, 162, 39, 0.55); }

.tick-label {
  position: absolute;
  bottom: 0;
  transform: translateX(-50%);
  font-family: var(--num);
  font-size: 10px;
  color: var(--bone-3);
  white-space: nowrap;
}

.mark {
  position: absolute;
  top: 21px;
  width: 2px;
  height: 9px;
  background: var(--cinnabar);
  opacity: 0.75;
  transform: translateX(-1px);
}

.ruler-cursor {
  position: absolute;
  top: 17px;
  bottom: 12px;
  width: 2px;
  margin-left: -1px;
  background: var(--bronze);
  box-shadow: 0 0 12px rgba(201, 162, 39, 0.6);
  transition: left 0.12s linear;
}

.ruler-cursor::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -6px;
  width: 0;
  height: 0;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-bottom-color: var(--bronze);
}

.ruler-cursor-year {
  position: absolute;
  top: -1px;
  left: 7px;
  font-family: var(--num);
  font-size: 11px;
  color: var(--bronze);
  white-space: nowrap;
}

.ruler-cursor-year.is-flipped { left: auto; right: 7px; }

.disclaimer {
  grid-column: 1 / -1;
  margin: -6px 0 8px;
  font-size: 10.5px;
  letter-spacing: 0.08em;
  color: rgba(232, 226, 210, 0.24);
}

/* ── 窄屏 ───────────────────────────────────────── */

@media (max-width: 1080px) {
  :root { --col: 216px; }
  .rail-layers { display: none; }
}

@media (max-width: 900px) {
  .act span { display: none; }
  .act { justify-content: center; padding: 0; }
}

@media (max-width: 820px) {
  body { overflow: auto; }
  .frame { grid-template-rows: auto auto auto; height: auto; min-height: 100dvh; }
  .rail { height: auto; flex-wrap: wrap; gap: 10px 18px; padding: 12px 16px; }
  .rail-year { order: 2; margin-left: auto; padding-left: 16px; }
  .board { grid-template-columns: 1fr; }
  .stage { height: 62vh; min-height: 380px; order: -1; }
  .panel-left, .panel-right { border: 0; border-top: 1px solid var(--patina-edge); }
  .chron { max-height: 300px; }
  .detail { max-height: 340px; }
  .ruler-wrap {
    position: sticky;
    bottom: 0;
    z-index: 10;
    grid-template-columns: minmax(0, 1fr);
    padding: 8px 14px 4px;
    gap: 2px;
  }
  .controls { flex-wrap: wrap; gap: 6px; }
  .ruler { height: 58px; }
  .disclaimer { margin: 0 0 4px; font-size: 10px; letter-spacing: 0.02em; }
  .play { padding: 7px 10px; }
  .play-text { letter-spacing: 0.1em; text-indent: 0.1em; }
  .speed { padding: 5px 6px; letter-spacing: 0.04em; }
  .caption { bottom: 10px; padding: 9px 11px 10px; }
  .caption-line { font-size: 13px; }
  body.is-marching .panel-left { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  #table { animation: none; opacity: 1; }
  * { transition-duration: 0.01ms !important; }
}


/* ── 放映：片头式的字、抹开的细线、调过色的画面 ───── */

.cine-btn[aria-pressed="true"] {
  color: #f4ded6;
  border-color: var(--cinnabar-dim);
  background: rgba(200, 53, 43, 0.16);
}

.cine-hud,
.act-card { display: none; }

body.is-cinema { overflow: hidden; }
body.is-cinema .board { grid-template-columns: minmax(0, 1fr); }
body.is-cinema .panel,
body.is-cinema .rail-layers,
body.is-cinema .stage-tools,
body.is-cinema .stage-hint,
body.is-cinema .disclaimer,
body.is-cinema .tick-label,
body.is-cinema .ruler-cursor-year { display: none; }

body.is-cinema .rail {
  height: 46px;
  border-bottom-color: transparent;
  box-shadow: none;
  background: linear-gradient(180deg, rgba(6, 9, 10, 0.9), transparent);
}

body.is-cinema .rail-title h1 { font-size: 15px; opacity: 0.5; letter-spacing: 0.5em; }
body.is-cinema .rail-act,

<script type="module">
// 投影与几何：把经纬度压成沙盘平面坐标，并用半平面裁剪求 Voronoi 分区。

const PROJ = { lon0: 113, lat0: 33, k: 100, cos: Math.cos((33 * Math.PI) / 180) };

function project([lon, lat]) {
  return {
    x: (lon - PROJ.lon0) * PROJ.cos * PROJ.k,
    y: -(lat - PROJ.lat0) * PROJ.k,
  };
}

function projectAll(pts) {
  return pts.map(project);
}

function bounds(pts) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of pts) {
    if (p.x < x0) x0 = p.x;
    if (p.y < y0) y0 = p.y;
    if (p.x > x1) x1 = p.x;
    if (p.y > y1) y1 = p.y;
  }
  return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
}

// 以 seed 为内侧，用 seed / other 的中垂线裁剪多边形（Sutherland–Hodgman）。
function clipBisector(poly, seed, other) {
  const dx = seed.x - other.x;
  const dy = seed.y - other.y;
  const c = (other.x * other.x + other.y * other.y - seed.x * seed.x - seed.y * seed.y) / 2;
  const f = (p) => p.x * dx + p.y * dy + c; // > 0 表示离 seed 更近
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i];
    const b = poly[(i + 1) % poly.length];
    const fa = f(a);
    const fb = f(b);
    if (fa >= 0) out.push(a);
    if ((fa >= 0) !== (fb >= 0)) {
      const t = fa / (fa - fb);
      out.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
    }
  }
  return out;
}

function voronoi(seeds, boundary) {
  return seeds.map((seed) => {
    let poly = boundary;
    for (const other of seeds) {
      if (other === seed) continue;
      poly = clipBisector(poly, seed, other);
      if (poly.length < 3) return [];
    }
    return dedupe(poly);
  });
}

function dedupe(poly) {
  const out = [];
  for (const p of poly) {
    const last = out[out.length - 1];
    if (!last || Math.hypot(last.x - p.x, last.y - p.y) > 1e-7) out.push(p);
  }
  if (out.length > 1) {
    const first = out[0];
    const last = out[out.length - 1];
    if (Math.hypot(first.x - last.x, first.y - last.y) < 1e-7) out.pop();
  }
  return out;
}

// 每条边找出邻接单元；找不到的即海岸／图幅边界。
function buildAdjacency(cells, seeds) {
  return cells.map((poly, i) => {
    const seed = seeds[i];
    return poly.map((a, j) => {
      const b = poly[(j + 1) % poly.length];
      const mx = (a.x + b.x) / 2;
      const my = (a.y + b.y) / 2;
      const dSelf = Math.hypot(mx - seed.x, my - seed.y);
      let best = -1;
      let bestD = Infinity;
      for (let k = 0; k < seeds.length; k++) {
        if (k === i) continue;
        const d = Math.hypot(mx - seeds[k].x, my - seeds[k].y);
        if (d < bestD) { bestD = d; best = k; }
      }
      return Math.abs(bestD - dSelf) < dSelf * 1e-6 ? best : -1;
    });
  });
}



function pointInPolygon(px, py, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i];
    const b = poly[j];
    if ((a.y > py) !== (b.y > py) && px < ((b.x - a.x) * (py - a.y)) / (b.y - a.y) + a.x) {
      inside = !inside;
    }
  }
  return inside;
}

// 沿折线按比例取点，用于行军箭头的逐段推进。
function resample(path, n) {
  const segs = [];
  let total = 0;
  for (let i = 1; i < path.length; i++) {
    const d = Math.hypot(path[i].x - path[i - 1].x, path[i].y - path[i - 1].y);
    segs.push(d);
    total += d;
  }
  const out = [];
  for (let s = 0; s <= n; s++) {
    let want = (total * s) / n;
    let i = 0;
    while (i < segs.length && want > segs[i]) { want -= segs[i]; i++; }
    if (i >= segs.length) { out.push(path[path.length - 1]); continue; }
    const t = segs[i] === 0 ? 0 : want / segs[i];
    out.push({
      x: path[i].x + (path[i + 1].x - path[i].x) * t,
      y: path[i].y + (path[i + 1].y - path[i].y) * t,
    });
  }
  return out;
}

// 卡特姆–罗姆样条，山川与行军路线用它去掉折角。
function smooth(points, tension = 0.5, steps = 12) {
  if (points.length < 3) return points.slice();
  const pts = [points[0], ...points, points[points.length - 1]];
  const out = [];
  for (let i = 1; i < pts.length - 2; i++) {
    const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2];
    for (let s = 0; s < steps; s++) {
      const t = s / steps;
      const t2 = t * t;
      const t3 = t2 * t;
      out.push({
        x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t * 2 * tension +
          (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
        y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t * 2 * tension +
          (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3),
      });
    }
  }
  out.push(points[points.length - 1]);
  return out;
}

// —— 让计算出来的边界像画出来的 ——
// 直接用 Voronoi 的直边，一眼就是算法。沿边加分形扰动即可读作疆界；
// 扰动量只取决于点的位置与边的规范朝向，故相邻两格共用的那条边不会裂开。

function hash2(x, y) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// 逐行求交填充，比逐点做内外判定快两个数量级
function scanlineMask(poly, w, h, b) {
  const mask = new Uint8Array(w * h);
  const sx = w / b.w;
  const sy = h / b.h;
  const xs = [];
  for (let gy = 0; gy < h; gy++) {
    const py = b.y0 + (gy + 0.5) / sy;
    xs.length = 0;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const a = poly[i];
      const c = poly[j];
      if ((a.y > py) !== (c.y > py)) xs.push(a.x + ((py - a.y) * (c.x - a.x)) / (c.y - a.y));
    }
    xs.sort((p, q) => p - q);
    for (let k = 0; k + 1 < xs.length; k += 2) {
      const from = Math.max(0, Math.ceil((xs[k] - b.x0) * sx - 0.5));
      const to = Math.min(w - 1, Math.floor((xs[k + 1] - b.x0) * sx - 0.5));
      for (let gx = from; gx <= to; gx++) mask[gy * w + gx] = 1;
    }
  }
  return mask;
}

function valueNoise(x, y) {
  const xi = Math.floor(x);
  const yi = Math.floor(y);
  const xf = x - xi;
  const yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi);
  const b = hash2(xi + 1, yi);
  const c = hash2(xi, yi + 1);
  const d = hash2(xi + 1, yi + 1);
  return (a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v) * 2 - 1;
}

function fbm(x, y) {
  let sum = 0;
  let amp = 1;
  let f = 1;
  for (let i = 0; i < 3; i++) {
    sum += valueNoise(x * f, y * f) * amp;
    amp *= 0.5;
    f *= 2.1;
  }
  return sum / 1.75;
}

// 规范朝向：两端点按 (x,y) 排序，使同一条边无论从哪一格看过去都得到同一串点
function warpEdge(a, b, { scale = 0.012, amp = 0.14, max = 18, steps = 6 } = {}) {
  const flip = a.x > b.x || (a.x === b.x && a.y > b.y);
  const p = flip ? b : a;
  const q = flip ? a : b;
  const dx = q.x - p.x;
  const dy = q.y - p.y;
  const len = Math.hypot(dx, dy);
  if (len < 1e-6) return [];
  const nx = -dy / len;
  const ny = dx / len;
  const w = Math.min(len * amp, max);
  const out = [];
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const x = p.x + dx * t;
    const y = p.y + dy * t;
    const d = fbm(x * scale, y * scale) * w * Math.sin(Math.PI * t);
    out.push({ x: x + nx * d, y: y + ny * d });
  }
  return flip ? out.reverse() : out;
}

// 把一条闭合或开放折线整体加扰，返回加密后的点串与各原始边所占的区段
function warpRing(pts, closed = true, opts) {
  const ring = [];
  const spans = [];
  const n = closed ? pts.length : pts.length - 1;
  for (let i = 0; i < n; i++) {
    const a = pts[i];
    const b = pts[(i + 1) % pts.length];
    const start = ring.length;
    ring.push(a, ...warpEdge(a, b, opts));
    spans.push({ start, count: ring.length - start + 1 });
  }
  if (!closed) ring.push(pts[pts.length - 1]);
  return { ring, spans };
}

  { year: -440, approx: true, kind: '学', title: '墨子止楚攻宋', at: [112.19, 30.42], text: '公输般为云梯，墨翟行十日十夜至郢，解带为城、以牒为械，九攻九拒而械尽。楚王遂罢兵。' },
  { year: -422, approx: true, kind: '变', title: '李悝相魏', at: [111.22, 35.14], text: '尽地力之教；籴甚贵伤民、甚贱伤农，故行平籴以敛散；著《法经》六篇。变法自此为战国之通例。' },
  { year: -409, approx: true, kind: '变', title: '吴起为西河守', at: [110.3, 35.6], text: '魏武卒之制（见《荀子·议兵》）：衣三属之甲、操十二石之弩、负矢五十，日中而趋百里，中试者复其户。' },
  { year: -403, kind: '纵', title: '周威烈王命三晋为诸侯', at: [112.45, 34.68], text: '名分既坏，君臣之礼遂亡。《资治通鉴》以此年开卷，谓「非三晋之坏礼，乃天子自坏之」。' },
  { year: -396, kind: '变', title: '魏文侯卒', at: [111.22, 35.14], text: '在位五十年（据《竹书纪年》），魏为天下第一强。武侯继之，公叔为相而忌吴起，起遂去魏奔楚。' },
  { year: -386, kind: '并', title: '田氏代齐', at: [118.31, 36.87], text: '周安王列田和为诸侯。七年后齐康公卒，吕氏绝祀——太公望之齐，遂为陈完之后所有。' },
  { year: -382, approx: true, kind: '变', title: '吴起变法于楚', at: [112.19, 30.42], text: '废公族疏远者以抚养战斗之士，明法审令，捐不急之官。南平百越，北并陈蔡、却三晋，西伐秦。' },
  { year: -381, kind: '变', title: '楚悼王卒，吴起被诛', at: [112.19, 30.42], text: '宗室大臣射起于王尸之上。肃王立，以中王尸罪夷宗死者七十余家——变法虽废，王权反强。' },
  { year: -376, kind: '并', title: '晋绝祀', at: [111.4, 35.62], text: '韩赵魏废晋静公为庶人，尽分其地。唐叔虞之封，至此六百余年而终。' },
  { year: -375, kind: '并', title: '韩灭郑', at: [113.72, 34.4], text: '郑自桓公受封，四百三十余年而亡。韩徙都新郑，据中原腹心。' },
  { year: -374, approx: true, kind: '学', title: '稷下学宫', at: [118.31, 36.87], text: '田齐设学宫于稷门之下，「不治而议论」。淳于髡、邹衍、慎到、荀卿先后居之，天下辩士辐辏于临淄。' },
  { year: -370, kind: '战', title: '魏之内乱', at: [111.22, 35.14], text: '武侯卒而未立太子，公中缓与惠王争立；韩赵合兵，败魏于浊泽而围惠王。二国意见不合，引兵而去，魏得以不分。' },
  { year: -361, kind: '都', title: '魏徙都大梁', at: [114.35, 34.79], text: '惠王自安邑东迁（据《竹书纪年》；《史记》系于前340），图霸中原。然大梁居四战之地，西顾河西，鞭长莫及。' },
  { year: -361, kind: '变', title: '秦孝公求贤令', at: [109.24, 34.66], text: '「宾客群臣有能出奇计强秦者，吾且尊官，与之分土。」卫鞅闻是令下，乃西入秦。' },
  { year: -356, kind: '变', title: '商鞅第一次变法', at: [109.24, 34.66], text: '什伍连坐、告奸者与斩敌同赏、有军功者各以率受上爵、宗室非有军功论不得为属籍。徙木立信，法乃行。' },
  { year: -350, kind: '变', title: '商鞅第二次变法·徙都咸阳', at: [108.72, 34.35], text: '集小乡邑聚为县，凡三十一县；为田开阡陌封疆，平斗桶权衡丈尺。秦自此耕战一体，赏罚必信。' },
  { year: -344, kind: '纵', title: '逢泽之会', at: [114.35, 34.79], text: '魏惠王率十二诸侯朝天子，乘夏车、称夏王。霸业之顶，亦其转折——齐楚由是恶之。' },
  { year: -340, kind: '战', title: '商鞅诈虏公子卬', at: [110.2, 35.4], text: '卫鞅与魏公子卬约会盟，饮而伏甲虏之，因攻其军，尽破之。魏惠王叹「寡人恨不用公叔座之言也」。秦封鞅于商於十五邑，号商君。' },
  { year: -338, kind: '变', title: '商鞅车裂', at: [108.72, 34.35], text: '孝公卒，惠文王立，商君亡至关下，舍人不知其是商君而拒之——「为法之敝，一至此哉」。人被车裂，而《韩非子》谓「秦法未败也」。' },
  { year: -334, kind: '纵', title: '徐州相王', at: [117.2, 35.0], text: '齐魏会于徐州而互尊为王。周天子之号自此不足贵，天下遂无共主。' },
  { year: -328, kind: '纵', title: '张仪相秦', at: [108.72, 34.35], text: '连横之术起：事一强以攻众弱。散六国之从而使之西面事秦，一辩士之口，胜十万之师。' },
  { year: -325, kind: '纵', title: '秦惠文君称王', at: [108.72, 34.35], text: '秦亦称王，明年改元。王号自此遍于诸侯，周天子徒存其名。' },
  { year: -323, kind: '纵', title: '五国相王', at: [114.2, 38.32], text: '公孙衍倡议，魏、韩、赵、燕、中山互尊为王。齐耻与中山并王，欲伐之以废其号；赵武灵王曰「无其实，敢处其名乎」，令国人称己为君。' },
  { year: -320, approx: true, kind: '学', title: '孟子见梁惠王', at: [114.35, 34.79], text: '「王何必曰利？亦有仁义而已矣。」惠王以为迂远而阔于事情，未能用——然其言二千年后犹在。' },
  { year: -316, kind: '纵', title: '燕王哙让国于子之', at: [116.4, 39.9], text: '效尧舜之禅而不度其时，国大乱。齐宣王乘之，五旬而举燕——让国之美名，几亡其社稷。' },
  { year: -314, kind: '并', title: '齐取燕', at: [116.4, 39.9], text: '齐师入蓟，燕王哙死，子之被醢。诸侯将谋救燕，齐乃引去。燕人立昭王，二十八年后之复仇自此始。' },
  { year: -311, kind: '变', title: '燕昭王招贤', at: [116.4, 39.9], text: '卑身厚币以招贤者，为郭隗改筑宫而师事之——「先从隗始」。乐毅自魏往，邹衍自齐往，剧辛自赵往，士争趋燕。后世所谓黄金台，即附会此事。' },
  { year: -307, kind: '变', title: '赵武灵王胡服骑射', at: [114.49, 36.6], text: '去长裾而习骑射，排众议而行之。其后北破林胡、楼烦，辟地千里，置云中、雁门、代郡，赵遂以骑兵称雄。' },
  { year: -306, kind: '并', title: '楚灭越', at: [120.6, 30.0], text: '越内乱，楚乘之，尽取故吴地至浙江（一说事在前334楚威王时）。越以此散，诸族子争立，滨于江南海上，服朝于楚。' },
  { year: -299, kind: '纵', title: '楚怀王入秦', at: [110.6, 33.5], text: '不听屈原之谏而赴武关之会，遂被扣于咸阳，三年而客死。诸侯由是不直秦——然亦无人能伐。' },
  { year: -296, kind: '并', title: '赵灭中山', at: [114.2, 38.32], text: '迁其王于肤施。白狄之国，五世而终。赵地南北始连成一片。' },
  { year: -295, kind: '变', title: '沙丘之变', at: [115.0, 37.4], text: '武灵王欲分赵而王公子章于代，未决。章作乱，公子成、李兑攻之；主父困于沙丘宫三月余，探爵鷇而食，遂饿死。' },
  { year: -288, kind: '纵', title: '秦称西帝·齐称东帝', at: [118.31, 36.87], text: '秦昭王约齐湣王并称帝。苏代（一说苏秦）说齐去帝号以孤秦，齐从之，秦亦不能独帝——然天下已知只余两极。' },
  { year: -287, kind: '纵', title: '苏秦约五国攻秦', at: [113.25, 34.85], text: '苏秦为燕昭王入齐，阳为齐谋而阴图之。是年约齐、赵、魏、韩、燕攻秦，兵至成皋而止；秦为之废帝请服，归魏赵之地以和。《史记》置苏秦于张仪之前、佩六国相印云云，据马王堆帛书《战国纵横家书》知其多误。' },
  { year: -286, kind: '并', title: '齐灭宋', at: [115.65, 34.41], text: '取膏腴之地而结怨于天下。宋康王偃射天笞地，号「桀宋」，然其地富，诸侯皆欲之。' },
  { year: -283, kind: '纵', title: '完璧归赵', at: [108.72, 34.35], text: '蔺相如奉璧入秦，倚柱怒发，秦不予城而璧完归。小国之尊严，有时只在一人之胆。' },
  { year: -279, kind: '纵', title: '渑池之会', at: [111.76, 34.77], text: '秦王令赵王鼓瑟，相如请秦王击缶，以颈血溅之相胁。归而位在廉颇之上，遂有负荆之请。' },
  { year: -278, kind: '学', title: '屈原沉江', at: [113.07, 28.8], text: '郢既破，相传是年屈原怀石自沉于汨罗。「亦余心之所善兮，虽九死其犹未悔。」' },
  { year: -276, kind: '纵', title: '信陵君封', at: [114.35, 34.79], text: '魏公子无忌仁而下士，食客三千。诸侯以公子贤，十余年不敢加兵谋魏。' },
  { year: -270, kind: '变', title: '范雎入秦', at: [108.72, 34.35], text: '折胁摺齿而逃于秦，说昭王曰：「闻秦之有太后、穰侯、华阳、高陵、泾阳，不闻其有王也。」' },
  { year: -268, kind: '纵', title: '远交近攻', at: [113.25, 35.05], text: '「得寸则王之寸也，得尺亦王之尺也。」秦用其策，先伐魏取怀——秦之战略自此由掠地转为夺国，所并者不复归还。' },
  { year: -266, kind: '变', title: '范雎为相，废穰侯', at: [108.72, 34.35], text: '收魏冉之权，逐泾阳、高陵于关外，太后废。秦王之权自此一统于上。' },
  { year: -262, kind: '纵', title: '上党献赵', at: [112.9, 36.3], text: '韩以上党予秦，守冯亭不肯，转献于赵。平原君曰「发百万之军而攻，逾岁未得一城，今坐受城市邑十七，此大利也」——赵遂受之。' },
  { year: -259, kind: '纵', title: '秦王政生于邯郸', at: [114.49, 36.6], text: '子楚为质于赵，吕不韦以为「奇货可居」。是岁正月生政，三十八年后海内一统。' },
  { year: -257, kind: '纵', title: '毛遂自荐', at: [114.88, 33.73], text: '平原君之楚请救，门下毛遂请行，按剑历阶而说楚王，一言而定纵约。「三寸之舌，强于百万之师。」' },
  { year: -256, kind: '并', title: '秦灭西周·楚灭鲁', at: [112.45, 34.68], text: '秦攻西周，周赧王卒，九鼎入秦，周天子之统至此而绝。同年楚伐鲁，迁鲁顷公于下邑为家人——旧秩序的两个象征同岁而尽。' },
  { year: -256, approx: true, kind: '工', title: '李冰守蜀·都江堰', at: [103.62, 31.0], text: '凿离堆，分内外江，旱则引水浸润，雨则杜塞水门。「水旱从人，不知饥馑」，蜀遂为天府。' },
  { year: -251, kind: '战', title: '鄗代之战', at: [114.5, 37.5], text: '燕乘赵长平之后壮者皆死，以栗腹、卿秦将兵伐赵（《战国策》称共六十万）。廉颇破燕于鄗，杀栗腹；乐乘破卿秦于代，遂围燕。燕割五城以请和。' },
  { year: -249, kind: '变', title: '吕不韦为相', at: [108.72, 34.35], text: '庄襄王元年，以吕不韦为丞相，封文信侯，食河南洛阳十万户。招致士人，著《吕氏春秋》，悬于咸阳市门。' },
  { year: -249, kind: '并', title: '秦灭东周', at: [112.98, 34.75], text: '东周君与诸侯谋秦，秦使吕不韦诛之，尽入其国。秦不绝其祀，以阳人之地奉周祭祀——然周之为国，至此而终。' },
  { year: -246, kind: '工', title: '始凿郑国渠', at: [108.9, 34.6], text: '韩以疲秦之计使水工郑国凿渠。事觉，郑国曰「臣为韩延数岁之命，而为秦建万世之功」——渠成而关中为沃野，秦反以富强。' },
  { year: -243, kind: '纵', title: '信陵君死', at: [114.35, 34.79], text: '秦行反间，魏王使人代将。公子谢病不朝，与宾客为长夜之饮，四岁而卒。魏之亡，自此可期。' },
  { year: -241, kind: '都', title: '楚徙都寿春', at: [116.78, 32.0], text: '五国伐秦不成，楚畏秦而东迁，去钜阳就淮南。中原之国，至此皆背秦而走。' },
  { year: -238, kind: '变', title: '秦王政亲政', at: [107.4, 34.52], text: '加冠于雍，平嫪毐之乱，车裂以徇，灭其宗；明年免吕不韦，后迁蜀，饮鸩而死。宗室外戚之权尽收。' },
  { year: -237, kind: '变', title: '李斯《谏逐客书》', at: [108.72, 34.35], text: '「太山不让土壤，故能成其大；河海不择细流，故能就其深。」逐客令遂废，客卿复用。' },
  { year: -237, kind: '变', title: '尉缭之策', at: [108.72, 34.35], text: '「愿大王毋爱财物，赂其豪臣以乱其谋，不过亡三十万金，则诸侯可尽。」谋臣先行，而后甲兵。' },
  { year: -233, kind: '学', title: '韩非入秦', at: [108.72, 34.35], text: '秦王见《孤愤》《五蠹》曰「嗟乎，寡人得见此人与之游，死不恨矣」。既至，李斯毁之，下狱死于云阳——其书行于秦，其人不容于秦。' },
  { year: -229, kind: '纵', title: '秦行反间杀李牧', at: [114.49, 36.6], text: '王翦攻赵，秦多与赵王宠臣郭开金，言牧欲反。赵王使赵葱代之，牧不受命，遂捕而斩之——后三月，王翦大破赵军。' },
  { year: -227, kind: '纵', title: '荆轲刺秦王', at: [108.72, 34.35], text: '易水送别，风萧萧兮。图穷而匕首见，秦王环柱而走，卒不中。秦王大怒，益发兵诣赵，王翦遂北向燕。' },
  { year: -225, kind: '战', title: '李信伐楚败绩', at: [115.9, 33.6], text: '李信言二十万可取楚，王翦曰非六十万不可。信果为项燕所破，亡七都尉。秦王驰入频阳谢王翦——「将军虽病，独忍弃寡人乎」。' },
  { year: -222, kind: '并', title: '灭代·定江南', at: [114.57, 39.84], text: '王贲攻辽东，虏燕王喜；还攻代，虏代王嘉。王翦定荆江南地，降越君，置会稽郡。六国之中，唯余齐。' },
  { year: -221, kind: '并', title: '海内为郡县', at: [108.72, 34.35], text: '初并天下，号皇帝。分三十六郡，一法度衡石丈尺，车同轨，书同文字。「自上古以来未尝有，五帝所不及。」' },
  { year: -221, kind: '工', title: '铸十二金人', at: [108.72, 34.35], text: '收天下兵聚之咸阳，销以为钟鐻、金人十二，各重千石，置廷宫中。徙天下豪富于咸阳十二万户。' },
];
