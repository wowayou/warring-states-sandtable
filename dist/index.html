    thesis: '伊阙二十四万、鄢郢烧夷陵、华阳十三万。秦以斩首计功，山东诸国的野战兵力被逐次抹去；五国破齐，又去其一极。' },
  { no: '五', roman: 'V', en: 'AFTER CHANGPING', from: -260, to: -242, title: '长平之后',
    thesis: '四十余万赵卒尽没，山东再无一国能独当秦军。邯郸之战与信陵君两度合纵稍挫秦锋，然已是回光。' },
  { no: '六', roman: 'VI', en: 'TEN YEARS TO EMPIRE', from: -241, to: -221, title: '十年而并天下',
    thesis: '尉缭请以三十万金离间诸侯豪臣，李斯请先取韩以恐他国。自韩始，十年之内六王毕、四海一。' },
];

function actAt(year) {
  return ACTS.find((a) => year >= a.from && year <= a.to) || ACTS[ACTS.length - 1];
}

function ownerAt(year) {
  const map = { ...BASE };
  for (const c of CHANGES) {
    if (c.year > year) break;
    Object.assign(map, c.set);
  }
  return map;
}

function capitalsAt(year) {
  return CAPITALS.filter((c) => year >= c.from && year < c.to);
}

const DIGITS = '〇一二三四五六七八九';

// 汉字数目：纪年、幕次、朗读共用一处，不各写一份
function cnNumber(n) {
  if (n < 10) return DIGITS[n];
  if (n < 20) return '十' + (n % 10 ? DIGITS[n % 10] : '');
  if (n < 100) return DIGITS[(n / 10) | 0] + '十' + (n % 10 ? DIGITS[n % 10] : '');
  const h = (n / 100) | 0;
  const r = n % 100;
  if (n < 1000) {
    if (!r) return DIGITS[h] + '百';
    if (r < 10) return `${DIGITS[h]}百零${DIGITS[r]}`;
    return DIGITS[h] + '百' + cnNumber(r);
  }
  return String(n);
}

function formatYear(y) {
  return y < 0 ? `前${-y}` : `${y}`;
}

// 年代不能确指者冠以「约」
function dateOf(x) {
  return `${x.approx ? '约' : ''}${formatYear(x.year)}`;
}

// 纪年：周亡之前用周王，其后用秦王。first 是该王元年——秦昭襄王在周亡时已是第五十二年
const REIGNS = [
  [-519, -476, '周敬王'], [-475, -469, '周元王'], [-468, -441, '周贞定王'],
  [-440, -426, '周考王'], [-425, -402, '周威烈王'], [-401, -376, '周安王'],
  [-375, -369, '周烈王'], [-368, -321, '周显王'], [-320, -315, '周慎靓王'],
  [-314, -256, '周赧王'], [-255, -251, '秦昭襄王', -306], [-250, -250, '秦孝文王'],
  [-249, -247, '秦庄襄王'], [-246, -221, '秦王政'],
];

function eraOf(y) {
  const r = REIGNS.find(([a, b]) => y >= a && y <= b);
  if (!r) return '';
  const n = y - (r[3] ?? r[0]) + 1;
  return `${r[2]}${n === 1 ? '元' : cnNumber(n)}年`;
}

// 声：解说朗读用浏览器自带的语音合成，战事落定敲一记编钟。
// 语音是否可用、可用哪一把嗓子，各系统不同，故此处只做检测与降级，不作承诺。



const ZH = /^(zh|cmn)/i;

// 书名号、间隔号、破折号读出来都是杂音；标点则决定停顿
function normalize(text) {
  return String(text)
    .replace(/前(\d{2,3})/g, (_, n) => `公元前${cnNumber(+n)}年`)
    .replace(/(\d{2,4})/g, (m) => (+m > 0 && +m < 1000 ? cnNumber(+m) : m))
    .replace(/[《》「」『』“”"']/g, '')
    .replace(/[·•]/g, '，')
    .replace(/[—–]{1,2}/g, '，')
    .replace(/[（(][^）)]*[）)]/g, '')
    .replace(/\s+/g, '')
    .trim();
}

// 分句而后连念，句读之间留一口气——一口气念完整段，正是「生硬」的由来
function phrases(text) {
  const out = [];
  let buf = '';
  for (const ch of normalize(text)) {
    buf += ch;
    if ('。！？；：'.includes(ch)) { out.push(buf); buf = ''; }
  }
  if (buf.trim()) out.push(buf);
  return out.filter((x) => x.replace(/[，。！？；：]/g, '').length);
}

const speech = {
  ready: false,
  voice: null,
  enabled: false,

  probe() {
    if (!('speechSynthesis' in window)) return false;
    const pick = () => {
      const voices = speechSynthesis.getVoices() || [];
      const zh = voices.filter((v) => ZH.test(v.lang));
      if (!zh.length) return false;
      // 本地嗓音无需联网，优先；其次挑普通话
      this.voice = zh.find((v) => v.localService && /CN|Hans|cmn/i.test(v.lang))
        || zh.find((v) => v.localService)
        || zh.find((v) => /CN|Hans|cmn/i.test(v.lang))
        || zh[0];
      this.ready = true;
      return true;
    };
    if (pick()) return true;
    speechSynthesis.addEventListener('voiceschanged', pick, { once: true });
    return false;
  },

  rate: 0.9,
  pitch: 0.92,
  seq: 0,

  voices() {
    if (!('speechSynthesis' in window)) return [];
    return (speechSynthesis.getVoices() || []).filter((v) => ZH.test(v.lang));
  },

  use(name) {
    const v = this.voices().find((x) => x.name === name);
    if (v) this.voice = v;
  },

  say(text, onEnd) {
    if (!this.enabled || !this.ready || !text) { onEnd?.(); return; }
    const parts = phrases(text);
    if (!parts.length) { onEnd?.(); return; }
    const run = ++this.seq;
    try { speechSynthesis.cancel(); } catch { /* 忽略 */ }
    const speak = (i) => {
      if (run !== this.seq) return;
      if (i >= parts.length) { onEnd?.(); return; }
      try {
        const u = new SpeechSynthesisUtterance(parts[i]);
        u.voice = this.voice;
        u.lang = this.voice?.lang || 'zh-CN';
        u.rate = this.rate;
        u.pitch = this.pitch;
        // 句间停一口气，长句后停得久些
        const gap = parts[i].length > 18 ? 340 : 220;
        u.onend = () => setTimeout(() => speak(i + 1), gap);
        u.onerror = () => setTimeout(() => speak(i + 1), gap);
        speechSynthesis.speak(u);
      } catch {
        onEnd?.();
      }
    };
    speak(0);
  },

  hush() {
    this.seq++;
    if ('speechSynthesis' in window) {
      try { speechSynthesis.cancel(); } catch { /* 无嗓音时静默 */ }
    }
  },
};

// 编钟一击：基频加几个不谐分音，快起慢落
let ac = null;

function chime(kind = 'war') {
  if (!speech.enabled) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t = ac.currentTime;
    const base = kind === 'war' ? 196 : 262;
    const out = ac.createGain();
    out.gain.value = kind === 'war' ? 0.16 : 0.1;
    out.connect(ac.destination);
    // 分音比取自编钟的近似：正鼓与侧鼓之外，尚有若干不谐的余响
    [[1, 1], [2.01, 0.5], [2.76, 0.28], [5.4, 0.12], [8.9, 0.06]].forEach(([ratio, amp], i) => {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'sine';
      o.frequency.value = base * ratio;
      const decay = kind === 'war' ? 2.6 - i * 0.35 : 1.6 - i * 0.22;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(amp, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.3, decay));
      o.connect(g).connect(out);
      o.start(t);
      o.stop(t + Math.max(0.4, decay) + 0.05);
    });
  } catch {
    /* 音频不可用时不作声 */
  }
}

// 沙盘本体：起伏、水系、疆域镶嵌、兵棋与行军推演，全部画在一张 canvas 上。





const SERIF = '"Sandtable Serif","Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC","Noto Serif SC",serif';
const SANS = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

const PALETTE = {
  void: '#06090a',
  sea: '#06101a',
  seaDeep: '#030709',
  seaLine: 'rgba(150,190,210,0.07)',
  land: '#423d33',     // 中性石色：底子不带绿，列国的颜色才不糊
  shadow: '#100f08',
  light: '#867f66',
  bronze: '#c9a227',
  cinnabar: '#c8352b',
  bone: '#e8e2d2',
};

const COAST_FROM = 7;   // 鸭绿江口
const COAST_TO = 36;    // 北部湾
const GRID = 680;       // 高程场分辨率
const SAMPLE = 300;     // 陆地采样分辨率
const RIDGE_WEIGHT = { 阴山: 0.85, 燕山: 0.8, 太行: 1.05, 秦岭: 1.25, 崤函: 0.75, 大别: 0.7, 巫山: 1.0, 泰岱: 0.65, 武夷: 0.75, 岷山: 1.3 };
const CAM_MS = 900;      // 镜头推移时长
const KM_PER_UNIT = 1.112; // 一个盘面单位约当的公里数（一度纬距 = 100 单位）

class SandTable {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.year = -475;
    this.owner = ownerAt(this.year);
    this.morph = 1;
    this.layers = { relief: true, rivers: true, walls: true, passes: true, battles: true, labels: true };
    this.playback = null;
    this.hover = null;
    this.selected = null;
    this.view = { scale: 1, x: 0, y: 0 };
    this.dirty = true;
    this.reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.build();
  }

  build() {
    const raw = projectAll(OUTLINE);
    // 海岸加细皱：长直段一看就是手画不出来的
    const shore = warpRing(raw, true, { scale: 0.026, amp: 0.1, max: 11, steps: 5 });
    this.outline = shore.ring;
    this.bbox = bounds(this.outline);
    const at = (i) => shore.spans[i % shore.spans.length].start;
    this.coast = this.outline.slice(at(COAST_FROM), at(COAST_TO) + 1);
    this.rim = [...this.outline.slice(at(COAST_TO)), ...this.outline.slice(0, at(COAST_FROM) + 1)];
    this.focus = bounds(projectAll([[102.0, 42.7], [123.8, 25.4]]));
    this.seaPoly = [
      ...this.coast,
      ...projectAll([[107.0, 17.0], [135.0, 17.0], [135.0, 45.0], [126.6, 44.4]]),
    ];

    this.seeds = REGIONS.map((r) => ({ ...project([r.lon, r.lat]), region: r }));
    const pad = 60;
    const frame = [
      { x: this.bbox.x0 - pad, y: this.bbox.y0 - pad },
      { x: this.bbox.x1 + pad, y: this.bbox.y0 - pad },
      { x: this.bbox.x1 + pad, y: this.bbox.y1 + pad },
      { x: this.bbox.x0 - pad, y: this.bbox.y1 + pad },
    ];
    this.cells = voronoi(this.seeds, frame);
    this.adjacency = buildAdjacency(this.cells, this.seeds);
    // 郡界同样加扰；相邻两格共用的边由规范朝向保证严丝合缝
    const warped = this.cells.map((c) => (c.length
      ? warpRing(c, true, { scale: 0.015, amp: 0.15, max: 15, steps: 6 })
      : { ring: [], spans: [] }));
    this.shapes = warped.map((w) => w.ring);
    this.spans = warped.map((w) => w.spans);

    this.rivers = RIVERS.map((r) => ({ ...r, pts: smooth(projectAll(r.path), 0.5, 10), at: project(r.label) }));
    this.mountains = MOUNTAINS.map((m) => ({ ...m, pts: smooth(projectAll(m.path), 0.5, 10) }));
    this.walls = WALLS.map((w) => ({ ...w, pts: smooth(projectAll(w.path), 0.5, 8) }));
    this.passes = PASSES.map((p) => ({ ...p, at: project([p.lon, p.lat]) }));
    this.battles = BATTLES.map((b) => ({
      ...b,
      at: project(b.at),
      marchers: b.arrows.map((a) => ({ ...a, pts: smooth(projectAll(a.path), 0.5, 14) })),
    }));

    this.sampleLand();
    this.buildRelief();
    this.buildGrain();
    this.buildHatch();
  }

  edgePts(i, j) {
    const ring = this.shapes[i];
    const sp = this.spans[i][j];
    const out = [];
    for (let k = 0; k < sp.count; k++) out.push(ring[(sp.start + k) % ring.length]);
    return out;
  }

  // 只有落在海岸线以内的采样点才算疆土——国名与国力都据此计
  sampleLand() {
    const b = this.bbox;
    const w = SAMPLE;
    const h = Math.round((SAMPLE * b.h) / b.w);
    const cellOf = new Int16Array(w * h).fill(-1);
    const acc = REGIONS.map(() => ({ n: 0, x: 0, y: 0 }));
    const stepX = b.w / w;
    const stepY = b.h / h;
    const mask = scanlineMask(this.outline, w, h, b);
    for (let gy = 0; gy < h; gy++) {
      const py = b.y0 + (gy + 0.5) * stepY;
      for (let gx = 0; gx < w; gx++) {
        const px = b.x0 + (gx + 0.5) * stepX;
        if (!mask[gy * w + gx]) continue;
        let best = -1;
        let bd = Infinity;
        for (let k = 0; k < this.seeds.length; k++) {
          const d = (this.seeds[k].x - px) ** 2 + (this.seeds[k].y - py) ** 2;
          if (d < bd) { bd = d; best = k; }
        }
        cellOf[gy * w + gx] = best;
        acc[best].n++;
        acc[best].x += px;
        acc[best].y += py;
      }
    }
    const unit = stepX * stepY;
    this.landArea = acc.map((a) => a.n * unit);
    this.landCentroid = acc.map((a, i) => (a.n ? { x: a.x / a.n, y: a.y / a.n } : this.seeds[i]));
    this.sample = { cellOf, w, h, stepX, stepY, x0: b.x0, y0: b.y0 };
  }

  // 用山脉骨架烙出高程，再作斜光晕渲——沙盘的起伏由此而来。
  // 脊线按宽度铺开并取最大值，山才是长条而非团块；再叠细噪声，平原亦有沙痕。
  buildRelief() {
    const b = this.bbox;
    const w = GRID;
    const h = Math.round((GRID * b.h) / b.w);
    const height = new Float32Array(w * h);
    const sx = w / b.w;
    const sy = h / b.h;

    const ridge = (p, amp, rad) => {
      const gx = (p.x - b.x0) * sx;
      const gy = (p.y - b.y0) * sy;
      const r = Math.ceil(rad);
      for (let dy = -r; dy <= r; dy++) {
        const Y = Math.round(gy + dy);
        if (Y < 0 || Y >= h) continue;
        for (let dx = -r; dx <= r; dx++) {
          const X = Math.round(gx + dx);
          if (X < 0 || X >= w) continue;
          const d = Math.hypot(dx, dy) / rad;
          if (d > 1) continue;
          const f = Math.cos((d * Math.PI) / 2) ** 2;
          const i = Y * w + X;
          const v = amp * f;
          if (v > height[i]) height[i] = v;
        }
      }
    };

    for (const m of this.mountains) {
      const k = RIDGE_WEIGHT[m.name] ?? 1;
      const dense = resample(m.pts, Math.max(60, m.pts.length * 4));
      dense.forEach((p, i) => {
        // 沿脊起伏，免得整条山脉是一根等高的棍子
        const wave = 0.72 + 0.28 * fbm(i * 0.22, k * 7.3);
        ridge(p, (0.34 + 0.24 * k) * wave, 6 + 5 * k);
      });
    }

    blur(height, w, h, 4);
    blur(height, w, h, 2);

    // 细纹：山处粗砺，平地亦有起伏，免得像刷了一片漆
    for (let gy = 0; gy < h; gy++) {
      for (let gx = 0; gx < w; gx++) {
        const i = gy * w + gx;
        const x = gx / w;
        const y = gy / h;
        const rough = 0.35 + 0.9 * Math.min(1, height[i]);
        height[i] += (fbm(x * 42, y * 42) * 0.085 + fbm(x * 130, y * 130) * 0.035) * rough;
      }
    }
    blur(height, w, h, 1);

    let peak = 0;
    for (const v of height) if (v > peak) peak = v;

    const mask = scanlineMask(this.outline, w, h, b);
    const img = new ImageData(w, h);
    const land = hex(PALETTE.land);
    const dark = hex(PALETTE.shadow);
    const lit = hex(PALETTE.light);
    for (let gy = 0; gy < h; gy++) {
      for (let gx = 0; gx < w; gx++) {
        const i = gy * w + gx;
        const o = i * 4;
        if (!mask[i]) { img.data[o + 3] = 0; continue; }
        const hl = height[clampIdx(gx - 1, w) + gy * w];
        const hr = height[clampIdx(gx + 1, w) + gy * w];
        const hu = height[gx + clampRow(gy - 1, h) * w];
        const hd = height[gx + clampRow(gy + 1, h) * w];
        const nx = ((hl - hr) / peak) * 20;
        const ny = ((hu - hd) / peak) * 20;
        let sh = (nx * 0.6 + ny * 0.6 + 1) / 2;
        sh = Math.max(0, Math.min(1, sh));
        const elev = Math.min(1, (height[i] / peak) * 1.4);
        const base = [
          land[0] + (lit[0] - land[0]) * elev * 0.3,
          land[1] + (lit[1] - land[1]) * elev * 0.3,
          land[2] + (lit[2] - land[2]) * elev * 0.3,
        ];
        const k = Math.max(-1, Math.min(1, (sh - 0.5) * 1.7));
        for (let c = 0; c < 3; c++) {
          const target = k >= 0 ? lit[c] : dark[c];
          img.data[o + c] = Math.round(base[c] + (target - base[c]) * Math.abs(k));
        }
        img.data[o + 3] = 255;
      }
    }
    this.relief = offscreen(w, h);
    this.relief.getContext('2d').putImageData(img, 0, 0);
  }

  buildHatch() {
    const n = 7;
    const c = offscreen(n, n);
    const g = c.getContext('2d');
    g.strokeStyle = 'rgba(232,226,210,0.16)';
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(-n, n); g.lineTo(n, -n);
    g.moveTo(0, n * 2); g.lineTo(n * 2, 0);
    g.stroke();
    this.hatch = c;
  }

  buildGrain() {
    const n = 160;
    const c = offscreen(n, n);
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(n, n);
    let seed = 7717;
    for (let i = 0; i < n * n; i++) {
      seed = (seed * 1664525 + 1013904223) & 0xffffffff;
      const v = (seed >>> 16) & 255;
      img.data[i * 4] = 255; img.data[i * 4 + 1] = 245; img.data[i * 4 + 2] = 225;
      img.data[i * 4 + 3] = v > 228 ? 15 : v < 24 ? 13 : 0;
    }
    ctx.putImageData(img, 0, 0);
    this.grain = c;
  }

  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = this.canvas.getBoundingClientRect();
    const w = Math.max(1, Math.round(rect.width * dpr));
    const h = Math.max(1, Math.round(rect.height * dpr));
    // 尺寸未变则什么都不做：给 canvas.width 赋值哪怕是同一个数也会清空画布，
    // 而缓存键未变，下一帧便不会重画——开页时 ResizeObserver 的首次回调正是这样把盘面清成一片黑
    if (this.css && w === this.canvas.width && h === this.canvas.height && dpr === this.dpr) return;
    this.canvas.width = w;
    this.canvas.height = h;
    this.dpr = dpr;
    this.css = { w: rect.width, h: rect.height };
    this.boardCacheKey = null;
    this.dirty = true;
    this.fit();
  }

  fit() {
    if (!this.css) return;
    this.cam = null;
    this.driftAnchor = null;
    const pad = 20;
    const f = this.focus;
    // 宽而扁的窗口允许纵向略微裁去一点，否则盘子小、两侧全是空
    const s = Math.min((this.css.w - pad * 2) / f.w, ((this.css.h - pad * 2) / f.h) * 1.12);
    this.base = s;
    this.view.scale = 1;
    this.view.x = (this.css.w - f.w * s) / 2 - f.x0 * s;
    this.view.y = (this.css.h - f.h * s) / 2 - f.y0 * s;
  }

  toScreen(p) {
    const s = this.base * this.view.scale;
    return { x: p.x * s + this.view.x, y: p.y * s + this.view.y };
  }

  toWorld(px, py) {
    const s = this.base * this.view.scale;
    return { x: (px - this.view.x) / s, y: (py - this.view.y) / s };
  }

  zoomAt(px, py, factor) {
    this.cam = null;
    const before = this.toWorld(px, py);
    this.view.scale = Math.max(0.8, Math.min(7, this.view.scale * factor));
    const after = this.toWorld(px, py);
    const s = this.base * this.view.scale;
    this.view.x += (after.x - before.x) * s;
    this.view.y += (after.y - before.y) * s;
  }

  pan(dx, dy) {
    this.cam = null;
    this.view.x += dx;
    this.view.y += dy;
  }

  setYear(year, animate = true) {
    const next = ownerAt(year);
    const moved = [];
    REGIONS.forEach((r, i) => { if (next[r.id] !== this.owner[r.id]) moved.push(i); });
    this.owner = next;
    const still = !this.cam && !this.drifting;
    if (animate && still && moved.length && this.snapshotBoard()) { this.morph = 0; this.hasPrev = true; }
    else { this.morph = 1; this.hasPrev = false; }
    this.year = year;
    this.flash = animate && moved.length ? { idx: moved, start: performance.now() } : null;
    return moved;
  }

  regionAt(px, py) {
    const w = this.toWorld(px, py);
    if (!pointInPolygon(w.x, w.y, this.outline)) return -1;
    let best = -1;
    let bd = Infinity;
    for (let k = 0; k < this.seeds.length; k++) {
      const d = (this.seeds[k].x - w.x) ** 2 + (this.seeds[k].y - w.y) ** 2;
      if (d < bd) { bd = d; best = k; }
    }
    return best;
  }

  battleAt(px, py) {
    let best = null;
    let bestD = 22;
    for (const b of this.battles) {
      if (b.year > this.year) continue;
      const s = this.toScreen(b.at);
      const d = Math.hypot(s.x - px, s.y - py);
      if (d < bestD) { bestD = d; best = b; }
    }
    return best;
  }

  play(battle, per = 1250) {
    const n = battle.marchers.length;
    const pts = [battle.at, ...battle.marchers.flatMap((m) => m.pts)];
    this.flyTo(boundsOf(pts));
    // 等镜头落定再起兵，否则画面一边推近一边画箭头，看着晕
    const wait = this.cam ? CAM_MS + 120 : 0;
    this.playback = {
      battle, t: 0, step: 0, start: performance.now() + wait,
      per, tail: 1900, total: n * per + 1900,
    };
  }

  stop() { this.playback = null; }

  // 缓缓移向所讲之处，而非跳过去
  focusOn(lonlat, scale = 1.5, dur = 2400) {
    if (!this.css) return;
    const p = project(lonlat);
    const s = this.base * scale;
    const f = this.focus;
    const halfW = this.css.w / (2 * s);
    const halfH = this.css.h / (2 * s);
    const cx = f.w > halfW * 2
      ? Math.max(f.x0 + halfW, Math.min(f.x1 - halfW, p.x)) : (f.x0 + f.x1) / 2;
    const cy = f.h > halfH * 2
      ? Math.max(f.y0 + halfH, Math.min(f.y1 - halfH, p.y)) : (f.y0 + f.y1) / 2;
    this.cam = {
      from: { ...this.view },
      to: { scale, x: this.css.w / 2 - cx * s, y: this.css.h / 2 - cy * s },
      start: performance.now(),
      dur,
    };
    this.driftAnchor = null;
    if (this.reduced) { Object.assign(this.view, this.cam.to); this.cam = null; this.dirty = true; }
  }

  // 放映时镜头始终有极缓的呼吸与横移，静止的画面不像纪录片
  startDrift() { this.drifting = true; this.driftAnchor = null; }

  stopDrift() { this.drifting = false; this.driftAnchor = null; }

  applyDrift(now) {
    if (!this.drifting || this.cam || this.reduced || !this.css) return;
    if (!this.driftAnchor) {
      const c = this.toWorld(this.css.w / 2, this.css.h / 2);
      this.driftAnchor = { x: c.x, y: c.y, scale: this.view.scale, t0: now };
    }
    const a = this.driftAnchor;
    const t = (now - a.t0) / 1000;
    const scale = a.scale * (1 + 0.045 * Math.sin(t / 15 + 1.2));
    const s = this.base * scale;
    this.view.scale = scale;
    this.view.x = this.css.w / 2 - a.x * s + Math.sin(t / 19) * 24;
    this.view.y = this.css.h / 2 - a.y * s + Math.cos(t / 26) * 16;
  }

  // 推演毕，镜头退回全景，否则接下来的年份都困在战场里
  flyHome() {
    if (!this.css) return;
    const s = this.base;
    this.cam = {
      from: { ...this.view },
      to: {
        scale: 1,
        x: (this.css.w - this.focus.w * s) / 2 - this.focus.x0 * s,
        y: (this.css.h - this.focus.h * s) / 2 - this.focus.y0 * s,
      },
      start: performance.now(),
      dur: CAM_MS,
    };
    if (this.reduced) { Object.assign(this.view, this.cam.to); this.cam = null; this.dirty = true; }
  }

  // 推演时把镜头压到战场上，否则行军只是几根短线
  flyTo(box, now = performance.now()) {
    const w = Math.max(box.x1 - box.x0, 1);
    const h = Math.max(box.y1 - box.y0, 1);
    const want = Math.min((this.css.w * 0.46) / w, (this.css.h * 0.5) / h) / this.base;
    const scale = Math.max(1.15, Math.min(3.2, want));
    const s = this.base * scale;
    this.cam = {
      from: { ...this.view },
      to: {
        scale,
        x: this.css.w / 2 - ((box.x0 + box.x1) / 2) * s,
        y: this.css.h * 0.43 - ((box.y0 + box.y1) / 2) * s,
      },
      start: now,
      dur: CAM_MS,
    };
    if (this.reduced) { Object.assign(this.view, this.cam.to); this.cam = null; this.dirty = true; }
  }

  // 盘面本身只在「视角、年份、图层」变了才重绘，缓存下来；
  // 每帧只重画会动的那几层。此前逐帧全量重绘，是卡顿的根子。
  boardKey() {
    const v = this.view;
    const bits = Object.values(this.layers).map((b) => (b ? 1 : 0)).join('');
    return `${v.x.toFixed(1)},${v.y.toFixed(1)},${v.scale.toFixed(4)},${this.year},${bits},${this.css.w}x${this.css.h}`;
  }

  // 海、投影、起伏只随视角变；拖动铜尺时视角不动，这层不必重算
  baseKey() {
    const v = this.view;
    return `${v.x.toFixed(1)},${v.y.toFixed(1)},${v.scale.toFixed(4)},${this.layers.relief ? 1 : 0},${this.css.w}x${this.css.h}`;
  }

  renderBase() {
    if (!this.baseLayer || this.baseLayer.width !== this.canvas.width || this.baseLayer.height !== this.canvas.height) {
      this.baseLayer = offscreen(this.canvas.width, this.canvas.height);
      this.baseCtx = this.baseLayer.getContext('2d');
    }
    const ctx = this.baseCtx;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, this.baseLayer.width, this.baseLayer.height);
    ctx.scale(this.dpr, this.dpr);
    ctx.fillStyle = PALETTE.void;
    ctx.fillRect(0, 0, this.css.w, this.css.h);
    this.drawSea(ctx);

    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.85)';
    ctx.shadowBlur = 34;
    ctx.shadowOffsetX = 9;
    ctx.shadowOffsetY = 13;
    this.path(ctx, this.outline);
    ctx.fillStyle = '#000';
    ctx.fill();
    ctx.restore();

    const s = this.base * this.view.scale;
    const org = this.toScreen({ x: this.bbox.x0, y: this.bbox.y0 });
    ctx.save();
    this.path(ctx, this.outline);
    ctx.clip();
    if (this.layers.relief) {
      ctx.drawImage(this.relief, org.x, org.y, this.bbox.w * s, this.bbox.h * s);
    } else {
      ctx.fillStyle = PALETTE.land;
      ctx.fillRect(0, 0, this.css.w, this.css.h);
    }
    ctx.restore();
    ctx.restore();
  }

  animating() {
    if (this.morph < 1 || this.cam || this.playback || this.flash || this.drifting) return true;
    if (this.cinema && !this.reduced) return true;
    if (this.reduced || !this.layers.battles) return false;
    if (this.selected) return true;
    return this.battles.some((b) => b.year <= this.year && this.year - b.year <= 6);
  }

  draw(now) {
    if (!this.css) return;
    if (this.morph < 1) {
      this.morph = Math.min(1, this.morph + 0.05);
      if (this.morph >= 1) this.hasPrev = false;
    }
    if (this.cam) {
      const k = ease(Math.min(1, (now - this.cam.start) / this.cam.dur));
      const { from, to } = this.cam;
      this.view.scale = from.scale + (to.scale - from.scale) * k;
      this.view.x = from.x + (to.x - from.x) * k;
      this.view.y = from.y + (to.y - from.y) * k;
      if (k >= 1) { this.cam = null; this.driftAnchor = null; }
    }
    this.applyDrift(now);

    const key = this.boardKey();
    const boardStale = key !== this.boardCacheKey;
    if (!boardStale && !this.dirty && !this.animating()) return;
    this.dirty = false;

    // 视角在缓动时，先缩放缓存那张，按节流重绘，免得逐帧全量重画
    const throttle = this.scrubbing ? 95 : this.drifting ? 380 : 0;
    const held = throttle > 0 && this.board && now - (this.lastBoardAt || 0) < throttle;
    const glide = this.board && this.boardView && (this.cam || (boardStale && held));
    if (boardStale && !this.cam && !held) {
      this.renderBoard();
      this.boardCacheKey = key;
      this.lastBoardAt = now;
    }

    const ctx = this.ctx;
    ctx.save();
    ctx.scale(this.dpr, this.dpr);
    ctx.clearRect(0, 0, this.css.w, this.css.h);
    if (glide) {
      const k = this.view.scale / this.boardView.scale;
      ctx.save();
      ctx.translate(this.view.x - this.boardView.x * k, this.view.y - this.boardView.y * k);
      ctx.scale(k, k);
      ctx.drawImage(this.board, 0, 0, this.css.w, this.css.h);
      ctx.restore();
    } else {
      ctx.drawImage(this.board, 0, 0, this.css.w, this.css.h);
      if (this.morph < 1 && this.hasPrev) {
        ctx.globalAlpha = 1 - ease(this.morph);
        ctx.drawImage(this.boardPrev, 0, 0, this.css.w, this.css.h);
        ctx.globalAlpha = 1;
      }
    }

    ctx.save();
    this.path(ctx, this.outline);
    ctx.clip();
    this.drawFlash(ctx, now);
    this.drawHover(ctx);
    ctx.restore();

    if (this.layers.battles) this.drawBattles(ctx, now);
    if (this.playback) this.drawPlayback(ctx, now);

    if (!this.cinema) {
      this.drawPlate(ctx);
      this.drawCompass(ctx);
      if (!this.playback && this.css.w > 560) this.drawLegend(ctx);
    }
    this.drawScale(ctx);

    ctx.globalAlpha = this.cinema ? 0.42 : 0.3;
    ctx.fillStyle = this.grainPattern || (this.grainPattern = ctx.createPattern(this.grain, 'repeat'));
    if (this.cinema) {
      const gx = ((now / 40) | 0) % 160;
      const gy = ((now / 27) | 0) % 160;
      ctx.save();
      ctx.translate(-gx, -gy);
      ctx.fillRect(0, 0, this.css.w + 160, this.css.h + 160);
      ctx.restore();
    } else {
      ctx.fillRect(0, 0, this.css.w, this.css.h);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  renderBoard() {
    if (!this.board || this.board.width !== this.canvas.width || this.board.height !== this.canvas.height) {
      this.board = offscreen(this.canvas.width, this.canvas.height);
      this.boardCtx = this.board.getContext('2d');
      this.grainPattern = null;
      this.baseCacheKey = null;
    }
    const bKey = this.baseKey();
    if (bKey !== this.baseCacheKey) {
      this.renderBase();
      this.baseCacheKey = bKey;
    }

    this.boardView = { ...this.view };
    const ctx = this.boardCtx;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, this.board.width, this.board.height);
    ctx.drawImage(this.baseLayer, 0, 0);
    ctx.scale(this.dpr, this.dpr);

    const s = this.base * this.view.scale;
    const org = this.toScreen({ x: this.bbox.x0, y: this.bbox.y0 });

    ctx.save();
    this.path(ctx, this.outline);
    ctx.clip();

    this.drawTerritory(ctx);

    if (this.layers.relief) {
      ctx.globalCompositeOperation = 'overlay';
      ctx.globalAlpha = 0.6;
      ctx.drawImage(this.relief, org.x, org.y, this.bbox.w * s, this.bbox.h * s);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    // 沙盘只塑造诸夏；其外压暗，作盘面之余白
    if (this.tribePath) {
      ctx.fillStyle = 'rgba(6,10,12,0.5)';
      ctx.fill(this.tribePath);
    }

    this.drawBorders(ctx);
    if (this.layers.rivers) this.drawRivers(ctx);
    if (this.layers.walls) this.drawWalls(ctx);
    this.drawBevel(ctx);
    ctx.restore();

    this.drawRim(ctx);
    this.drawCoast(ctx);
    if (this.layers.passes) this.drawPasses(ctx);
    this.drawCapitals(ctx);
    if (this.layers.labels) this.drawNames(ctx);
    ctx.restore();
  }

  toPath(pts, close = true, into = null) {
    const p = into || new Path2D();
    for (let i = 0; i < pts.length; i++) {
      const q = this.toScreen(pts[i]);
      if (i === 0) p.moveTo(q.x, q.y); else p.lineTo(q.x, q.y);
    }
    if (close) p.closePath();
    return p;
  }

  path(ctx, pts, close = true) {
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const p = this.toScreen(pts[i]);
      if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    if (close) ctx.closePath();
  }

  drawSea(ctx) {
    ctx.save();
    const g = ctx.createLinearGradient(0, 0, 0, this.css.h);
    g.addColorStop(0, PALETTE.sea);
    g.addColorStop(1, PALETTE.seaDeep);
    this.path(ctx, this.seaPoly);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.clip();
    // 近岸浅滩：一圈由亮转暗的水痕，陆地才浮得起来
    for (const [w, a] of [[26, 0.05], [15, 0.06], [7, 0.09]]) {
      this.path(ctx, this.coast, false);
      ctx.strokeStyle = `rgba(150,196,214,${a})`;
      ctx.lineWidth = w;
      ctx.lineJoin = 'round';
      ctx.stroke();
    }
    ctx.strokeStyle = PALETTE.seaLine;
    ctx.lineWidth = 1;
    const step = Math.max(11, 14 * this.view.scale);
    for (let y = -this.css.h; y < this.css.h * 2; y += step) {
      ctx.beginPath();
      ctx.moveTo(-40, y);
      ctx.lineTo(this.css.w + 40, y + this.css.w * 0.05);
      ctx.stroke();
    }
    ctx.restore();
  }

  fillFor(i) {
    return STATES[this.owner[REGIONS[i].id]].color;
  }

  snapshotBoard() {
    if (!this.board) return false;
    if (!this.boardPrev || this.boardPrev.width !== this.board.width || this.boardPrev.height !== this.board.height) {
      this.boardPrev = offscreen(this.board.width, this.board.height);
      this.boardPrevCtx = this.boardPrev.getContext('2d');
    }
    this.boardPrevCtx.setTransform(1, 0, 0, 1, 0, 0);
    this.boardPrevCtx.clearRect(0, 0, this.boardPrev.width, this.boardPrev.height);
    this.boardPrevCtx.drawImage(this.board, 0, 0);
    return true;
  }

  drawTerritory(ctx) {
    const byColor = new Map();
    const tribes = new Path2D();
    const hairlines = new Path2D();
    for (let i = 0; i < this.cells.length; i++) {
      const cell = this.shapes[i];
      if (!cell.length) continue;
      this.toPath(cell, true, hairlines);
      if (!this.landArea[i]) continue;
      const st = STATES[this.owner[REGIONS[i].id]];
      const color = st.tribe ? mix(this.fillFor(i), '#0a1013', 0.55) : this.fillFor(i);
      let g = byColor.get(color);
      if (!g) { g = { path: new Path2D(), tribe: st.tribe }; byColor.set(color, g); }
      this.toPath(cell, true, g.path);
      if (st.tribe) this.toPath(cell, true, tribes);
    }
    for (const [color, g] of byColor) {
      ctx.fillStyle = color;
      ctx.globalAlpha = g.tribe ? 0.74 : 0.66;
      ctx.fill(g.path);
    }
    ctx.globalAlpha = 1;
    // 化外之地的斜纹改用图案填充，不再逐格裁剪画线
    ctx.fillStyle = this.hatchPattern || (this.hatchPattern = ctx.createPattern(this.hatch, 'repeat'));
    ctx.fill(tribes);
    this.tribePath = tribes;
    ctx.strokeStyle = 'rgba(9,12,10,0.32)';
    ctx.lineWidth = 0.6;
    ctx.stroke(hairlines);
  }

  drawBorders(ctx) {
    const backing = new Path2D();
    const byInk = new Map();
    for (let i = 0; i < this.cells.length; i++) {
      const cell = this.cells[i];
      if (!cell.length) continue;
      const mine = this.owner[REGIONS[i].id];
      for (let j = 0; j < cell.length; j++) {
        const nb = this.adjacency[i][j];
        if (nb < 0 || nb < i) continue;
        if (this.owner[REGIONS[nb].id] === mine) continue;
        const pts = this.edgePts(i, j);
        const ink = (STATES[mine].ink || '#96a096') + 'cc';
        let p = byInk.get(ink);
        if (!p) { p = new Path2D(); byInk.set(ink, p); }
        this.toPath(pts, false, backing);
        this.toPath(pts, false, p);
      }
    }
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(6,8,7,0.65)';
    ctx.lineWidth = 3.2;
    ctx.stroke(backing);
    ctx.lineWidth = 1.3;
    for (const [ink, p] of byInk) {
      ctx.strokeStyle = ink;
      ctx.stroke(p);
    }
    ctx.restore();
  }

  // 岸缘倒角：西北受光、东南落影，一圈之内陆地就抬起来了
  drawBevel(ctx) {
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.translate(2, 2.5);
    this.path(ctx, this.outline);
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 6;
    ctx.stroke();
    ctx.translate(-4, -5);
    this.path(ctx, this.outline);
    ctx.strokeStyle = 'rgba(255,244,214,0.13)';
    ctx.lineWidth = 3.5;
    ctx.stroke();
    ctx.restore();
  }

  // 图幅西、北两侧非海岸，令其溶入盘外的暗处
  drawRim(ctx) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const layers = [[34, 0.95], [22, 0.7], [12, 0.5], [5, 0.35]];
    for (const [w, a] of layers) {
      this.path(ctx, this.rim, false);
      ctx.strokeStyle = `rgba(8,11,12,${a})`;
      ctx.lineWidth = w;
      ctx.stroke();
    }
    ctx.restore();
  }

  drawCoast(ctx) {
    this.path(ctx, this.coast, false);
    ctx.strokeStyle = 'rgba(201,162,39,0.5)';
    ctx.lineWidth = 1.4;
    ctx.lineJoin = 'round';
    ctx.stroke();
  }

  drawRivers(ctx) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const r of this.rivers) {
      this.path(ctx, r.pts, false);
      ctx.strokeStyle = 'rgba(5,9,11,0.6)';
      ctx.lineWidth = 3.8;
      ctx.stroke();
      this.path(ctx, r.pts, false);
      ctx.strokeStyle = 'rgba(122,180,196,0.75)';
      ctx.lineWidth = 1.7;
      ctx.stroke();
    }
    if (this.view.scale > 1.1) {
      ctx.font = `700 11px ${SERIF}`;
      ctx.fillStyle = 'rgba(150,200,212,0.9)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const r of this.rivers) {
        const p = this.toScreen(r.at);
        ctx.fillText(r.name, p.x, p.y);
      }
    }
    ctx.restore();
  }

  drawWalls(ctx) {
    ctx.save();
    ctx.setLineDash([7, 4]);
    for (const w of this.walls) {
      if (this.year < (WALL_BUILT[w.name] ?? -400)) continue;
      const owner = this.owner[nearestRegionId(this.seeds, w.pts[0])];
      this.path(ctx, w.pts, false);
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.lineWidth = 4.5;
      ctx.stroke();
      this.path(ctx, w.pts, false);
      ctx.strokeStyle = (STATES[owner]?.ink || '#cbbf9a') + 'e6';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.restore();
  }

  drawPasses(ctx) {
    ctx.save();
    for (const p of this.passes) {
      const s = this.toScreen(p.at);
      ctx.beginPath();
      ctx.moveTo(s.x - 4, s.y + 3);
      ctx.lineTo(s.x - 4, s.y - 2);
      ctx.lineTo(s.x, s.y - 5);
      ctx.lineTo(s.x + 4, s.y - 2);
      ctx.lineTo(s.x + 4, s.y + 3);
      ctx.strokeStyle = 'rgba(201,162,39,0.9)';
      ctx.lineWidth = 1.3;
      ctx.stroke();
      if (this.view.scale > 1.25) {
        ctx.font = `500 10px ${SANS}`;
        ctx.fillStyle = 'rgba(201,162,39,0.85)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(p.name, s.x, s.y + 6);
      }
    }
    ctx.restore();
  }

  // 兵棋：都城为方座，座之高低即国力
  drawCapitals(ctx) {
    const power = this.power();
    for (const c of capitalsAt(this.year)) {
      const st = STATES[c.state];
      const p = this.toScreen(project([c.lon, c.lat]));
      const pw = power.get(c.state) || 0;
      const hgt = 6 + Math.min(18, pw * 0.6);
      const w = 10;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath();
      ctx.ellipse(2, 1.5, w * 0.85, 3.4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = st.color;
      ctx.fillRect(-w / 2, -hgt, w, hgt);
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.fillRect(-w / 2, -hgt, w * 0.38, hgt);
      ctx.strokeStyle = 'rgba(232,226,210,0.8)';
      ctx.lineWidth = 1;
      ctx.strokeRect(-w / 2, -hgt, w, hgt);
      ctx.fillStyle = PALETTE.bone;
      ctx.font = `700 ${Math.min(11, 5 + hgt * 0.4)}px ${SERIF}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(st.name, 0, -hgt / 2);
      ctx.restore();
      if (this.view.scale > 1.15) {
        ctx.font = `500 10px ${SANS}`;
        ctx.fillStyle = 'rgba(232,226,210,0.7)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(c.name, p.x, p.y + 4);
      }
    }
  }

  drawNames(ctx) {
    const groups = new Map();
    for (let i = 0; i < REGIONS.length; i++) {
      const st = this.owner[REGIONS[i].id];
      if (STATES[st].tribe || !this.landArea[i]) continue;
      const g = groups.get(st) || { area: 0, n: 0, x: 0, y: 0, best: i, bestArea: 0 };
      g.area += this.landArea[i];
      g.n += this.landArea[i];
      g.x += this.landCentroid[i].x * this.landArea[i];
      g.y += this.landCentroid[i].y * this.landArea[i];
      if (this.landArea[i] > g.bestArea) { g.bestArea = this.landArea[i]; g.best = i; }
      groups.set(st, g);
    }
    const fade = 1 - Math.max(0, Math.min(1, (this.view.scale - 1.7) / 0.6));
    if (fade <= 0) return;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const [st, g] of groups) {
      if (g.area < 9000) continue;
      let anchor = { x: g.x / g.n, y: g.y / g.n };
      if (this.cellOwnerAtWorld(anchor) !== st) anchor = this.landCentroid[g.best];
      const p = this.toScreen(anchor);
      const size = Math.max(15, Math.min(38, Math.sqrt(g.area) * 0.085)) * Math.min(1.6, this.view.scale ** 0.35);
      ctx.font = `700 ${size}px ${SERIF}`;
      if ('letterSpacing' in ctx) ctx.letterSpacing = `${size * 0.1}px`;
      ctx.lineWidth = size * 0.16;
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.strokeText(STATES[st].name, p.x, p.y);
      ctx.shadowColor = 'rgba(0,0,0,0.6)';
      ctx.shadowBlur = size * 0.35;
      ctx.fillStyle = 'rgba(246,240,224,0.94)';
      ctx.fillText(STATES[st].name, p.x, p.y);
      ctx.shadowBlur = 0;
      if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
    }
    ctx.restore();
  }

  cellOwnerAtWorld(pt) {
    const s = this.sample;
    const gx = Math.floor((pt.x - s.x0) / s.stepX);
    const gy = Math.floor((pt.y - s.y0) / s.stepY);
    if (gx < 0 || gy < 0 || gx >= s.w || gy >= s.h) return null;
    const i = s.cellOf[gy * s.w + gx];
    return i < 0 ? null : this.owner[REGIONS[i].id];
  }

  drawBattles(ctx, now) {
    ctx.save();
    for (const b of this.battles) {
      if (b.year > this.year) continue;
      const p = this.toScreen(b.at);
      const fresh = this.year - b.year;
      const active = fresh <= 6;
      const sel = this.selected === b.id;
      const r = sel ? 8 : 5.5;
      if ((sel || active) && !this.reduced) {
        const pulse = 1 + 0.4 * Math.sin(now / 320);
        ctx.beginPath();
        ctx.arc(p.x, p.y, r * 1.9 * pulse, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(200,53,43,${sel ? 0.5 : 0.26})`;
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }
      ctx.globalAlpha = sel ? 1 : active ? 0.95 : 0.4;
      ctx.strokeStyle = PALETTE.cinnabar;
      ctx.lineWidth = sel ? 2.4 : 1.8;
      ctx.beginPath();
      ctx.moveTo(p.x - r, p.y - r);
      ctx.lineTo(p.x + r, p.y + r);
      ctx.moveTo(p.x + r, p.y - r);
      ctx.lineTo(p.x - r, p.y + r);
      ctx.stroke();
      ctx.globalAlpha = 1;
      const busy = this.playback && this.playback.battle.id === b.id;
      if (!busy && (sel || (active && this.view.scale > 1))) {
        ctx.font = `600 11.5px ${SANS}`;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(0,0,0,0.7)';
        ctx.strokeText(b.name, p.x + r + 5, p.y - r - 2);
        ctx.fillStyle = 'rgba(244,182,172,0.98)';
        ctx.fillText(b.name, p.x + r + 5, p.y - r - 2);
      }
    }
    ctx.restore();
  }

  drawPlayback(ctx, now) {
    const pb = this.playback;
    const elapsed = now - pb.start;
    if (elapsed <= 0) return;
    pb.t = Math.min(1, elapsed / pb.total);
    pb.step = Math.min(pb.battle.marchers.length, Math.floor(elapsed / pb.per));
    const b = pb.battle;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    b.marchers.forEach((m, idx) => {
      const t = Math.max(0, Math.min(1, (elapsed - idx * pb.per) / pb.per));
      if (t <= 0) return;
      const live = idx === pb.step || pb.step >= b.marchers.length;
      const pts = m.pts.map((p) => this.toScreen(p));
      const seg = pts.slice(0, Math.max(2, Math.floor(pts.length * t)));
      const ink = STATES[m.state]?.ink || '#e8e2d2';
      ctx.beginPath();
      seg.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
      ctx.strokeStyle = live ? 'rgba(0,0,0,0.6)' : 'rgba(0,0,0,0.32)';
      ctx.lineWidth = live ? 6.5 : 4.2;
      ctx.stroke();
      ctx.beginPath();
      seg.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
      ctx.strokeStyle = live ? ink : dim(ink, 0.62);
      ctx.lineWidth = live ? 3 : 2.2;
      ctx.stroke();
      const head = seg[seg.length - 1];
      const prev = seg[Math.max(0, seg.length - 4)];
      const ang = Math.atan2(head.y - prev.y, head.x - prev.x);
      ctx.save();
      ctx.translate(head.x, head.y);
      ctx.rotate(ang);
      ctx.fillStyle = ink;
      ctx.beginPath();
      ctx.moveTo(10, 0);
      ctx.lineTo(-4, 5.5);
      ctx.lineTo(-1.5, 0);
      ctx.lineTo(-4, -5.5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      if (m.label) {
        // 标签随军走在已画路径的六成处，而不贴着箭头：几路军汇于一点时，标签才不叠成一团
        const at = seg[Math.min(seg.length - 1, Math.floor((seg.length - 1) * 0.6))];
        ctx.font = `700 12px ${SERIF}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(0,0,0,0.75)';
        ctx.strokeText(m.label, at.x, at.y - 7);
        ctx.fillStyle = ink;
        ctx.fillText(m.label, at.x, at.y - 7);
      }
    });
    const tailStart = (pb.total - pb.tail) / pb.total;
    if (pb.t > tailStart) {
      const p = this.toScreen(b.at);
      const k = (pb.t - tailStart) / (1 - tailStart);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 6 + 34 * k, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(200,53,43,${0.75 * (1 - k)})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.restore();
  }

  drawFlash(ctx, now) {
    if (!this.flash) return;
    const k = (now - this.flash.start) / 1800;
    if (k >= 1) { this.flash = null; return; }
    ctx.save();
    ctx.lineJoin = 'round';
    const a = (1 - k) * (0.55 + 0.45 * Math.sin(now / 90));
    for (const i of this.flash.idx) {
      const cell = this.cells[i];
      if (!cell || !cell.length) continue;
      this.path(ctx, cell);
      ctx.strokeStyle = `rgba(240,232,205,${a})`;
      ctx.lineWidth = 2.4;
      ctx.stroke();
      this.path(ctx, cell);
      ctx.fillStyle = `rgba(240,232,205,${a * 0.12})`;
      ctx.fill();
    }
    ctx.restore();
  }

  drawHover(ctx) {
    if (this.hover == null || this.hover < 0) return;
    const cell = this.shapes[this.hover];
    if (!cell || !cell.length) return;
    ctx.save();
    this.path(ctx, cell);
    ctx.fillStyle = 'rgba(232,226,210,0.08)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(232,226,210,0.8)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }

  // 盘缘：刻度、角标、方位、比例、图例——沙盘的框本身也是读图的工具
  drawPlate(ctx) {
    const m = 9;
    const w = this.css.w;
    const h = this.css.h;
    ctx.save();
    ctx.strokeStyle = 'rgba(201,162,39,0.2)';
    ctx.lineWidth = 1;
    ctx.strokeRect(m + 0.5, m + 0.5, w - m * 2 - 1, h - m * 2 - 1);

    ctx.strokeStyle = 'rgba(201,162,39,0.11)';
    for (let x = m; x < w - m; x += 56) {
      const major = Math.round((x - m) / 56) % 4 === 0;
      ctx.beginPath();
      ctx.moveTo(x + 0.5, m + 1);
      ctx.lineTo(x + 0.5, m + (major ? 8 : 4));
      ctx.moveTo(x + 0.5, h - m - 1);
      ctx.lineTo(x + 0.5, h - m - (major ? 8 : 4));
      ctx.stroke();
    }
    for (let y = m; y < h - m; y += 56) {
      const major = Math.round((y - m) / 56) % 4 === 0;
      ctx.beginPath();
      ctx.moveTo(m + 1, y + 0.5);
      ctx.lineTo(m + (major ? 8 : 4), y + 0.5);
      ctx.moveTo(w - m - 1, y + 0.5);
      ctx.lineTo(w - m - (major ? 8 : 4), y + 0.5);
      ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(201,162,39,0.6)';
    ctx.lineWidth = 1.6;
    const L = 16;
    for (const [cx, cy, dx, dy] of [[m, m, 1, 1], [w - m, m, -1, 1], [m, h - m, 1, -1], [w - m, h - m, -1, -1]]) {
      ctx.beginPath();
      ctx.moveTo(cx + dx * L, cy);
      ctx.lineTo(cx, cy);
      ctx.lineTo(cx, cy + dy * L);
      ctx.stroke();
    }
    ctx.restore();
  }

  drawCompass(ctx) {
    const x = this.css.w - 34;
    const y = 44;
    ctx.save();
    ctx.strokeStyle = 'rgba(201,162,39,0.65)';
    ctx.fillStyle = 'rgba(201,162,39,0.85)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x, y + 13);
    ctx.lineTo(x, y - 6);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y - 12);
    ctx.lineTo(x - 4, y - 3);
    ctx.lineTo(x + 4, y - 3);
    ctx.closePath();
    ctx.fill();
    ctx.font = `700 12px ${SERIF}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('北', x, y + 16);
    ctx.restore();
  }

  drawScale(ctx) {
    const pxPerKm = (this.base * this.view.scale) / KM_PER_UNIT;
    const steps = [50, 100, 200, 300, 500, 1000, 2000];
    let km = steps[steps.length - 1];
    for (const c of steps) { if (c * pxPerKm >= 70 && c * pxPerKm <= 170) { km = c; break; } }
    const len = km * pxPerKm;
    // 放映时字幕占着左下角，比例尺让到右边
    const x = this.cinema ? this.css.w - 26 - len : 22;
    const y = this.css.h - (this.cinema ? 26 : 52);
    ctx.save();
    ctx.strokeStyle = 'rgba(201,162,39,0.8)';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(x, y - 4);
    ctx.lineTo(x, y);
    ctx.lineTo(x + len, y);
    ctx.lineTo(x + len, y - 4);
    ctx.moveTo(x + len / 2, y);
    ctx.lineTo(x + len / 2, y - 3);
    ctx.stroke();
    ctx.fillStyle = 'rgba(232,226,210,0.62)';
    ctx.font = `500 10.5px ${SANS}`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(`${km} 公里 · 约 ${Math.round(km / 0.4158 / 10) * 10} 秦里`, x, y + 4);
    ctx.restore();
  }

  drawLegend(ctx) {
    const rows = ['都城·兵棋', '关塞', '长城', '战事', '化外之地'];
    const x = 24;
    const y = 26;
    const w = 106;
    const h = 20 + rows.length * 17;
    ctx.save();
    ctx.fillStyle = 'rgba(7,10,11,0.68)';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(201,162,39,0.16)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    ctx.fillStyle = 'rgba(201,162,39,0.75)';
    ctx.font = `700 10px ${SERIF}`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('圖 例', x + 9, y + 11);

    ctx.font = `500 10.5px ${SANS}`;
    const gx = x + 9;
    rows.forEach((label, i) => {
      const cy = y + 28 + i * 17;
      ctx.save();
      if (i === 0) {
        ctx.fillStyle = '#8e5aa0';
        ctx.fillRect(gx, cy - 6, 6, 10);
        ctx.strokeStyle = 'rgba(232,226,210,0.7)';
        ctx.lineWidth = 1;
        ctx.strokeRect(gx + 0.5, cy - 5.5, 5, 9);
      } else if (i === 1) {
        ctx.strokeStyle = 'rgba(201,162,39,0.9)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(gx, cy + 3);
        ctx.lineTo(gx, cy - 1);
        ctx.lineTo(gx + 3.5, cy - 4);
        ctx.lineTo(gx + 7, cy - 1);
        ctx.lineTo(gx + 7, cy + 3);
        ctx.stroke();
      } else if (i === 2) {
        ctx.strokeStyle = '#c6bb98';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 3]);
        ctx.beginPath();
        ctx.moveTo(gx - 1, cy);
        ctx.lineTo(gx + 9, cy);
        ctx.stroke();
      } else if (i === 3) {
        ctx.strokeStyle = PALETTE.cinnabar;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(gx, cy - 4);
        ctx.lineTo(gx + 8, cy + 4);
        ctx.moveTo(gx + 8, cy - 4);
        ctx.lineTo(gx, cy + 4);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#2c3029';
        ctx.fillRect(gx, cy - 5, 9, 10);
        ctx.strokeStyle = 'rgba(232,226,210,0.3)';
        ctx.lineWidth = 1;
        for (let k = -8; k < 10; k += 4) {
          ctx.beginPath();
          ctx.moveTo(gx + k, cy + 5);
          ctx.lineTo(gx + k + 10, cy - 5);
          ctx.stroke();
        }
      }
      ctx.restore();
      ctx.fillStyle = 'rgba(232,226,210,0.6)';
      ctx.fillText(label, gx + 16, cy);
    });
    ctx.restore();
  }

  power() {
    const m = new Map();
    for (const r of REGIONS) {
      const st = this.owner[r.id];
      if (STATES[st].tribe) continue;
      m.set(st, (m.get(st) || 0) + r.weight);
    }
    return m;
  }
}

const WALL_BUILT = {
  赵北长城: -300, 燕北长城: -300, 秦昭王长城: -272,
  齐长城: -400, 楚方城: -475, 魏河西长城: -358,
};

function nearestRegionId(seeds, pt) {
  let best = seeds[0];
  let bd = Infinity;
  for (const s of seeds) {
    const d = (s.x - pt.x) ** 2 + (s.y - pt.y) ** 2;
    if (d < bd) { bd = d; best = s; }
  }
  return best.region.id;
}

function boundsOf(pts) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of pts) {
    x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y);
    x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y);
  }
  return { x0, y0, x1, y1, h: y1 - y0 };
}

function blur(arr, w, h, r) {
  const tmp = new Float32Array(arr.length);
  for (let y = 0; y < h; y++) {
    let sum = 0;
    for (let x = -r; x <= r; x++) sum += arr[y * w + clampIdx(x, w)];
    for (let x = 0; x < w; x++) {
      tmp[y * w + x] = sum / (2 * r + 1);
      sum += arr[y * w + clampIdx(x + r + 1, w)] - arr[y * w + clampIdx(x - r, w)];
    }
  }
  for (let x = 0; x < w; x++) {
    let sum = 0;
    for (let y = -r; y <= r; y++) sum += tmp[clampRow(y, h) * w + x];
    for (let y = 0; y < h; y++) {
      arr[y * w + x] = sum / (2 * r + 1);
      sum += tmp[clampRow(y + r + 1, h) * w + x] - tmp[clampRow(y - r, h) * w + x];
    }
  }
}

const clampIdx = (i, w) => (i < 0 ? 0 : i >= w ? w - 1 : i);
const clampRow = (i, h) => (i < 0 ? 0 : i >= h ? h - 1 : i);

function offscreen(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return c;
}

function hex(s) {
  if (s[0] !== '#') return s.match(/\d+/g).slice(0, 3).map(Number);
  return [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)];
}

function mix(a, b, t) {
  const x = hex(a);
  const y = hex(b);
  const c = x.map((v, i) => Math.round(v + (y[i] - v) * t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function dim(color, k) {
  const c = hex(color);
  return `rgba(${c[0]},${c[1]},${c[2]},${k})`;
}

const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);

const $ = (id) => document.getElementById(id);
const canvas = $('table');
const stage = canvas.parentElement;
const table = new SandTable(canvas);

let year = START;
let playing = false;
let lastTick = 0;
const battleById = new Map(table.battles.map((b) => [b.id, b]));

/* ── 铜尺 ─────────────────────────────────────── */

const ruler = $('ruler');
const pct = (y) => ((y - START) / (END - START)) * 100;

function buildRuler() {
  $('acts').innerHTML = ACTS.map((a, i) => {
    const l = pct(a.from);
    const w = pct(a.to) - l;
    return `<button class="act" data-act="${i}" style="left:${l}%;width:${w}%">
      <b>${a.no}</b><span>${a.title}</span></button>`;
  }).join('');
  const ticks = $('ticks');
  const marks = $('marks');
  let html = '';
  for (let y = -470; y <= END; y += 10) {
    const major = y % 50 === 0;
    html += `<i class="tick${major ? ' is-major' : ''}" style="left:${pct(y)}%;height:${major ? 16 : 8}px"></i>`;
    if (major) html += `<i class="tick-label" style="left:${pct(y)}%">前${-y}</i>`;
  }
  ticks.innerHTML = html;
  marks.innerHTML = BATTLES.map(
    (b) => `<i class="mark" style="left:${pct(b.year)}%" title="${dateOf(b)} ${b.name}"></i>`
  ).join('');
}

$('acts').addEventListener('click', (e) => {
  const el = e.target.closest('.act');
  if (!el) return;
  e.stopPropagation();
  pause();
  endMarch();
  setYear(ACTS[+el.dataset.act].from);
  showAct();
});

function syncActs() {
  const cur = actAt(year);
  $('actNo').textContent = cur.no;
  $('actTitle').textContent = cur.title;
  for (const el of $('acts').children) {
    el.classList.toggle('is-now', ACTS[+el.dataset.act] === cur);
  }
}

function yearFromEvent(e) {
  const r = ruler.getBoundingClientRect();
  const t = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  return Math.round(START + t * (END - START));
}

let scrubbing = false;
ruler.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.act')) return;
  scrubbing = true;
  table.scrubbing = true;
  hideCaption();
  if (detailMode !== 'act') showAct();
  ruler.setPointerCapture(e.pointerId);
  setYear(yearFromEvent(e), false);
  pause();
});
// 拖动时不做过渡动画：每换一年都跑一遍二十帧的渐变，正是拖不动的原因
ruler.addEventListener('pointermove', (e) => { if (scrubbing) setYear(yearFromEvent(e), false); });
ruler.addEventListener('pointerup', () => { scrubbing = false; table.scrubbing = false; table.dirty = true; syncChron(); });
ruler.addEventListener('keydown', (e) => {
  const step = e.shiftKey ? 10 : 1;
  if (detailMode !== 'act' && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) { hideCaption(); showAct(); }
  if (e.key === 'ArrowLeft') { setYear(year - step); pause(); }
  else if (e.key === 'ArrowRight') { setYear(year + step); pause(); }
  else if (e.key === 'Home') { setYear(START); pause(); }
  else if (e.key === 'End') { setYear(END); pause(); }
  else if (e.key === ' ') { toggle(); }
  else return;
  e.preventDefault();
});

/* ── 大事记 ───────────────────────────────────── */

function buildChron() {
  $('chron').innerHTML = EVENTS.map(
    (e, i) => `<li class="evt" tabindex="-1" data-i="${i}" data-kind="${e.kind}" data-year="${e.year}"${e.battle ? ` data-battle="${e.battle}"` : ''}>
      <span class="evt-year">${dateOf(e)}</span>
      <div class="evt-body">
        <p class="evt-title"><i class="evt-kind" title="${KIND_NAME[e.kind]}" aria-label="${KIND_NAME[e.kind]}">${e.kind}</i>${e.title}</p>
        <p class="evt-text">${e.text}</p>
      </div>
    </li>`
  ).join('');
}

let picked = null;

// 点中的那一条要亮起来——同年往往不止一事，前479 的孔子卒更在纪年之外
function pick(li) {
  if (picked === li) return;
  picked?.classList.remove('is-picked');
  picked = li;
  li?.classList.add('is-picked');
}

function openEvt(li) {
  pause();
  setYear(+li.dataset.year);
  pick(li);
  // 换年会把简册滚到当年那一段；点的是哪条，就让哪条留在眼前
  li.scrollIntoView({ block: 'nearest' });
  if (li.dataset.battle) selectBattle(li.dataset.battle, true);
  else showEvent(EVENTS[+li.dataset.i]);
}

$('chron').addEventListener('click', (e) => {
  const li = e.target.closest('.evt');
  if (li) openEvt(li);
});

// 键盘：上下移动、回车打开
$('chron').addEventListener('keydown', (e) => {
  const li = e.target.closest('.evt');
  if (!li) {
    if (['ArrowDown', 'ArrowUp', 'Enter'].includes(e.key)) {
      e.preventDefault();
      (chronAnchor || $('chron').firstElementChild)?.focus();
    }
    return;
  }
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openEvt(li); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    (e.key === 'ArrowDown' ? li.nextElementSibling : li.previousElementSibling)?.focus();
  }
});

let chronAnchor = null;

function syncChron() {
  const items = $('chron').children;
  let anchor = null;
  for (const li of items) {
    const y = +li.dataset.year;
    li.classList.toggle('is-past', y <= year);
    const now = y === year;
    li.classList.toggle('is-now', now);
    if (y <= year) anchor = li;
  }
  if (picked && +picked.dataset.year !== year) pick(null);
  // 逐年重启平滑滚动会互相打断，只在当前条目真的换了才滚
  if (anchor && anchor !== chronAnchor && !scrubbing) {
    chronAnchor = anchor;
    const box = $('chron');
    const top = anchor.offsetTop - box.clientHeight * 0.42;
    box.scrollTo({ top, behavior: playing ? 'smooth' : 'auto' });
  }
}

/* ── 国力 ─────────────────────────────────────── */

// 各国立国之年：前473 的赵魏韩尚未分晋，不能说「已亡」
const RISEN = new Map();
{
  const owner = { ...BASE };
  const mark = (y) => { for (const st of new Set(Object.values(owner))) if (!RISEN.has(st)) RISEN.set(st, y); };
  mark(START);
  for (const c of CHANGES) { Object.assign(owner, c.set); mark(c.year); }
  for (const st of SEVEN) if (!RISEN.has(st)) RISEN.set(st, Infinity);
}

const powerBox = $('power');
const powerRows = new Map();
let powerOrder = '';

function powerRow(id) {
  let row = powerRows.get(id);
  if (row) return row;
  const st = STATES[id];
  const el = document.createElement('div');
  el.className = 'pw';
  el.innerHTML = `<span class="pw-name" style="color:${st.ink || st.color}">${st.name}</span>`
    + `<span class="pw-bar"><i class="pw-fill" style="background-color:${st.color}"></i></span>`
    + '<span class="pw-num"></span>';
  row = { el, fill: el.querySelector('.pw-fill'), num: el.querySelector('.pw-num') };
  powerRows.set(id, row);
  return row;
}

const goneNote = document.createElement('p');
goneNote.className = 'pw-gone';

// 条长是估算，须当面说清，免得被当作史载兵数
const powerNote = document.createElement('p');
powerNote.className = 'pw-note';
powerNote.textContent = '条长按所辖之地的田赋人口估算，示意消长，非史载兵数';

function syncPower() {
  const power = table.power();
  const owner = ownerAt(year);
  const counts = new Map();
  for (const r of REGIONS) counts.set(owner[r.id], (counts.get(owner[r.id]) || 0) + 1);
  const rows = [...power.entries()].sort((a, b) => b[1] - a[1])
    .filter(([id, v]) => SEVEN.includes(id) || v >= 1.4);
  const max = rows.length ? rows[0][1] : 1;

  const order = rows.map(([id]) => id).join(',');
  if (order !== powerOrder) {
    powerOrder = order;
    for (const [id] of rows) powerBox.appendChild(powerRow(id).el);
    for (const [id, row] of powerRows) {
      if (!rows.some(([x]) => x === id)) row.el.remove();
    }
  }
  for (const [id, v] of rows) {
    const row = powerRow(id);
    row.fill.style.width = `${(v / max) * 100}%`;
    row.num.textContent = `${counts.get(id) || 0} 地`;
    row.el.title = `${STATES[id].name}：辖 ${counts.get(id) || 0} 地，分量 ${v.toFixed(1)}`;
  }
  const gone = SEVEN.filter((x) => !power.has(x) && RISEN.get(x) <= year);
  const unborn = SEVEN.filter((x) => !power.has(x) && !(RISEN.get(x) <= year));
  const parts = [];
  if (unborn.length) parts.push(`${unborn.map((x) => STATES[x].name).join('、')} 未立`);
  if (gone.length) parts.push(`${gone.map((x) => STATES[x].name).join('、')} 已亡`);
  if (parts.length) {
    goneNote.textContent = parts.join(' · ');
    powerBox.appendChild(goneNote);
  } else {
    goneNote.remove();
  }
  powerBox.appendChild(powerNote);
}

/* ── 案上 ─────────────────────────────────────── */

const detail = $('detail');

let detailMode = 'act';
let actShown = null;

function showAct() {
  table.selected = null;
  detailMode = 'act';
  const a = actAt(year);
  if (actShown === a) return;
  actShown = a;
  const wars = BATTLES.filter((b) => b.year >= a.from && b.year <= a.to).sort((x, y) => x.year - y.year);
  detail.innerHTML = `<p class="dt-eyebrow">第${a.no}幕</p>
    <p class="dt-title">${a.title}</p>
    <p class="dt-sub">${formatYear(a.from)} — ${formatYear(a.to)}</p>
    <p class="dt-val">${a.thesis}</p>
    <div class="dt-row" style="margin-top:14px"><p class="dt-key">本幕战事</p>
      <ul class="dt-wars">${wars.map((b) =>
        `<li><button data-battle="${b.id}"><i>${dateOf(b)}</i>${b.name}</button></li>`).join('')}</ul></div>`;
}

function showEvent(e, narrate = true) {
  detailMode = 'event';
  actShown = null;
  table.selected = null;
  if (narrate) showLore(e); else endMarch();
  detail.innerHTML = `<p class="dt-eyebrow">${KIND_NAME[e.kind]}</p>
    <p class="dt-title">${e.title}</p>
    <p class="dt-sub">${dateOf(e)} · ${eraOf(e.year)}</p>
    <p class="dt-val">${e.text}</p>`;
}

function showRegion(i) {
  detailMode = 'region';
  actShown = null;
  table.selected = null;
  const r = REGIONS[i];
  const st = STATES[table.owner[r.id]];
  const hist = [];
  let prev = null;
  for (let y = START; y <= END; y++) {
    const o = ownerAt(y)[r.id];
    if (o !== prev) { hist.push({ y, o }); prev = o; }
  }
  detail.innerHTML = `<p class="dt-eyebrow">地</p>
    <p class="dt-title">${r.name}</p>
    <p class="dt-sub">${formatYear(year)} 属 ${st.name}</p>
    <div class="dt-row"><p class="dt-key">易主</p>
      <p class="dt-val">${hist.map((h) => `${dateOf(CHANGES.find((c) => c.year === h.y) || { year: h.y })} <strong style="color:${STATES[h.o].ink || STATES[h.o].color}">${STATES[h.o].name}</strong>`).join(' → ')}</p></div>
    <div class="dt-row"><p class="dt-key">分量</p>
      <p class="dt-val">按田赋人口之厚薄估作 <strong>${r.weight.toFixed(1)}</strong>（关中计 2.0）。示意之数，非史载</p></div>`;
}

function selectBattle(id, scroll = false) {
  const b = battleById.get(id);
  if (!b) return;
  detailMode = 'battle';
  actShown = null;
  table.selected = id;
  if (year !== b.year) setYear(b.year);
  detail.innerHTML = `<p class="dt-eyebrow">战</p>
    <p class="dt-title is-war">${b.name}</p>
    <p class="dt-sub">${dateOf(b)} · ${eraOf(b.year)}</p>
    <div class="dt-row"><p class="dt-key">形势</p><p class="dt-val">${b.sides}</p></div>
    <div class="dt-row"><p class="dt-key">兵力</p><p class="dt-val">${b.force}</p></div>
    <div class="dt-row"><p class="dt-key">结局</p><p class="dt-val">${b.result}</p></div>
    <p class="dt-weight">${b.weight}</p>
    <button class="dt-march" id="btnMarch">重看推演</button>`;
  $('btnMarch').addEventListener('click', () => startMarch(b));
  startMarch(b);
  if (scroll) detail.scrollTop = 0;
}

detail.addEventListener('click', (e) => {
  const el = e.target.closest('[data-battle]');
  if (!el) return;
  pause();
  selectBattle(el.dataset.battle, true);
});

/* ── 推演：盘面接管，解说随军而走 ─────────────── */

let march = null;
const cap = $('caption');

const SEALS = { 战: '#c8352b', 变: '#8fae4e', 纵: '#4a9db4', 并: '#c9a227', 都: '#9b66ad', 学: '#b98cc4', 工: '#a8845c' };

function startMarch(b) {
  march = { battle: b, step: -1, struck: false };
  const talk = speech.enabled && speech.ready;
  const avg = b.steps.reduce((n, t) => n + t.length, 0) / b.steps.length;
  table.play(b, talk ? Math.max(1600, avg * 190) : 1250);
  document.body.classList.add('is-marching');
  captionIn();
  cap.classList.remove('is-lore');
  $('capName').textContent = b.name;
  $('capYear').textContent = `${dateOf(b)} · ${eraOf(b.year)}`;
  $('capDots').innerHTML = b.steps.map(() => '<i></i>').join('');
  syncCaption(true);
}

function endMarch(home = true) {
  if (!march) return;
  march = null;
  speech.hush();
  table.stop();
  if (home) table.flyHome();
  table.selected = null;
  table.dirty = true;
  document.body.classList.remove('is-marching');
  cap.hidden = true;
}

// 讲解：把随年而来的事说在盘上，而不是只躺在左栏里
function showLore(e) {
  endMarch();
  captionIn();
  cap.classList.add('is-lore');
  cap.classList.remove('is-final');
  cap.style.setProperty('--seal', SEALS[e.kind] || 'var(--bronze)');
  $('capName').textContent = e.title;
  $('capYear').textContent = `${dateOf(e)} · ${eraOf(e.year)}`;
  $('capNo').textContent = e.kind;
  $('capText').textContent = e.text;
  $('capDots').innerHTML = '';
}

let capTimer = 0;
let restUntil = 0;

// 上一条先退，退净了下一条才进；中间留一口气
function captionOut(then) {
  clearTimeout(capTimer);
  if (cap.hidden) { then?.(); return 0; }
  cap.classList.add('is-leaving');
  capTimer = setTimeout(() => {
    cap.hidden = true;
    cap.classList.remove('is-leaving');
    then?.();
  }, 460);
  return 460;
}

function captionIn() {
  clearTimeout(capTimer);
  cap.classList.remove('is-leaving');
  cap.hidden = false;
}

function hideCaption() {
  endMarch();
  speech.hush();
  clearTimeout(capTimer);
  cap.hidden = true;
  cap.classList.remove('is-leaving');
  queue = [];
  loreUntil = 0;
  restUntil = 0;
}

const NUMERALS = ['一', '二', '三', '四', '五', '六'];

function syncCaption(force = false) {
  if (!march || !table.playback) return;
  const step = table.playback.step;
  if (!force && step === march.step) return;
  march.step = step;
  const line = march.battle.steps[step] || march.battle.steps[march.battle.steps.length - 1];
  speech.say(line);
  if (step >= march.battle.steps.length - 1 && !march.struck) { march.struck = true; chime('war'); }
  $('capNo').textContent = NUMERALS[step] || NUMERALS[march.battle.steps.length - 1];
  $('capText').textContent = line;
  const dots = $('capDots').children;
  for (let i = 0; i < dots.length; i++) dots[i].className = i <= step ? 'is-done' : '';
  $('caption').classList.toggle('is-final', step >= march.battle.steps.length - 1);
}

$('capClose').addEventListener('click', () => { hideCaption(); pause(); });

/* ── 放映 ─────────────────────────────────────── */

const card = $('actCard');
let cinema = false;
let cardUntil = 0;
let cardShown = null;

function toggleCinema() {
  cinema = !cinema;
  document.body.classList.toggle('is-cinema', cinema);
  table.cinema = cinema;
  table.dirty = true;
  $('btnCinema').setAttribute('aria-pressed', String(cinema));
  requestAnimationFrame(() => table.resize());
  if (cinema) {
    hideCaption();
    table.startDrift();
    syncCine();
    showCard(actAt(year));
    wake();
    if (!playing) start();
    document.documentElement.requestFullscreen?.().catch(() => {});
  } else {
    table.stopDrift();
    document.body.classList.remove('is-idle');
    clearTimeout(idleTimer);
    card.hidden = true;
    cardShown = null;
    cardUntil = 0;
    table.fit();
    if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  }
}

function showCard(act) {
  cardShown = act;
  card.hidden = false;
  card.classList.remove('is-out');
  $('cardNo').textContent = act.no;
  $('cardKicker').textContent = `ACT ${act.roman} · ${-act.from}–${-act.to} BC`;
  $('cardTitle').textContent = act.title;
  $('cardEn').textContent = act.en;
  $('cardThesis').textContent = act.thesis;
  // 重放入场动画：元素依次落位，而非整块淡入
  for (const el of card.querySelectorAll('.card-rule, .card-eyebrow, .card-title, .card-en, .card-thesis')) {
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
  }
  cardUntil = performance.now() + 6200;
  if (speech.enabled && speech.ready) {
    speech.say(`第${act.no}幕，${act.title}。${act.thesis}`, () => {
      cardUntil = Math.max(cardUntil, performance.now() + 900);
    });
  }
  chime('act');
}

function syncCine() {
  if (!cinema) return;
  const a = actAt(year);
  $('cineActNo').textContent = a.no;
  $('cineActTitle').textContent = a.title;
  $('cineYear').textContent = formatYear(year);
  $('cineReign').textContent = eraOf(year);
}

let idleTimer = 0;

function wake() {
  document.body.classList.remove('is-idle');
  clearTimeout(idleTimer);
  if (cinema) idleTimer = setTimeout(() => document.body.classList.add('is-idle'), 2600);
}

for (const ev of ['pointermove', 'pointerdown', 'keydown', 'wheel']) {
  window.addEventListener(ev, wake, { passive: true });
}

$('btnCinema').addEventListener('click', toggleCinema);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && cinema) toggleCinema();
});

/* ── 主循环 ───────────────────────────────────── */

function setYear(y, animate = true) {
  const next = Math.max(START, Math.min(END, Math.round(y)));
  if (next === year) return;
  year = next;
  table.setYear(year, animate);
  ruler.setAttribute('aria-valuenow', String(year));
  ruler.setAttribute('aria-valuetext', `${formatYear(year)}年`);
  const at = pct(year);
  $('cursor').style.left = `${at}%`;
  $('cursorYear').textContent = formatYear(year);
  $('cursorYear').classList.toggle('is-flipped', at > 86);
  $('yearBig').textContent = formatYear(year);
  $('yearTag').textContent = eraOf(year);
  syncChron();
  syncPower();
  syncActs();
  syncCine();
  if (detailMode === 'act') showAct();
  const change = CHANGES.find((c) => c.year === year && c.note);
  if (change && animate) showToast(`${dateOf(change)} · ${change.note}`);
  if (playing) {
    const evs = EVENTS.filter((e) => e.year === year);
    const war = evs.find((e) => e.battle);
    queue = evs.filter((e) => !e.battle);
    loreUntil = 0;
    restUntil = 0;
    if (war) selectBattle(war.battle);
    else if (queue.length) nextLore(performance.now());
  }
}

let queue = [];
let loreUntil = 0;

function nextLore(now) {
  const e = queue.shift();
  if (!e) return;
  // 镜头与退场同时起步，新的一条随镜头将定而入——这样衔接才不生硬
  if (cinema && e.at) table.focusOn(e.at, 1.22, 2600);
  const lead = captionOut(() => {
    showLore(e);
    if (playing) showAct();
    const base = dwell(e);
    loreUntil = performance.now() + base;
    if (speech.enabled && speech.ready) {
      loreUntil = performance.now() + base * 3;
      speech.say(`${e.title}。${e.text}`, () => { loreUntil = performance.now() + 700; });
    }
  });
  loreUntil = now + lead + dwell(e);
}

let toastTimer = 0;

function showToast(text) {
  const el = $('toast');
  el.textContent = text;
  el.hidden = false;
  el.classList.remove('is-in');
  void el.offsetWidth;
  el.classList.add('is-in');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('is-in'); }, 2600);
}

function toggle() { playing ? pause() : start(); }

function start() {
  if (year >= END) { hideCaption(); setYear(START, false); }
  playing = true;
  lastTick = performance.now();
  $('playIcon').textContent = '❚❚';
  $('playText').textContent = '暂停';
}

function pause() {
  playing = false;
  speech.hush();
  $('playIcon').textContent = '▶';
  $('playText').textContent = '推演';
}

// 平淡的年份一带而过；有事的年份按其字数留出读完的工夫
// 只为「疆域动了但无事可讲」的年份留驻足；有事的年份由讲解自己决定长短
const EVENT_YEARS = new Set(EVENTS.map((e) => e.year));
const NOTABLE = new Set(CHANGES.map((c) => c.year).filter((y) => !EVENT_YEARS.has(y)));
let speed = 1;

function dwell(x) {
  if (typeof x === 'object') {
    return Math.min(5600, 1500 + (x.title.length + x.text.length) * 62) * speed;
  }
  return NOTABLE.has(x) ? 1250 * speed : 110;
}

/* ── 声 ─────────────────────────────────────── */

const btnSound = $('btnSound');
let soundReady = speech.probe();

const voicePick = $('voicePick');

function refreshSoundBtn() {
  soundReady = speech.ready;
  btnSound.disabled = !soundReady;
  btnSound.title = soundReady
    ? '朗读解说，战事落定敲一记编钟'
    : '此浏览器未提供中文语音，无法朗读';
  // 合成嗓音的好坏因人因机而异，故把选择权交出去
  const list = speech.voices();
  voicePick.hidden = list.length < 2;
  if (list.length >= 2 && voicePick.options.length !== list.length) {
    voicePick.innerHTML = list
      .map((v) => `<option value="${v.name}">${v.name.replace(/\s*\(.*\)$/, '')}</option>`)
      .join('');
    if (speech.voice) voicePick.value = speech.voice.name;
  }
}

voicePick.addEventListener('change', () => {
  speech.use(voicePick.value);
  speech.hush();
  if (speech.enabled) speech.say('戰國沙盤');
});
refreshSoundBtn();
if ('speechSynthesis' in window) speechSynthesis.addEventListener('voiceschanged', refreshSoundBtn);

btnSound.addEventListener('click', () => {
  speech.enabled = !speech.enabled;
  btnSound.setAttribute('aria-pressed', String(speech.enabled));
  if (!speech.enabled) speech.hush();
  else speech.say('戰國沙盤');
});

document.addEventListener('visibilitychange', () => { if (document.hidden) speech.hush(); });
window.addEventListener('pagehide', () => speech.hush());

$('btnSpeed').addEventListener('click', () => {
  speed = speed === 1 ? 0.5 : 1;
  const on = speed !== 1;
  $('btnSpeed').setAttribute('aria-pressed', String(on));
});

$('btnPlay').addEventListener('click', toggle);

function frame(now) {
  if (march) syncCaption();
  if (playing) {
    if (cinema) {
      const a = actAt(year);
      if (a !== cardShown && !table.playback) { showCard(a); lastTick = now; }
      if (cardUntil > now) { lastTick = now; table.draw(now); requestAnimationFrame(frame); return; }
      if (!card.hidden && cardUntil && cardUntil <= now) {
        card.classList.add('is-out');
        setTimeout(() => { card.hidden = true; }, 700);
        cardUntil = 0;
      }
    }
    const pb = table.playback;
    if (pb && pb.t < 1) {
      lastTick = now;
    } else if (march) {
      endMarch(!cinema);
      showAct();
      if (cinema) table.startDrift();
      if (queue.length) nextLore(now + 300);
      lastTick = now + 300;
    } else if (loreUntil > now) {
      lastTick = now;
    } else if (queue.length) {
      nextLore(now);
      lastTick = now;
    } else if (restUntil > now) {
      lastTick = now;
    } else if (!cap.hidden) {
      captionOut();
      restUntil = now + 620;
      lastTick = now;
    } else if (now - lastTick > dwell(year)) {
      lastTick = now;
      if (year >= END) pause(); else setYear(year + 1);
    }
  }
  table.draw(now);
  requestAnimationFrame(frame);
}

/* ── 交互 ─────────────────────────────────────── */

const tip = $('tip');
let dragging = null;

function placeTip(px, py) {
  const w = tip.offsetWidth + 18;
  const flip = px + w > stage.clientWidth;
  tip.classList.toggle('is-left', flip);
  tip.style.left = `${px}px`;
  tip.style.top = `${Math.max(16, Math.min(stage.clientHeight - 16, py))}px`;
}
const touches = new Map();
let pinch = null;

const spread = () => {
  const [a, b] = [...touches.values()];
  return { d: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
};

canvas.addEventListener('pointerdown', (e) => {
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (touches.size === 2) { dragging = null; pinch = spread(); return; }
  dragging = { x: e.clientX, y: e.clientY, moved: 0 };
  canvas.setPointerCapture(e.pointerId);
  canvas.classList.add('is-dragging');
});

canvas.addEventListener('pointermove', (e) => {
  const r = canvas.getBoundingClientRect();
  const px = e.clientX - r.left;
  const py = e.clientY - r.top;
  if (touches.has(e.pointerId)) touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (touches.size === 2 && pinch) {
    const now = spread();
    if (pinch.d > 0) table.zoomAt(now.x - r.left, now.y - r.top, now.d / pinch.d);
    pinch = now;
    tip.hidden = true;
    return;
  }
  if (dragging) {
    table.pan(e.clientX - dragging.x, e.clientY - dragging.y);
    dragging.moved += Math.abs(e.clientX - dragging.x) + Math.abs(e.clientY - dragging.y);
    dragging.x = e.clientX;
    dragging.y = e.clientY;
    tip.hidden = true;
    return;
  }
  const b = table.battleAt(px, py);
  if (b) {
    if (table.hover !== null) table.dirty = true;
    table.hover = null;
    canvas.style.cursor = 'pointer';
    tip.hidden = false;
    tip.innerHTML = `<b>${b.name}</b> <span>${dateOf(b)}</span>`;
    placeTip(px, py);
    return;
  }
  canvas.style.cursor = '';
  const i = table.regionAt(px, py);
  if (i !== table.hover) table.dirty = true;
  table.hover = i;
  if (i < 0) { tip.hidden = true; return; }
  const rg = REGIONS[i];
  const st = STATES[table.owner[rg.id]];
  tip.hidden = false;
  tip.innerHTML = `<b>${rg.name}</b> <span style="color:${st.ink || st.color}">${st.name}</span>`;
  placeTip(px, py);
  $('hint').classList.add('is-hidden');
});

canvas.addEventListener('pointerup', (e) => {
  touches.delete(e.pointerId);
  if (touches.size < 2) pinch = null;
  const wasDrag = dragging && dragging.moved > 5;
  dragging = null;
  canvas.classList.remove('is-dragging');
  if (wasDrag) return;
  const r = canvas.getBoundingClientRect();
  const px = e.clientX - r.left;
  const py = e.clientY - r.top;
  const b = table.battleAt(px, py);
  if (b) { pause(); selectBattle(b.id, true); return; }
  const i = table.regionAt(px, py);
  if (i >= 0) { pause(); hideCaption(); showRegion(i); }
});

canvas.addEventListener('pointercancel', (e) => { touches.delete(e.pointerId); pinch = null; dragging = null; });
canvas.addEventListener('pointerleave', () => { table.hover = null; table.dirty = true; tip.hidden = true; });

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  // 触控板一次轻扫连发数十个 wheel，故按位移大小取指数并夹住单次幅度
  let d = e.deltaY;
  if (e.deltaMode === 1) d *= 16;
  else if (e.deltaMode === 2) d *= 400;
  d = Math.max(-64, Math.min(64, d));
  table.zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-d * 0.0018));
  $('hint').classList.add('is-hidden');
}, { passive: false });

$('btnFit').addEventListener('click', () => table.fit());
$('btnZoomIn').addEventListener('click', () => table.zoomAt(table.css.w / 2, table.css.h / 2, 1.3));
$('btnZoomOut').addEventListener('click', () => table.zoomAt(table.css.w / 2, table.css.h / 2, 1 / 1.3));

for (const chip of document.querySelectorAll('.chip')) {
  chip.addEventListener('click', () => {
    const key = chip.dataset.layer;
    table.layers[key] = !table.layers[key];
    table.dirty = true;
    chip.classList.toggle('is-on', table.layers[key]);
    chip.setAttribute('aria-pressed', String(table.layers[key]));
  });
}

document.addEventListener('keydown', (e) => {
  if (e.defaultPrevented || e.target.closest('.ruler')) return;
  if (e.key === ' ' && !e.target.closest('button')) { e.preventDefault(); toggle(); }
});

new ResizeObserver(() => table.resize()).observe(stage);

/* ── 启程 ─────────────────────────────────────── */

if (document.fonts) document.fonts.load('700 24px "Sandtable Serif"').catch(() => {});

// 触屏上没有滚轮
if (window.matchMedia?.('(pointer: coarse)').matches) {
  $('hint').textContent = '双指缩放 · 拖动移图 · 点朱砂十字看战事';
}

buildRuler();
buildChron();
table.resize();
table.setYear(START, false);
$('cursor').style.left = `${pct(START)}%`;
$('yearTag').textContent = eraOf(START);
syncChron();
syncPower();
syncActs();
showAct();
requestAnimationFrame(frame);
</script>
</body>
</html>
