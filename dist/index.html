:root {
  --void: #080b0c;
  --patina: #12181a;
  --patina-hi: #1a2220;
  --patina-edge: #2b342f;
  --bronze: #c9a227;
  --bronze-dim: #7d6822;
  --cinnabar: #c8352b;
  --cinnabar-dim: #7c2a24;
  --bone: #e8e2d2;
  --bone-2: rgba(232, 226, 210, 0.62);
  --bone-3: rgba(232, 226, 210, 0.34);

  --display: "Sandtable Serif", "Songti SC", "STSong", "Source Han Serif SC",
    "Noto Serif CJK SC", "Noto Serif SC", "SimSun", serif;
  --body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
    "Noto Sans CJK SC", system-ui, sans-serif;
  --num: ui-monospace, "SF Mono", "Menlo", "Consolas", monospace;

  --rail: 64px;
  --ruler: 106px;
  --col: 262px;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  background:
    radial-gradient(120% 90% at 50% 0%, #1a2320 0%, var(--void) 72%);
  color: var(--bone);
  font-family: var(--body);
  font-size: 14px;
  line-height: 1.6;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

:focus-visible {
  outline: 2px solid var(--bronze);
  outline-offset: 2px;
}

.frame {
  display: grid;
  grid-template-rows: var(--rail) 1fr var(--ruler);
  height: 100dvh;
}

/* ── 上梁 ───────────────────────────────────────── */

.rail {
  display: flex;
  align-items: center;
  gap: 28px;
  padding: 0 20px;
  border-bottom: 1px solid var(--patina-edge);
  box-shadow: 0 1px 0 rgba(201, 162, 39, 0.16), inset 0 1px 0 rgba(232, 226, 210, 0.07);
  background: linear-gradient(180deg, #171e1d, #0d1313), var(--cast);
}

/* 铸面：细密的横纹与斑驳，令 UI 读作一块金属而非一层色块 */
:root {
  --cast:
    repeating-linear-gradient(0deg, rgba(232, 226, 210, 0.017) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.05) 0 1px, transparent 1px 5px);
}

.rail-title { display: flex; align-items: baseline; gap: 12px; }

.rail-title h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 700;
  font-size: 25px;
  letter-spacing: 0.34em;
  text-indent: 0.34em;
  color: var(--bone);
  text-shadow: 0 1px 0 #000, 0 0 22px rgba(201, 162, 39, 0.18);
}

/* 幕次：告诉眼睛此刻在读哪一段 */
.rail-act {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 0;
  font-family: var(--display);
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: var(--bone-2);
  white-space: nowrap;
}

.rail-act-no {
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  font-size: 11.5px;
  letter-spacing: 0;
  color: #0d1211;
  background: var(--bronze);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35);
}

.rail-year {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding-left: 24px;
  border-left: 1px solid var(--patina-edge);
  margin-left: auto;
  order: 3;
}

.rail-year-num {
  font-family: var(--display);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--bronze);
  font-variant-numeric: tabular-nums;
}

.rail-year-tag {
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--bone-3);
  white-space: nowrap;
}

.rail-layers { display: flex; flex-wrap: wrap; gap: 6px; order: 2; }

.chip {
  padding: 4px 10px;
  box-shadow: inset 0 1px 0 rgba(232, 226, 210, 0.06);
  font-size: 11.5px;
  letter-spacing: 0.1em;
  color: var(--bone-3);
  border: 1px solid var(--patina-edge);
  border-radius: 2px;
  transition: color 0.16s, border-color 0.16s, background 0.16s;
}

.chip:hover { color: var(--bone-2); border-color: #3c4a43; }

.chip.is-on {
  color: #f0e6c4;
  border-color: rgba(201, 162, 39, 0.55);
  background: rgba(201, 162, 39, 0.09);
}

/* ── 盘面与两侧简册 ─────────────────────────────── */

.board {
  display: grid;
  grid-template-columns: var(--col) minmax(0, 1fr) var(--col);
  min-height: 0;
}

.panel {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  min-height: 0;
  background: linear-gradient(180deg, #111818, #090e0f), var(--cast);
  box-shadow: inset 0 1px 0 rgba(232, 226, 210, 0.05);
}

.panel-left { border-right: 1px solid var(--patina-edge); grid-template-rows: auto minmax(0, 1fr); }
.panel-right { border-left: 1px solid var(--patina-edge); grid-template-rows: auto auto auto minmax(0, 1fr); }

.panel-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px 8px;
  border-bottom: 1px solid var(--patina-edge);
  box-shadow: inset 3px 0 0 rgba(201, 162, 39, 0.5);
}

.panel-head span {
  font-family: var(--display);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.5em;
  text-indent: 0.5em;
  color: var(--bronze);
}

.panel-head::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, rgba(201, 162, 39, 0.4), transparent);
}

.panel-head-mid { border-top: 1px solid var(--patina-edge); }

/* 大事记 —— 简牍式竖界栏 */

.chron {
  list-style: none;
  margin: 0;
  padding: 6px 0 24px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: #2b342f transparent;
}

.chron::-webkit-scrollbar { width: 6px; }
.chron::-webkit-scrollbar-thumb { background: #2b342f; }

.evt {
  position: relative;
  display: grid;
  grid-template-columns: 52px 1fr;
  gap: 10px;
  padding: 7px 14px 7px 12px;
  cursor: pointer;
  border-left: 2px solid transparent;
  opacity: 0.34;
  transition: opacity 0.2s, background 0.2s, border-color 0.2s;
}

.evt.is-past { opacity: 1; }
.evt:hover { background: rgba(232, 226, 210, 0.05); }

.evt.is-now {
  background: rgba(200, 53, 43, 0.1);
  border-left-color: var(--cinnabar);
}

.evt-year {
  font-family: var(--num);
  font-size: 11.5px;
  color: var(--bone-3);
  padding-top: 2px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.evt.is-past .evt-year { color: var(--bronze-dim); }
.evt.is-now .evt-year { color: var(--bronze); }

.evt-body { min-width: 0; }

.evt-title {
  font-family: var(--display);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.06em;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* 类目做成小印：朱文阳刻，字为底色所刻去 */
.evt-kind {
  flex: none;
  width: 16px;
  height: 16px;
  display: grid;
  place-items: center;
  font-size: 10px;
  font-family: var(--display);
  font-weight: 700;
  line-height: 1;
  color: #0a1010;
  background: var(--seal, #6b7268);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(0, 0, 0, 0.5);
  opacity: 0.92;
}

.evt[data-kind="战"] { --seal: #c8352b; }
.evt[data-kind="变"] { --seal: #8fae4e; }
.evt[data-kind="纵"] { --seal: #4a9db4; }
.evt[data-kind="并"] { --seal: #c9a227; }
.evt[data-kind="都"] { --seal: #9b66ad; }
.evt[data-kind="学"] { --seal: #b98cc4; }
.evt[data-kind="工"] { --seal: #a8845c; }

.evt-text {
  display: none;
  margin: 3px 0 0;
  font-size: 12px;
  line-height: 1.62;
  color: var(--bone-3);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.evt.is-now .evt-text,
.evt:hover .evt-text {
  display: -webkit-box;
  color: var(--bone-2);
}

.evt { padding-block: 5px; }
.evt.is-now { padding-block: 9px; }

/* 国力 */

.power { padding: 12px 14px 14px; display: grid; gap: 9px; }

.pw { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 9px; }

.pw-name {
  font-family: var(--display);
  font-size: 16px;
  font-weight: 700;
  text-align: center;
}

.pw-bar {
  position: relative;
  height: 11px;
  overflow: hidden;
  background:
    repeating-linear-gradient(90deg, rgba(232, 226, 210, 0.13) 0 1px, transparent 1px 10%),
    linear-gradient(180deg, rgba(0, 0, 0, 0.55), rgba(232, 226, 210, 0.05));
  box-shadow: inset 0 0 0 1px rgba(232, 226, 210, 0.07);
}

.pw-fill {
  position: absolute;
  inset: 0 auto 0 0;
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  background-image: linear-gradient(180deg,
    rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.06) 46%, rgba(0, 0, 0, 0.3));
  box-shadow: 1px 0 0 rgba(232, 226, 210, 0.5);
}

.pw-num {
  font-family: var(--num);
  font-size: 11px;
  color: var(--bone-3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.pw.is-gone { opacity: 0.28; }

/* 案上：详情 */

.detail {
  padding: 12px 14px 22px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: #2b342f transparent;
}

.detail::-webkit-scrollbar { width: 6px; }
.detail::-webkit-scrollbar-thumb { background: #2b342f; }

.dt-eyebrow {
  font-size: 10.5px;
  letter-spacing: 0.28em;
  color: var(--bone-3);
  margin: 0 0 4px;
}

.dt-title {
  font-family: var(--display);
  font-size: 21px;
  font-weight: 700;
  letter-spacing: 0.1em;
  margin: 0 0 2px;
  color: var(--bone);
}

.dt-title.is-war { color: #f0a99f; }

.dt-sub {
  font-family: var(--num);
  font-size: 11px;
  color: var(--bronze-dim);
  margin: 0 0 12px;
}

.dt-row { margin: 0 0 10px; }

.dt-key {

.act.is-now {

.tick {

}

.tick-label {
  position: absolute;

  transform: translateX(-50%);

.mark {

  width: 2px;
  height: 9px;

  transform: translateX(-1px);
}

.ruler-cursor {

.ruler-cursor::after {

.disclaimer {

@media (max-width: 1080px) {

}

  #table { animation: none; opacity: 1; }

<script type="module">
// 投影与几何：把经纬度压成沙盘平面坐标，并用半平面裁剪求 Voronoi 分区。

const PROJ = { lon0: 113, lat0: 33, k: 100, cos: Math.cos((33 * Math.PI) / 180) };

function project([lon, lat]) {
  return {
    x: (lon - PROJ.lon0) * PROJ.cos * PROJ.k,
    y: -(lat - PROJ.lat0) * PROJ.k,
  };
}

function projectAll(pts) {
  return pts.map(project);
}

function bounds(pts) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of pts) {
    if (p.x < x0) x0 = p.x;
    if (p.y < y0) y0 = p.y;
    if (p.x > x1) x1 = p.x;
    if (p.y > y1) y1 = p.y;
  }
  return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
}

// 以 seed 为内侧，用 seed / other 的中垂线裁剪多边形（Sutherland–Hodgman）。
function clipBisector(poly, seed, other) {
  const dx = seed.x - other.x;
  const dy = seed.y - other.y;
  const c = (other.x * other.x + other.y * other.y - seed.x * seed.x - seed.y * seed.y) / 2;
  const f = (p) => p.x * dx + p.y * dy + c; // > 0 表示离 seed 更近
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i];
    const b = poly[(i + 1) % poly.length];
    const fa = f(a);
    const fb = f(b);
    if (fa >= 0) out.push(a);
    if ((fa >= 0) !== (fb >= 0)) {
      const t = fa / (fa - fb);
      out.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
    }
  }
  return out;
}

function voronoi(seeds, boundary) {
  return seeds.map((seed) => {
    let poly = boundary;
    for (const other of seeds) {
      if (other === seed) continue;
      poly = clipBisector(poly, seed, other);
      if (poly.length < 3) return [];
    }
    return dedupe(poly);
  });
}

function dedupe(poly) {
  const out = [];
  for (const p of poly) {
    const last = out[out.length - 1];
    if (!last || Math.hypot(last.x - p.x, last.y - p.y) > 1e-7) out.push(p);
  }
  if (out.length > 1) {
    const first = out[0];
    const last = out[out.length - 1];
    if (Math.hypot(first.x - last.x, first.y - last.y) < 1e-7) out.pop();
  }
  return out;
}

// 每条边找出邻接单元；找不到的即海岸／图幅边界。
function buildAdjacency(cells, seeds) {
  return cells.map((poly, i) => {
    const seed = seeds[i];
    return poly.map((a, j) => {
      const b = poly[(j + 1) % poly.length];
      const mx = (a.x + b.x) / 2;
      const my = (a.y + b.y) / 2;
      const dSelf = Math.hypot(mx - seed.x, my - seed.y);
      let best = -1;
      let bestD = Infinity;
      for (let k = 0; k < seeds.length; k++) {
        if (k === i) continue;
        const d = Math.hypot(mx - seeds[k].x, my - seeds[k].y);
        if (d < bestD) { bestD = d; best = k; }
      }
      return Math.abs(bestD - dSelf) < dSelf * 1e-6 ? best : -1;
    });
  });
}

function polygonArea(poly) {
  let a = 0;
  for (let i = 0; i < poly.length; i++) {
    const p = poly[i];
    const q = poly[(i + 1) % poly.length];
    a += p.x * q.y - q.x * p.y;
  }
  return a / 2;
}

function centroid(poly) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < poly.length; i++) {
    const p = poly[i];
    const q = poly[(i + 1) % poly.length];
    const f = p.x * q.y - q.x * p.y;
    a += f;
    cx += (p.x + q.x) * f;
    cy += (p.y + q.y) * f;
  }
  if (Math.abs(a) < 1e-9) return { x: poly[0].x, y: poly[0].y };
  return { x: cx / (3 * a), y: cy / (3 * a) };
}

function pointInPolygon(px, py, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i];
    const b = poly[j];
    if ((a.y > py) !== (b.y > py) && px < ((b.x - a.x) * (py - a.y)) / (b.y - a.y) + a.x) {
      inside = !inside;
    }
  }
  return inside;
}

// 沿折线按比例取点，用于行军箭头的逐段推进。
function resample(path, n) {
  const segs = [];
  let total = 0;
  for (let i = 1; i < path.length; i++) {
    const d = Math.hypot(path[i].x - path[i - 1].x, path[i].y - path[i - 1].y);
    segs.push(d);
    total += d;
  }
  const out = [];
  for (let s = 0; s <= n; s++) {
    let want = (total * s) / n;
    let i = 0;
    while (i < segs.length && want > segs[i]) { want -= segs[i]; i++; }
    if (i >= segs.length) { out.push(path[path.length - 1]); continue; }
    const t = segs[i] === 0 ? 0 : want / segs[i];
    out.push({
      x: path[i].x + (path[i + 1].x - path[i].x) * t,
      y: path[i].y + (path[i + 1].y - path[i].y) * t,
    });
  }
  return out;
}

// 卡特姆–罗姆样条，山川与行军路线用它去掉折角。
function smooth(points, tension = 0.5, steps = 12) {
  if (points.length < 3) return points.slice();
  const pts = [points[0], ...points, points[points.length - 1]];
  const out = [];
  for (let i = 1; i < pts.length - 2; i++) {
    const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2];
    for (let s = 0; s < steps; s++) {
      const t = s / steps;
      const t2 = t * t;
      const t3 = t2 * t;
      out.push({
        x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t * 2 * tension +
          (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
        y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t * 2 * tension +
          (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3),
      });
    }
  }
  out.push(points[points.length - 1]);
  return out;
}

function actAt(year) {
  return ACTS.find((a) => year >= a.from && year <= a.to) || ACTS[ACTS.length - 1];
}

function ownerAt(year) {

  const map = { ...BASE };
  for (const c of CHANGES) {
    if (c.year > year) break;
    Object.assign(map, c.set);
  }
  return map;
}

function capitalsAt(year) {
  return CAPITALS.filter((c) => year >= c.from && year < c.to);
}

function formatYear(y) {
  return y < 0 ? `前${-y}` : `${y}`;
}

// 沙盘本体：起伏、水系、疆域镶嵌、兵棋与行军推演，全部画在一张 canvas 上。





const SERIF = '"Sandtable Serif","Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC","Noto Serif SC",serif';
const SANS = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

const PALETTE = {
  void: '#080b0c',
  sea: '#0d1418',
  seaLine: 'rgba(201,162,39,0.09)',
  land: '#2c3129',
  shadow: '#0f120c',
  light: '#525c47',
  bronze: '#c9a227',
  cinnabar: '#c8352b',
  bone: '#e8e2d2',
};

const COAST_FROM = 7;   // 鸭绿江口
const COAST_TO = 36;    // 北部湾
const GRID = 300;       // 高程场分辨率
const SAMPLE = 260;     // 陆地采样分辨率
const KM_PER_UNIT = 1.112; // 一个盘面单位约当的公里数（一度纬距 = 100 单位）

class SandTable {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.year = -475;
    this.owner = ownerAt(this.year);
    this.prevOwner = this.owner;
    this.morph = 1;
    this.layers = { relief: true, rivers: true, walls: true, passes: true, battles: true, labels: true };
    this.playback = null;
    this.hover = null;
    this.selected = null;
    this.view = { scale: 1, x: 0, y: 0 };
    this.build();
  }

  build() {
    this.outline = projectAll(OUTLINE);
    this.bbox = bounds(this.outline);
    this.coast = this.outline.slice(COAST_FROM, COAST_TO + 1);
    this.rim = [...this.outline.slice(COAST_TO), ...this.outline.slice(0, COAST_FROM + 1)];
    this.seaPoly = projectAll([
      ...OUTLINE.slice(COAST_FROM, COAST_TO + 1),
      [107.0, 17.0], [135.0, 17.0], [135.0, 45.0], [126.6, 44.4],
    ]);

    this.seeds = REGIONS.map((r) => ({ ...project([r.lon, r.lat]), region: r }));
    const pad = 60;
    const frame = [
      { x: this.bbox.x0 - pad, y: this.bbox.y0 - pad },
      { x: this.bbox.x1 + pad, y: this.bbox.y0 - pad },
      { x: this.bbox.x1 + pad, y: this.bbox.y1 + pad },
      { x: this.bbox.x0 - pad, y: this.bbox.y1 + pad },
    ];
    this.cells = voronoi(this.seeds, frame);
    this.adjacency = buildAdjacency(this.cells, this.seeds);
    this.index = new Map(REGIONS.map((r, i) => [r.id, i]));

    this.rivers = RIVERS.map((r) => ({ ...r, pts: smooth(projectAll(r.path), 0.5, 10), at: project(r.label) }));
    this.mountains = MOUNTAINS.map((m) => ({ ...m, pts: smooth(projectAll(m.path), 0.5, 10) }));
    this.walls = WALLS.map((w) => ({ ...w, pts: smooth(projectAll(w.path), 0.5, 8) }));
    this.passes = PASSES.map((p) => ({ ...p, at: project([p.lon, p.lat]) }));
    this.battles = BATTLES.map((b) => ({
      ...b,
      at: project(b.at),
      marchers: b.arrows.map((a) => ({ ...a, pts: smooth(projectAll(a.path), 0.5, 14) })),
    }));

    this.sampleLand();
    this.buildRelief();
    this.buildGrain();
  }

  // 只有落在海岸线以内的采样点才算疆土——国名与国力都据此计
  sampleLand() {
    const b = this.bbox;
    const w = SAMPLE;
    const h = Math.round((SAMPLE * b.h) / b.w);
    const cellOf = new Int16Array(w * h).fill(-1);
    const acc = REGIONS.map(() => ({ n: 0, x: 0, y: 0 }));
    const stepX = b.w / w;
    const stepY = b.h / h;
    for (let gy = 0; gy < h; gy++) {
      const py = b.y0 + (gy + 0.5) * stepY;
      for (let gx = 0; gx < w; gx++) {
        const px = b.x0 + (gx + 0.5) * stepX;
        if (!pointInPolygon(px, py, this.outline)) continue;
        let best = -1;
        let bd = Infinity;
        for (let k = 0; k < this.seeds.length; k++) {
          const d = (this.seeds[k].x - px) ** 2 + (this.seeds[k].y - py) ** 2;
          if (d < bd) { bd = d; best = k; }
        }
        cellOf[gy * w + gx] = best;
        acc[best].n++;
        acc[best].x += px;
        acc[best].y += py;
      }
    }
    const unit = stepX * stepY;
    this.landArea = acc.map((a) => a.n * unit);
    this.landCentroid = acc.map((a, i) => (a.n ? { x: a.x / a.n, y: a.y / a.n } : this.seeds[i]));
    this.sample = { cellOf, w, h, stepX, stepY, x0: b.x0, y0: b.y0 };
  }

  // 用山脉骨架烙出高程，再作斜光晕渲——沙盘的起伏由此而来
  buildRelief() {
    const b = this.bbox;
    const w = GRID;
    const h = Math.round((GRID * b.h) / b.w);
    const height = new Float32Array(w * h);
    const sx = w / b.w;
    const sy = h / b.h;

    const stamp = (pt, amp) => {
      const gx = Math.round((pt.x - b.x0) * sx);
      const gy = Math.round((pt.y - b.y0) * sy);
      if (gx < 0 || gy < 0 || gx >= w || gy >= h) return;
      height[gy * w + gx] += amp;
    };
    const amps = { 阴山: 1.1, 燕山: 1.0, 太行: 1.4, 秦岭: 1.7, 崤函: 1.1, 大别: 0.9, 巫山: 1.4, 泰岱: 0.9, 武夷: 1.0, 岷山: 1.9 };
    for (const m of this.mountains) {
      const dense = resample(m.pts, Math.max(30, m.pts.length * 3));
      for (const p of dense) stamp(p, amps[m.name] ?? 1);
    }
    // 西境高原：自西向东递降，使关中、河洛坐落于阶梯之上
    for (let gy = 0; gy < h; gy++) {
      for (let gx = 0; gx < w; gx++) {
        const t = 1 - gx / w;
        height[gy * w + gx] += 0.34 * t * t;
      }
    }
    let seed = 20250809;
    const rnd = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
    for (let i = 0; i < 1400; i++) {
      height[Math.floor(rnd() * h) * w + Math.floor(rnd() * w)] += 0.22;
    }

    blur(height, w, h, 2);
    blur(height, w, h, 5);
    blur(height, w, h, 9);

    let peak = 0;
    for (const v of height) if (v > peak) peak = v;

    const img = new ImageData(w, h);
    const land = hex(PALETTE.land);
    const dark = hex(PALETTE.shadow);
    const lit = hex(PALETTE.light);
    for (let gy = 0; gy < h; gy++) {
      for (let gx = 0; gx < w; gx++) {
        const i = gy * w + gx;
        const o = i * 4;
        const px = b.x0 + (gx + 0.5) / sx;
        const py = b.y0 + (gy + 0.5) / sy;
        if (!pointInPolygon(px, py, this.outline)) { img.data[o + 3] = 0; continue; }
        const hl = height[clampIdx(gx - 1, w) + gy * w];
        const hr = height[clampIdx(gx + 1, w) + gy * w];
        const hu = height[gx + clampRow(gy - 1, h) * w];
        const hd = height[gx + clampRow(gy + 1, h) * w];
        const nx = ((hl - hr) / peak) * 46;
        const ny = ((hu - hd) / peak) * 46;
        let s = (nx * 0.6 + ny * 0.6 + 1) / 2;
        s = Math.max(0, Math.min(1, s));
        const elev = Math.min(1, (height[i] / peak) * 1.3);
        const base = [
          land[0] + (lit[0] - land[0]) * elev * 0.62,
          land[1] + (lit[1] - land[1]) * elev * 0.62,
          land[2] + (lit[2] - land[2]) * elev * 0.62,
        ];
        const k = Math.max(-1, Math.min(1, (s - 0.5) * 2.3));
        for (let c = 0; c < 3; c++) {
          const target = k >= 0 ? lit[c] : dark[c];
          img.data[o + c] = Math.round(base[c] + (target - base[c]) * Math.abs(k));
        }
        img.data[o + 3] = 255;
      }
    }
    this.relief = offscreen(w, h);
    this.relief.getContext('2d').putImageData(img, 0, 0);
  }

  buildGrain() {
    const n = 160;
    const c = offscreen(n, n);
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(n, n);
    let seed = 7717;
    for (let i = 0; i < n * n; i++) {
      seed = (seed * 1664525 + 1013904223) & 0xffffffff;
      const v = (seed >>> 16) & 255;
      img.data[i * 4] = 255; img.data[i * 4 + 1] = 245; img.data[i * 4 + 2] = 225;
      img.data[i * 4 + 3] = v > 228 ? 15 : v < 24 ? 13 : 0;
    }
    ctx.putImageData(img, 0, 0);
    this.grain = c;
  }

  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = this.canvas.getBoundingClientRect();
    this.canvas.width = Math.max(1, Math.round(rect.width * dpr));
    this.canvas.height = Math.max(1, Math.round(rect.height * dpr));
    this.dpr = dpr;
    this.css = { w: rect.width, h: rect.height };
    this.fit();
  }

  fit() {
    if (!this.css) return;
    this.cam = null;
    const pad = 22;
    const s = Math.min((this.css.w - pad * 2) / this.bbox.w, (this.css.h - pad * 2) / this.bbox.h);
    this.base = s;
    this.view.scale = 1;
    this.view.x = (this.css.w - this.bbox.w * s) / 2 - this.bbox.x0 * s;
    this.view.y = (this.css.h - this.bbox.h * s) / 2 - this.bbox.y0 * s;
  }

  toScreen(p) {
    const s = this.base * this.view.scale;
    return { x: p.x * s + this.view.x, y: p.y * s + this.view.y };
  }

  toWorld(px, py) {
    const s = this.base * this.view.scale;
    return { x: (px - this.view.x) / s, y: (py - this.view.y) / s };
  }

  zoomAt(px, py, factor) {
    this.cam = null;
    const before = this.toWorld(px, py);
    this.view.scale = Math.max(0.8, Math.min(7, this.view.scale * factor));
    const after = this.toWorld(px, py);
    const s = this.base * this.view.scale;
    this.view.x += (after.x - before.x) * s;
    this.view.y += (after.y - before.y) * s;
  }

  pan(dx, dy) {
    this.cam = null;
    this.view.x += dx;
    this.view.y += dy;
  }

  setYear(year, animate = true) {
    const next = ownerAt(year);
    const moved = [];
    REGIONS.forEach((r, i) => { if (next[r.id] !== this.owner[r.id]) moved.push(i); });
    this.prevOwner = animate && moved.length ? this.owner : next;
    this.owner = next;
    this.morph = animate && moved.length ? 0 : 1;
    this.year = year;
    this.flash = animate && moved.length ? { idx: moved, start: performance.now() } : null;
    return moved;
  }

  regionAt(px, py) {
    const w = this.toWorld(px, py);
    if (!pointInPolygon(w.x, w.y, this.outline)) return -1;
    let best = -1;
    let bd = Infinity;
    for (let k = 0; k < this.seeds.length; k++) {
      const d = (this.seeds[k].x - w.x) ** 2 + (this.seeds[k].y - w.y) ** 2;
      if (d < bd) { bd = d; best = k; }
    }
    return best;
  }

  battleAt(px, py) {
    let best = null;
    let bestD = 22;
    for (const b of this.battles) {
      if (b.year > this.year) continue;
      const s = this.toScreen(b.at);
      const d = Math.hypot(s.x - px, s.y - py);
      if (d < bestD) { bestD = d; best = b; }
    }
    return best;
  }

  play(battle) {
    const n = battle.marchers.length;
    this.playback = {
      battle, t: 0, step: 0, start: performance.now(),
      per: 1250, tail: 1900, total: n * 1250 + 1900,
    };
    const pts = [battle.at, ...battle.marchers.flatMap((m) => m.pts)];
    this.flyTo(boundsOf(pts));
  }

  stop() { this.playback = null; }

  // 推演毕，镜头退回全景，否则接下来的年份都困在战场里
  flyHome() {
    if (!this.css) return;
    const s = this.base;
    this.cam = {
      from: { ...this.view },
      to: {
        scale: 1,
        x: (this.css.w - this.bbox.w * s) / 2 - this.bbox.x0 * s,
        y: (this.css.h - this.bbox.h * s) / 2 - this.bbox.y0 * s,
      },
      start: performance.now(),
      dur: 750,
    };
  }

  // 推演时把镜头压到战场上，否则行军只是几根短线
  flyTo(box, now = performance.now()) {
    const w = Math.max(box.x1 - box.x0, 1);
    const h = Math.max(box.y1 - box.y0, 1);
    const want = Math.min((this.css.w * 0.5) / w, (this.css.h * 0.54) / h) / this.base;
    const scale = Math.max(1.1, Math.min(5, want));
    const s = this.base * scale;
    this.cam = {
      from: { ...this.view },
      to: {
        scale,
        x: this.css.w / 2 - ((box.x0 + box.x1) / 2) * s,
        y: this.css.h * 0.43 - ((box.y0 + box.y1) / 2) * s,
      },
      start: now,
      dur: 700,
    };
  }

  draw(now) {
    const ctx = this.ctx;
    if (!this.css) return;
    if (this.morph < 1) this.morph = Math.min(1, this.morph + 0.05);
    if (this.cam) {
      const k = ease(Math.min(1, (now - this.cam.start) / this.cam.dur));
      const { from, to } = this.cam;
      this.view.scale = from.scale + (to.scale - from.scale) * k;
      this.view.x = from.x + (to.x - from.x) * k;
      this.view.y = from.y + (to.y - from.y) * k;
      if (k >= 1) this.cam = null;
    }
    ctx.save();
    ctx.scale(this.dpr, this.dpr);
    ctx.clearRect(0, 0, this.css.w, this.css.h);
    ctx.fillStyle = PALETTE.void;
    ctx.fillRect(0, 0, this.css.w, this.css.h);

    this.drawSea(ctx);

    const s = this.base * this.view.scale;
    const org = this.toScreen({ x: this.bbox.x0, y: this.bbox.y0 });

    ctx.save();
    this.path(ctx, this.outline);
    ctx.clip();

    if (this.layers.relief) {
      ctx.drawImage(this.relief, org.x, org.y, this.bbox.w * s, this.bbox.h * s);
    } else {
      ctx.fillStyle = PALETTE.land;
      ctx.fillRect(0, 0, this.css.w, this.css.h);
    }

    this.drawTerritory(ctx);

    if (this.layers.relief) {
      ctx.globalCompositeOperation = 'overlay';
      ctx.globalAlpha = 0.62;
      ctx.drawImage(this.relief, org.x, org.y, this.bbox.w * s, this.bbox.h * s);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    this.drawRidges(ctx);
    if (this.layers.rivers) this.drawRivers(ctx);
    this.drawBorders(ctx);
    this.drawFlash(ctx, now);
    if (this.layers.walls) this.drawWalls(ctx);
    this.drawHover(ctx);
    ctx.restore();

    this.drawRim(ctx);
    this.drawCoast(ctx);
    if (this.layers.passes) this.drawPasses(ctx);
    this.drawCapitals(ctx);
    if (this.layers.labels) this.drawNames(ctx);
    if (this.layers.battles) this.drawBattles(ctx, now);
    if (this.playback) this.drawPlayback(ctx, now);

    this.drawPlate(ctx);
    this.drawCompass(ctx);
    this.drawScale(ctx);
    if (!this.playback && this.css.w > 560) this.drawLegend(ctx);

    ctx.globalAlpha = 0.55;
    ctx.fillStyle = ctx.createPattern(this.grain, 'repeat');
    ctx.fillRect(0, 0, this.css.w, this.css.h);
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  path(ctx, pts, close = true) {
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const p = this.toScreen(pts[i]);
      if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    if (close) ctx.closePath();
  }

  drawSea(ctx) {
    ctx.save();
    this.path(ctx, this.seaPoly);
    ctx.fillStyle = PALETTE.sea;
    ctx.fill();
    ctx.clip();
    ctx.strokeStyle = PALETTE.seaLine;
    ctx.lineWidth = 1;
    const step = Math.max(10, 13 * this.view.scale);
    for (let y = -this.css.h; y < this.css.h * 2; y += step) {
      ctx.beginPath();
      ctx.moveTo(-40, y);
      ctx.lineTo(this.css.w + 40, y + this.css.w * 0.05);
      ctx.stroke();
    }
    ctx.restore();
  }

  fillFor(i) {
    const id = REGIONS[i].id;
    const now = STATES[this.owner[id]];
    const was = STATES[this.prevOwner[id]] || now;
    if (this.morph >= 1 || now === was) return now.color;
    return mix(was.color, now.color, ease(this.morph));
  }

  drawTerritory(ctx) {
    for (let i = 0; i < this.cells.length; i++) {
      if (!this.cells[i].length || !this.landArea[i]) continue;
      const st = STATES[this.owner[REGIONS[i].id]];
      this.path(ctx, this.cells[i]);
      // 化外之地压暗后退，列国之土才浮得起来
      ctx.fillStyle = st.tribe ? mix(this.fillFor(i), '#0a0d0b', 0.62) : this.fillFor(i);
      ctx.globalAlpha = st.tribe ? 0.78 : 0.62;
      ctx.fill();
      ctx.globalAlpha = 1;
      if (st.tribe) {
        ctx.save();
        ctx.clip();
        ctx.strokeStyle = 'rgba(232,226,210,0.075)';
        ctx.lineWidth = 1;
        const bb = boundsOf(this.cells[i].map((p) => this.toScreen(p)));
        for (let x = bb.x0 - bb.h; x < bb.x1 + bb.h; x += 8) {
          ctx.beginPath();
          ctx.moveTo(x, bb.y0);
          ctx.lineTo(x + bb.h, bb.y1);
          ctx.stroke();
        }
        ctx.restore();
      }
    }
    ctx.strokeStyle = 'rgba(9,12,10,0.32)';
    ctx.lineWidth = 0.6;
    for (const cell of this.cells) {
      if (!cell.length) continue;
      this.path(ctx, cell);
      ctx.stroke();
    }
  }

  drawBorders(ctx) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (let i = 0; i < this.cells.length; i++) {
      const cell = this.cells[i];
      if (!cell.length) continue;
      const mine = this.owner[REGIONS[i].id];
      for (let j = 0; j < cell.length; j++) {
        const nb = this.adjacency[i][j];
        if (nb < 0 || nb < i) continue;
        if (this.owner[REGIONS[nb].id] === mine) continue;
        const a = this.toScreen(cell[j]);
        const b = this.toScreen(cell[(j + 1) % cell.length]);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = 'rgba(6,8,7,0.65)';
        ctx.lineWidth = 3.2;
        ctx.stroke();
        ctx.strokeStyle = (STATES[mine].ink || '#96a096') + 'cc';
        ctx.lineWidth = 1.3;
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // 图幅西、北两侧非海岸，令其溶入盘外的暗处
  drawRim(ctx) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const layers = [[34, 0.95], [22, 0.7], [12, 0.5], [5, 0.35]];
    for (const [w, a] of layers) {
      this.path(ctx, this.rim, false);
      ctx.strokeStyle = `rgba(8,11,12,${a})`;
      ctx.lineWidth = w;
      ctx.stroke();
    }
    ctx.restore();
  }

  drawCoast(ctx) {
    this.path(ctx, this.coast, false);
    ctx.strokeStyle = 'rgba(201,162,39,0.5)';
    ctx.lineWidth = 1.4;
    ctx.lineJoin = 'round';
    ctx.stroke();
  }

  drawRidges(ctx) {
    ctx.save();
    ctx.lineCap = 'round';
    for (const m of this.mountains) {
      const pts = m.pts.map((p) => this.toScreen(p));
      for (let i = 1; i < pts.length; i += 2) {
        const a = pts[i - 1];
        const b = pts[i];
        const len = Math.hypot(b.x - a.x, b.y - a.y);
        if (len < 2) continue;
        const nx = -(b.y - a.y) / len;
        const ny = (b.x - a.x) / len;
        const size = 3.4 + 2.6 * Math.min(2, this.view.scale);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(a.x + nx * size, a.y + ny * size);
        ctx.strokeStyle = 'rgba(232,226,205,0.20)';
        ctx.lineWidth = 1.1;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(a.x - nx * size * 0.85, a.y - ny * size * 0.85);
        ctx.strokeStyle = 'rgba(0,0,0,0.4)';
        ctx.lineWidth = 1.3;
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  drawRivers(ctx) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const r of this.rivers) {
      this.path(ctx, r.pts, false);
      ctx.strokeStyle = 'rgba(5,9,11,0.6)';
      ctx.lineWidth = 3.8;
      ctx.stroke();
      this.path(ctx, r.pts, false);
      ctx.strokeStyle = 'rgba(122,180,196,0.75)';
      ctx.lineWidth = 1.7;
      ctx.stroke();
    }
    if (this.view.scale > 1.1) {
      ctx.font = `700 11px ${SERIF}`;
      ctx.fillStyle = 'rgba(150,200,212,0.9)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const r of this.rivers) {
        const p = this.toScreen(r.at);
        ctx.fillText(r.name, p.x, p.y);
      }
    }
    ctx.restore();
  }

  drawWalls(ctx) {
    ctx.save();
    ctx.setLineDash([7, 4]);
    for (const w of this.walls) {
      if (this.year < (WALL_BUILT[w.name] ?? -400)) continue;
      const owner = this.owner[nearestRegionId(this.seeds, w.pts[0])];
      this.path(ctx, w.pts, false);
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.lineWidth = 4.5;
      ctx.stroke();
      this.path(ctx, w.pts, false);
      ctx.strokeStyle = (STATES[owner]?.ink || '#cbbf9a') + 'e6';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.restore();
  }

  drawPasses(ctx) {
    ctx.save();
    for (const p of this.passes) {
      const s = this.toScreen(p.at);
      ctx.beginPath();
      ctx.moveTo(s.x - 4, s.y + 3);
      ctx.lineTo(s.x - 4, s.y - 2);
      ctx.lineTo(s.x, s.y - 5);
      ctx.lineTo(s.x + 4, s.y - 2);
      ctx.lineTo(s.x + 4, s.y + 3);
      ctx.strokeStyle = 'rgba(201,162,39,0.9)';
      ctx.lineWidth = 1.3;
      ctx.stroke();
      if (this.view.scale > 1.25) {
        ctx.font = `500 10px ${SANS}`;
        ctx.fillStyle = 'rgba(201,162,39,0.85)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(p.name, s.x, s.y + 6);
      }
    }
    ctx.restore();
  }

  // 兵棋：都城为方座，座之高低即国力
  drawCapitals(ctx) {
    const power = this.power();
    for (const c of capitalsAt(this.year)) {
      const st = STATES[c.state];
      const p = this.toScreen(project([c.lon, c.lat]));
      const pw = power.get(c.state) || 0;
      const hgt = 6 + Math.min(18, pw * 0.6);
      const w = 10;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath();
      ctx.ellipse(2, 1.5, w * 0.85, 3.4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = st.color;
      ctx.fillRect(-w / 2, -hgt, w, hgt);
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.fillRect(-w / 2, -hgt, w * 0.38, hgt);
      ctx.strokeStyle = 'rgba(232,226,210,0.8)';
      ctx.lineWidth = 1;
      ctx.strokeRect(-w / 2, -hgt, w, hgt);
      ctx.fillStyle = PALETTE.bone;
      ctx.font = `700 ${Math.min(11, 5 + hgt * 0.4)}px ${SERIF}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(st.name, 0, -hgt / 2);
      ctx.restore();
      if (this.view.scale > 1.15) {
        ctx.font = `500 10px ${SANS}`;
        ctx.fillStyle = 'rgba(232,226,210,0.7)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(c.name, p.x, p.y + 4);
      }
    }
  }

  drawNames(ctx) {
    const groups = new Map();
    for (let i = 0; i < REGIONS.length; i++) {
      const st = this.owner[REGIONS[i].id];
      if (STATES[st].tribe || !this.landArea[i]) continue;
      const g = groups.get(st) || { area: 0, n: 0, x: 0, y: 0, best: i, bestArea: 0 };
      g.area += this.landArea[i];
      g.n += this.landArea[i];
      g.x += this.landCentroid[i].x * this.landArea[i];
      g.y += this.landCentroid[i].y * this.landArea[i];
      if (this.landArea[i] > g.bestArea) { g.bestArea = this.landArea[i]; g.best = i; }
      groups.set(st, g);
    }
    const fade = 1 - Math.max(0, Math.min(1, (this.view.scale - 1.7) / 0.6));
    if (fade <= 0) return;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const [st, g] of groups) {
      if (g.area < 9000) continue;
      let anchor = { x: g.x / g.n, y: g.y / g.n };
      if (this.cellOwnerAtWorld(anchor) !== st) anchor = this.landCentroid[g.best];
      const p = this.toScreen(anchor);
      const size = Math.max(15, Math.min(38, Math.sqrt(g.area) * 0.085)) * Math.min(1.6, this.view.scale ** 0.35);
      ctx.font = `700 ${size}px ${SERIF}`;
      ctx.lineWidth = size * 0.14;
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.strokeText(STATES[st].name, p.x, p.y);
      ctx.fillStyle = 'rgba(242,238,228,0.92)';
      ctx.fillText(STATES[st].name, p.x, p.y);
    }
    ctx.restore();
  }

  cellOwnerAtWorld(pt) {
    const s = this.sample;
    const gx = Math.floor((pt.x - s.x0) / s.stepX);
    const gy = Math.floor((pt.y - s.y0) / s.stepY);
    if (gx < 0 || gy < 0 || gx >= s.w || gy >= s.h) return null;
    const i = s.cellOf[gy * s.w + gx];
    return i < 0 ? null : this.owner[REGIONS[i].id];
  }

  drawBattles(ctx, now) {
    ctx.save();
    for (const b of this.battles) {
      if (b.year > this.year) continue;
      const p = this.toScreen(b.at);
      const fresh = this.year - b.year;
      const active = fresh <= 6;
      const sel = this.selected === b.id;
      const r = sel ? 8 : 5.5;
      if (sel || active) {
        const pulse = 1 + 0.4 * Math.sin(now / 320);
        ctx.beginPath();
        ctx.arc(p.x, p.y, r * 1.9 * pulse, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(200,53,43,${sel ? 0.5 : 0.26})`;
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }
      ctx.globalAlpha = sel ? 1 : active ? 0.95 : 0.4;
      ctx.strokeStyle = PALETTE.cinnabar;
      ctx.lineWidth = sel ? 2.4 : 1.8;
      ctx.beginPath();
      ctx.moveTo(p.x - r, p.y - r);
      ctx.lineTo(p.x + r, p.y + r);
      ctx.moveTo(p.x + r, p.y - r);
      ctx.lineTo(p.x - r, p.y + r);
      ctx.stroke();
      ctx.globalAlpha = 1;
      const busy = this.playback && this.playback.battle.id === b.id;
      if (!busy && (sel || (active && this.view.scale > 1))) {
        ctx.font = `600 11.5px ${SANS}`;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(0,0,0,0.7)';
        ctx.strokeText(b.name, p.x + r + 5, p.y - r - 2);
        ctx.fillStyle = 'rgba(244,182,172,0.98)';
        ctx.fillText(b.name, p.x + r + 5, p.y - r - 2);
      }
    }
    ctx.restore();
  }

  drawPlayback(ctx, now) {
    const pb = this.playback;
    const elapsed = now - pb.start;
    pb.t = Math.min(1, elapsed / pb.total);
    pb.step = Math.min(pb.battle.marchers.length, Math.floor(elapsed / pb.per));
    const b = pb.battle;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    b.marchers.forEach((m, idx) => {
      const t = Math.max(0, Math.min(1, (elapsed - idx * pb.per) / pb.per));
      if (t <= 0) return;
      const live = idx === pb.step || pb.step >= b.marchers.length;
      const pts = m.pts.map((p) => this.toScreen(p));
      const seg = pts.slice(0, Math.max(2, Math.floor(pts.length * t)));
      const ink = STATES[m.state]?.ink || '#e8e2d2';
      ctx.beginPath();
      seg.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
      ctx.strokeStyle = live ? 'rgba(0,0,0,0.6)' : 'rgba(0,0,0,0.32)';
      ctx.lineWidth = live ? 6.5 : 4.2;
      ctx.stroke();
      ctx.beginPath();
      seg.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
      ctx.strokeStyle = live ? ink : dim(ink, 0.62);
      ctx.lineWidth = live ? 3 : 2.2;
      ctx.stroke();
      const head = seg[seg.length - 1];
      const prev = seg[Math.max(0, seg.length - 4)];
      const ang = Math.atan2(head.y - prev.y, head.x - prev.x);
      ctx.save();
      ctx.translate(head.x, head.y);
      ctx.rotate(ang);
      ctx.fillStyle = ink;
      ctx.beginPath();
      ctx.moveTo(10, 0);
      ctx.lineTo(-4, 5.5);
      ctx.lineTo(-1.5, 0);
      ctx.lineTo(-4, -5.5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      if (m.label) {
        ctx.font = `700 12px ${SERIF}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(0,0,0,0.75)';
        ctx.strokeText(m.label, head.x, head.y - 9);
        ctx.fillStyle = ink;
        ctx.fillText(m.label, head.x, head.y - 9);
      }
    });
    const tailStart = (pb.total - pb.tail) / pb.total;
    if (pb.t > tailStart) {
      const p = this.toScreen(b.at);
      const k = (pb.t - tailStart) / (1 - tailStart);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 6 + 34 * k, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(200,53,43,${0.75 * (1 - k)})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.restore();
  }

  drawFlash(ctx, now) {
    if (!this.flash) return;
    const k = (now - this.flash.start) / 1800;
    if (k >= 1) { this.flash = null; return; }
    ctx.save();
    ctx.lineJoin = 'round';
    const a = (1 - k) * (0.55 + 0.45 * Math.sin(now / 90));
    for (const i of this.flash.idx) {
      const cell = this.cells[i];
      if (!cell || !cell.length) continue;
      this.path(ctx, cell);
      ctx.strokeStyle = `rgba(240,232,205,${a})`;
      ctx.lineWidth = 2.4;
      ctx.stroke();
      this.path(ctx, cell);
      ctx.fillStyle = `rgba(240,232,205,${a * 0.12})`;
      ctx.fill();
    }
    ctx.restore();
  }

  drawHover(ctx) {
    if (this.hover == null || this.hover < 0) return;
    const cell = this.cells[this.hover];
    if (!cell || !cell.length) return;
    ctx.save();
    this.path(ctx, cell);
    ctx.fillStyle = 'rgba(232,226,210,0.08)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(232,226,210,0.8)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }

  // 盘缘：刻度、角标、方位、比例、图例——沙盘的框本身也是读图的工具
  drawPlate(ctx) {
    const m = 9;
    const w = this.css.w;
    const h = this.css.h;
    ctx.save();
    ctx.strokeStyle = 'rgba(201,162,39,0.2)';
    ctx.lineWidth = 1;
    ctx.strokeRect(m + 0.5, m + 0.5, w - m * 2 - 1, h - m * 2 - 1);

    ctx.strokeStyle = 'rgba(201,162,39,0.16)';
    for (let x = m; x < w - m; x += 40) {
      const major = Math.round((x - m) / 40) % 5 === 0;
      ctx.beginPath();
      ctx.moveTo(x + 0.5, m + 1);
      ctx.lineTo(x + 0.5, m + (major ? 8 : 4));
      ctx.moveTo(x + 0.5, h - m - 1);
      ctx.lineTo(x + 0.5, h - m - (major ? 8 : 4));
      ctx.stroke();
    }
    for (let y = m; y < h - m; y += 40) {
      const major = Math.round((y - m) / 40) % 5 === 0;
      ctx.beginPath();
      ctx.moveTo(m + 1, y + 0.5);
      ctx.lineTo(m + (major ? 8 : 4), y + 0.5);
      ctx.moveTo(w - m - 1, y + 0.5);
      ctx.lineTo(w - m - (major ? 8 : 4), y + 0.5);
      ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(201,162,39,0.6)';
    ctx.lineWidth = 1.6;
    const L = 16;
    for (const [cx, cy, dx, dy] of [[m, m, 1, 1], [w - m, m, -1, 1], [m, h - m, 1, -1], [w - m, h - m, -1, -1]]) {
      ctx.beginPath();
      ctx.moveTo(cx + dx * L, cy);
      ctx.lineTo(cx, cy);
      ctx.lineTo(cx, cy + dy * L);
      ctx.stroke();
    }
    ctx.restore();
  }

  drawCompass(ctx) {
    const x = this.css.w - 34;
    const y = 44;
    ctx.save();
    ctx.strokeStyle = 'rgba(201,162,39,0.65)';
    ctx.fillStyle = 'rgba(201,162,39,0.85)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x, y + 13);
    ctx.lineTo(x, y - 6);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y - 12);
    ctx.lineTo(x - 4, y - 3);
    ctx.lineTo(x + 4, y - 3);
    ctx.closePath();
    ctx.fill();
    ctx.font = `700 12px ${SERIF}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('北', x, y + 16);
    ctx.restore();
  }

  drawScale(ctx) {
    const pxPerKm = (this.base * this.view.scale) / KM_PER_UNIT;
    const steps = [50, 100, 200, 300, 500, 1000, 2000];
    let km = steps[steps.length - 1];
    for (const c of steps) { if (c * pxPerKm >= 70 && c * pxPerKm <= 170) { km = c; break; } }
    const len = km * pxPerKm;
    const x = 22;
    const y = this.css.h - 44;
    ctx.save();
    ctx.strokeStyle = 'rgba(201,162,39,0.8)';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(x, y - 4);
    ctx.lineTo(x, y);
    ctx.lineTo(x + len, y);
    ctx.lineTo(x + len, y - 4);
    ctx.moveTo(x + len / 2, y);
    ctx.lineTo(x + len / 2, y - 3);
    ctx.stroke();
    ctx.fillStyle = 'rgba(232,226,210,0.62)';
    ctx.font = `500 10.5px ${SANS}`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(`${km} 公里 · 约 ${Math.round(km / 0.4158 / 10) * 10} 秦里`, x, y + 4);
    ctx.restore();
  }

  drawLegend(ctx) {
    const rows = ['都城·兵棋', '关塞', '长城', '战事', '化外之地'];
    const x = 24;
    const y = 26;
    const w = 106;
    const h = 20 + rows.length * 17;
    ctx.save();
    ctx.fillStyle = 'rgba(8,11,12,0.74)';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(201,162,39,0.24)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    ctx.fillStyle = 'rgba(201,162,39,0.75)';
    ctx.font = `700 10px ${SERIF}`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('圖 例', x + 9, y + 11);

    ctx.font = `500 10.5px ${SANS}`;
    const gx = x + 9;
    rows.forEach((label, i) => {
      const cy = y + 28 + i * 17;
      ctx.save();
      if (i === 0) {
        ctx.fillStyle = '#8e5aa0';
        ctx.fillRect(gx, cy - 6, 6, 10);
        ctx.strokeStyle = 'rgba(232,226,210,0.7)';
        ctx.lineWidth = 1;
        ctx.strokeRect(gx + 0.5, cy - 5.5, 5, 9);
      } else if (i === 1) {
        ctx.strokeStyle = 'rgba(201,162,39,0.9)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(gx, cy + 3);
        ctx.lineTo(gx, cy - 1);
        ctx.lineTo(gx + 3.5, cy - 4);
        ctx.lineTo(gx + 7, cy - 1);
        ctx.lineTo(gx + 7, cy + 3);
        ctx.stroke();
      } else if (i === 2) {
        ctx.strokeStyle = '#c6bb98';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 3]);
        ctx.beginPath();
        ctx.moveTo(gx - 1, cy);
        ctx.lineTo(gx + 9, cy);
        ctx.stroke();
      } else if (i === 3) {
        ctx.strokeStyle = PALETTE.cinnabar;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(gx, cy - 4);
        ctx.lineTo(gx + 8, cy + 4);
        ctx.moveTo(gx + 8, cy - 4);
        ctx.lineTo(gx, cy + 4);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#2c3029';
        ctx.fillRect(gx, cy - 5, 9, 10);
        ctx.strokeStyle = 'rgba(232,226,210,0.3)';
        ctx.lineWidth = 1;
        for (let k = -8; k < 10; k += 4) {
          ctx.beginPath();
          ctx.moveTo(gx + k, cy + 5);
          ctx.lineTo(gx + k + 10, cy - 5);
          ctx.stroke();
        }
      }
      ctx.restore();
      ctx.fillStyle = 'rgba(232,226,210,0.6)';
      ctx.fillText(label, gx + 16, cy);
    });
    ctx.restore();
  }

  power() {
    const m = new Map();
    for (const r of REGIONS) {
      const st = this.owner[r.id];
      if (STATES[st].tribe) continue;
      m.set(st, (m.get(st) || 0) + r.weight);
    }
    return m;
  }
}

const WALL_BUILT = {
  赵北长城: -300, 燕北长城: -300, 秦昭王长城: -272,
  齐长城: -400, 楚方城: -475, 魏河西长城: -358,
};

function nearestRegionId(seeds, pt) {
  let best = seeds[0];
  let bd = Infinity;
  for (const s of seeds) {
    const d = (s.x - pt.x) ** 2 + (s.y - pt.y) ** 2;
    if (d < bd) { bd = d; best = s; }
  }
  return best.region.id;
}

function boundsOf(pts) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of pts) {
    x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y);
    x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y);
  }
  return { x0, y0, x1, y1, h: y1 - y0 };
}

function blur(arr, w, h, r) {
  const tmp = new Float32Array(arr.length);
  for (let y = 0; y < h; y++) {
    let sum = 0;
    for (let x = -r; x <= r; x++) sum += arr[y * w + clampIdx(x, w)];
    for (let x = 0; x < w; x++) {
      tmp[y * w + x] = sum / (2 * r + 1);
      sum += arr[y * w + clampIdx(x + r + 1, w)] - arr[y * w + clampIdx(x - r, w)];
    }
  }
  for (let x = 0; x < w; x++) {
    let sum = 0;
    for (let y = -r; y <= r; y++) sum += tmp[clampRow(y, h) * w + x];
    for (let y = 0; y < h; y++) {
      arr[y * w + x] = sum / (2 * r + 1);
      sum += tmp[clampRow(y + r + 1, h) * w + x] - tmp[clampRow(y - r, h) * w + x];
    }
  }
}

const clampIdx = (i, w) => (i < 0 ? 0 : i >= w ? w - 1 : i);
const clampRow = (i, h) => (i < 0 ? 0 : i >= h ? h - 1 : i);

function offscreen(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return c;
}

function hex(s) {
  if (s[0] !== '#') return s.match(/\d+/g).slice(0, 3).map(Number);
  return [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)];
}

function mix(a, b, t) {
  const x = hex(a);
  const y = hex(b);
  const c = x.map((v, i) => Math.round(v + (y[i] - v) * t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function dim(color, k) {
  const c = hex(color);
  return `rgba(${c[0]},${c[1]},${c[2]},${k})`;
}

const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);

/* ── 纪年 ─────────────────────────────────────── */

const REIGNS = [
  [-475, -469, '周元王'], [-468, -442, '周贞定王'], [-441, -441, '周哀王'],
  [-440, -426, '周考王'], [-425, -402, '周威烈王'], [-401, -376, '周安王'],
  [-375, -369, '周烈王'], [-368, -321, '周显王'], [-320, -315, '周慎靓王'],
  [-314, -256, '周赧王'], [-255, -251, '秦昭襄王'], [-250, -250, '秦孝文王'],
  [-249, -247, '秦庄襄王'], [-246, -221, '秦王政'],
];

const DIGITS = '〇一二三四五六七八九';

function cn(n) {
  if (n <= 10) return n === 10 ? '十' : DIGITS[n];
  if (n < 20) return '十' + DIGITS[n - 10];
  const t = Math.floor(n / 10);
  const o = n % 10;
  return DIGITS[t] + '十' + (o ? DIGITS[o] : '');
}

function eraOf(y) {
  const r = REIGNS.find(([a, b]) => y >= a && y <= b);
  if (!r) return '';
  const n = y - r[0] + 1;
  return `${r[2]}${n === 1 ? '元' : cn(n)}年`;
}

/* ── 铜尺 ─────────────────────────────────────── */

const ruler = $('ruler');
const pct = (y) => ((y - START) / (END - START)) * 100;

function buildRuler() {
  $('acts').innerHTML = ACTS.map((a, i) => {
    const l = pct(a.from);
    const w = pct(a.to) - l;
    return `<button class="act" data-act="${i}" style="left:${l}%;width:${w}%">
      <b>${a.no}</b><span>${a.title}</span></button>`;
  }).join('');
  const ticks = $('ticks');
  const marks = $('marks');
  let html = '';
  for (let y = -470; y <= END; y += 10) {
    const major = y % 50 === 0;
    html += `<i class="tick${major ? ' is-major' : ''}" style="left:${pct(y)}%;height:${major ? 16 : 8}px"></i>`;
    if (major) html += `<i class="tick-label" style="left:${pct(y)}%">前${-y}</i>`;
  }
  ticks.innerHTML = html;
  marks.innerHTML = BATTLES.map(
    (b) => `<i class="mark" style="left:${pct(b.year)}%" title="${b.name}"></i>`
  ).join('');
}

$('acts').addEventListener('click', (e) => {
  const el = e.target.closest('.act');
  if (!el) return;
  e.stopPropagation();
  pause();
  endMarch();
  setYear(ACTS[+el.dataset.act].from);
  showAct();
});

function syncActs() {
  const cur = actAt(year);
  $('actNo').textContent = cur.no;
  $('actTitle').textContent = cur.title;
  for (const el of $('acts').children) {
    el.classList.toggle('is-now', ACTS[+el.dataset.act] === cur);
  }
}

function yearFromEvent(e) {
  const r = ruler.getBoundingClientRect();
  const t = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  return Math.round(START + t * (END - START));
}

let scrubbing = false;
ruler.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.act')) return;
  scrubbing = true;
  hideCaption();
  if (detailMode !== 'act') showAct();
  ruler.setPointerCapture(e.pointerId);
  setYear(yearFromEvent(e));
  pause();
});
ruler.addEventListener('pointermove', (e) => { if (scrubbing) setYear(yearFromEvent(e)); });
ruler.addEventListener('pointerup', () => { scrubbing = false; syncChron(); });
ruler.addEventListener('keydown', (e) => {
  const step = e.shiftKey ? 10 : 1;
  if (detailMode !== 'act' && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) { hideCaption(); showAct(); }
  if (e.key === 'ArrowLeft') { setYear(year - step); pause(); }
  else if (e.key === 'ArrowRight') { setYear(year + step); pause(); }
  else if (e.key === 'Home') { setYear(START); pause(); }
  else if (e.key === 'End') { setYear(END); pause(); }
  else if (e.key === ' ') { toggle(); }
  else return;
  e.preventDefault();
});

/* ── 大事记 ───────────────────────────────────── */

function buildChron() {
  $('chron').innerHTML = EVENTS.map(
    (e, i) => `<li class="evt" data-i="${i}" data-kind="${e.kind}" data-year="${e.year}"${e.battle ? ` data-battle="${e.battle}"` : ''}>
      <span class="evt-year">${formatYear(e.year)}</span>
      <div class="evt-body">
        <p class="evt-title"><i class="evt-kind">${e.kind}</i>${e.title}</p>
        <p class="evt-text">${e.text}</p>
      </div>
    </li>`
  ).join('');
}

$('chron').addEventListener('click', (e) => {
  const li = e.target.closest('.evt');
  if (!li) return;
  pause();
  if (li.dataset.battle) { setYear(+li.dataset.year); selectBattle(li.dataset.battle, true); }
  else { setYear(+li.dataset.year); showEvent(EVENTS[+li.dataset.i]); }
});

function syncChron() {
  const items = $('chron').children;
  let anchor = null;
  for (const li of items) {
    const y = +li.dataset.year;
    li.classList.toggle('is-past', y <= year);
    const now = y === year;
    li.classList.toggle('is-now', now);
    if (y <= year) anchor = li;
  }
  if (anchor && !scrubbing) {
    const box = $('chron');
    const top = anchor.offsetTop - box.clientHeight * 0.42;
    box.scrollTo({ top, behavior: 'smooth' });
  }
}

/* ── 国力 ─────────────────────────────────────── */

function syncPower() {
  const power = table.power();
  const owner = ownerAt(year);
  const counts = new Map();
  for (const r of REGIONS) counts.set(owner[r.id], (counts.get(owner[r.id]) || 0) + 1);
  const rows = [...power.entries()].sort((a, b) => b[1] - a[1]);
  const max = rows.length ? rows[0][1] : 1;
  const shown = rows.filter(([id, v]) => SEVEN.includes(id) || v >= 1.4);
  $('power').innerHTML = shown.map(([id, v]) => {
    const st = STATES[id];
    return `<div class="pw">
      <span class="pw-name" style="color:${st.ink || st.color}">${st.name}</span>
      <span class="pw-bar"><i class="pw-fill" style="width:${(v / max) * 100}%;background-color:${st.color}"></i></span>
      <span class="pw-num">${counts.get(id) || 0}郡 · 带甲${Math.round(v * 4.5)}万</span>
    </div>`;
  }).join('') + (shown.length < 7
    ? `<p class="dt-empty" style="margin-top:6px">${SEVEN.filter((s) => !power.has(s)).map((s) => STATES[s].name).join('、')} 已亡</p>`
    : '');
}

/* ── 案上 ─────────────────────────────────────── */

const detail = $('detail');

let detailMode = 'act';
let actShown = null;

function showAct() {

function showRegion(i) {
  detailMode = 'region';
  actShown = null;

function startMarch(b) {
  march = { battle: b, step: -1 };
  table.play(b);
  document.body.classList.add('is-marching');
  cap.hidden = false;
  cap.classList.remove('is-lore');
  $('capName').textContent = b.name;
  $('capYear').textContent = `${formatYear(b.year)} · ${eraOf(b.year)}`;
  $('capDots').innerHTML = b.steps.map(() => '<i></i>').join('');
  syncCaption(true);
}

function endMarch(home = true) {
  if (!march) return;
  march = null;
  table.stop();
  if (home) table.flyHome();
  table.selected = null;
  document.body.classList.remove('is-marching');
  cap.hidden = true;
}

// 讲解：把随年而来的事说在盘上，而不是只躺在左栏里
function showLore(e) {
  endMarch();
  cap.hidden = false;
  cap.classList.add('is-lore');
  cap.classList.remove('is-final');
  cap.style.setProperty('--seal', SEALS[e.kind] || 'var(--bronze)');
  $('capName').textContent = e.title;
  $('capYear').textContent = `${formatYear(e.year)} · ${eraOf(e.year)}`;
  $('capNo').textContent = e.kind;
  $('capText').textContent = e.text;
  $('capDots').innerHTML = '';
}

function hideCaption() {
  endMarch();
  cap.hidden = true;
  queue = [];
  loreUntil = 0;
}

const NUMERALS = ['一', '二', '三', '四', '五', '六'];

function syncCaption(force = false) {
  if (!march || !table.playback) return;
  const step = table.playback.step;
  if (!force && step === march.step) return;
  march.step = step;
  const line = march.battle.steps[step] || march.battle.steps[march.battle.steps.length - 1];
  $('capNo').textContent = NUMERALS[step] || NUMERALS[march.battle.steps.length - 1];
  $('capText').textContent = line;
  const dots = $('capDots').children;
  for (let i = 0; i < dots.length; i++) dots[i].className = i <= step ? 'is-done' : '';
  $('caption').classList.toggle('is-final', step >= march.battle.steps.length - 1);
}

$('capClose').addEventListener('click', () => { hideCaption(); pause(); });

/* ── 主循环 ───────────────────────────────────── */

function setYear(y, animate = true) {
  const next = Math.max(START, Math.min(END, Math.round(y)));
  if (next === year) return;
  year = next;
  table.setYear(year, animate);
  ruler.setAttribute('aria-valuenow', String(year));
  ruler.setAttribute('aria-valuetext', `${formatYear(year)}年`);
  const at = pct(year);
  $('cursor').style.left = `${at}%`;
  $('cursorYear').textContent = formatYear(year);
  $('cursorYear').classList.toggle('is-flipped', at > 86);
  $('yearBig').textContent = formatYear(year);
  $('yearTag').textContent = eraOf(year);
  syncChron();
  syncPower();
  syncActs();
  if (detailMode === 'act') showAct();
  const change = CHANGES.find((c) => c.year === year && c.note);
  if (change && animate) showToast(`${formatYear(year)} · ${change.note}`);
  if (playing) {
    const evs = EVENTS.filter((e) => e.year === year);
    const war = evs.find((e) => e.battle);
    queue = evs.filter((e) => !e.battle);
    loreUntil = 0;
    if (war) selectBattle(war.battle);
    else if (queue.length) nextLore(performance.now());
  }
}

let queue = [];
let loreUntil = 0;

function nextLore(now) {
  const e = queue.shift();
  if (!e) return;
  showLore(e);
  if (playing) showAct();
  loreUntil = now + dwell(e);
}

let toastTimer = 0;

function showToast(text) {
  const el = $('toast');
  el.textContent = text;
  el.hidden = false;
  el.classList.remove('is-in');
  void el.offsetWidth;
  el.classList.add('is-in');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('is-in'); }, 2600);
}

function toggle() { playing ? pause() : start(); }

function start() {
  if (year >= END) { hideCaption(); setYear(START, false); }
  playing = true;
  lastTick = performance.now();
  $('playIcon').textContent = '❚❚';
  $('playText').textContent = '暂停';
}

function pause() {
  playing = false;
  $('playIcon').textContent = '▶';
  $('playText').textContent = '推演';
}

// 平淡的年份一带而过；有事的年份按其字数留出读完的工夫
// 只为「疆域动了但无事可讲」的年份留驻足；有事的年份由讲解自己决定长短
const EVENT_YEARS = new Set(EVENTS.map((e) => e.year));
const NOTABLE = new Set(CHANGES.map((c) => c.year).filter((y) => !EVENT_YEARS.has(y)));
let speed = 1;

function dwell(x) {
  if (typeof x === 'object') {
    return Math.min(5600, 1500 + (x.title.length + x.text.length) * 62) * speed;
  }
  return NOTABLE.has(x) ? 1250 * speed : 55;
}

$('btnSpeed').addEventListener('click', () => {
  speed = speed === 1 ? 0.5 : 1;
  const on = speed !== 1;
  $('btnSpeed').setAttribute('aria-pressed', String(on));
});

$('btnPlay').addEventListener('click', toggle);

function frame(now) {
  if (march) syncCaption();
  if (playing) {
    const pb = table.playback;
    if (pb && pb.t < 1) {
      lastTick = now;
    } else if (march) {
      endMarch();
      showAct();
      if (queue.length) nextLore(now + 300);
      lastTick = now + 300;
    } else if (loreUntil > now) {
      lastTick = now;
    } else if (queue.length) {
      nextLore(now);
      lastTick = now;
    } else if (now - lastTick > dwell(year)) {
      lastTick = now;
      if (!cap.hidden) cap.hidden = true;
      if (year >= END) pause(); else setYear(year + 1);
    }
  }
  table.draw(now);
  requestAnimationFrame(frame);
}

/* ── 交互 ─────────────────────────────────────── */

const tip = $('tip');
let dragging = null;
const touches = new Map();
let pinch = null;

const spread = () => {
  const [a, b] = [...touches.values()];
  return { d: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
};

canvas.addEventListener('pointerdown', (e) => {
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (touches.size === 2) { dragging = null; pinch = spread(); return; }
  dragging = { x: e.clientX, y: e.clientY, moved: 0 };
  canvas.setPointerCapture(e.pointerId);
  canvas.classList.add('is-dragging');
});

canvas.addEventListener('pointermove', (e) => {
  const r = canvas.getBoundingClientRect();
  const px = e.clientX - r.left;
  const py = e.clientY - r.top;
  if (touches.has(e.pointerId)) touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (touches.size === 2 && pinch) {
    const now = spread();
    if (pinch.d > 0) table.zoomAt(now.x - r.left, now.y - r.top, now.d / pinch.d);
    pinch = now;
    tip.hidden = true;
    return;
  }
  if (dragging) {
    table.pan(e.clientX - dragging.x, e.clientY - dragging.y);
    dragging.moved += Math.abs(e.clientX - dragging.x) + Math.abs(e.clientY - dragging.y);
    dragging.x = e.clientX;
    dragging.y = e.clientY;
    tip.hidden = true;
    return;
  }
  const b = table.battleAt(px, py);
  if (b) {
    table.hover = null;
    canvas.style.cursor = 'pointer';
    tip.hidden = false;
    tip.innerHTML = `<b>${b.name}</b> <span>${formatYear(b.year)}</span>`;
    tip.style.left = `${px}px`;
    tip.style.top = `${py}px`;
    return;
  }
  canvas.style.cursor = '';
  const i = table.regionAt(px, py);
  table.hover = i;
  if (i < 0) { tip.hidden = true; return; }
  const rg = REGIONS[i];
  const st = STATES[table.owner[rg.id]];
  tip.hidden = false;
  tip.innerHTML = `<b>${rg.name}</b> <span style="color:${st.ink || st.color}">${st.name}</span>`;
  tip.style.left = `${px}px`;
  tip.style.top = `${py}px`;
  $('hint').classList.add('is-hidden');
});

canvas.addEventListener('pointerup', (e) => {
  touches.delete(e.pointerId);
  if (touches.size < 2) pinch = null;
  const wasDrag = dragging && dragging.moved > 5;
  dragging = null;
  canvas.classList.remove('is-dragging');
  if (wasDrag) return;
  const r = canvas.getBoundingClientRect();
  const px = e.clientX - r.left;
  const py = e.clientY - r.top;
  const b = table.battleAt(px, py);
  if (b) { pause(); selectBattle(b.id, true); return; }
  const i = table.regionAt(px, py);
  if (i >= 0) { hideCaption(); showRegion(i); }
});

canvas.addEventListener('pointercancel', (e) => { touches.delete(e.pointerId); pinch = null; dragging = null; });
canvas.addEventListener('pointerleave', () => { table.hover = null; tip.hidden = true; });

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  table.zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 1 / 1.12);
  $('hint').classList.add('is-hidden');
}, { passive: false });

$('btnFit').addEventListener('click', () => table.fit());
$('btnZoomIn').addEventListener('click', () => table.zoomAt(table.css.w / 2, table.css.h / 2, 1.3));
$('btnZoomOut').addEventListener('click', () => table.zoomAt(table.css.w / 2, table.css.h / 2, 1 / 1.3));

for (const chip of document.querySelectorAll('.chip')) {
  chip.addEventListener('click', () => {
    const key = chip.dataset.layer;
    table.layers[key] = !table.layers[key];
    chip.classList.toggle('is-on', table.layers[key]);
    chip.setAttribute('aria-pressed', String(table.layers[key]));
  });
}

document.addEventListener('keydown', (e) => {
  if (e.target.closest('.ruler')) return;
  if (e.key === ' ' && !e.target.closest('button')) { e.preventDefault(); toggle(); }
});

new ResizeObserver(() => table.resize()).observe(stage);

/* ── 启程 ─────────────────────────────────────── */

if (document.fonts) document.fonts.load('700 24px "Sandtable Serif"').catch(() => {});

buildRuler();
buildChron();
table.resize();
table.setYear(START, false);
$('cursor').style.left = `${pct(START)}%`;
$('yearTag').textContent = eraOf(START);
syncChron();
syncPower();
syncActs();
showAct();
requestAnimationFrame(frame);
</script>
</body>
</html>
